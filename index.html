<title>Proelium Fatale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --bg: #07060a;

  --line: #2b2631;
  --ink: #f2ede6;

  --fire: #ff4a1c;
  --amber: #ffb02e;
  --player: #3df2ff;

  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body);
  display: flex; flex-direction: column; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box;
}
header {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  padding-bottom: 10px; flex-wrap: wrap;
}
header .logo { font-family: var(--f-display); font-size: 20px; color: var(--fire);
  text-shadow: 0 0 6px var(--fire), 0 0 18px var(--fire); letter-spacing: .02em; }
header .keys { font-family: var(--f-mono); font-size: 12px; color: var(--dim); }
#wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
#stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9;
  max-height: 100%; border: 1px solid var(--line); background: var(--bg); }
@supports (width: min(1px, 1px)) {
  #stage { width: min(100%, calc((100dvh - 80px) * 16 / 9)); }
}
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start; gap: 18px; padding: 16px;
  background: color-mix(in srgb, var(--bg) 86%, transparent); text-align: center; overflow-y: auto; }
.overlay::before { content: ''; margin-top: auto; }
.overlay::after { content: ''; margin-bottom: auto; }
.neon { font-family: var(--f-display); font-weight: 400; margin: 0; line-height: 1.1; text-wrap: balance; }
.neon.fire { color: var(--fire); text-shadow: 0 0 6px var(--fire), 0 0 22px var(--fire); }
.neon.cyan { color: var(--player); text-shadow: 0 0 6px var(--player), 0 0 22px var(--player); }
h1.neon { font-size: clamp(26px, 5vw, 48px); }
.label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
.bosses { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.boss { width: 200px; max-width: 100%; text-align: center; justify-content: center; align-items: center; padding: 18px 14px; background: var(--panel);
  border: 1px solid var(--line); color: var(--ink); font: inherit; cursor: pointer; display: grid; gap: 6px; }
.boss b { font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.boss[aria-pressed="true"] { border-color: var(--fire); box-shadow: 0 0 0 1px var(--fire), 0 0 16px var(--fire); }
.boss[aria-pressed="true"] b { color: var(--fire); text-shadow: 0 0 8px var(--fire); }
.boss:disabled { cursor: not-allowed; opacity: .45; }
.seg { display: inline-flex; border: 1px solid var(--line); }
.seg button { background: transparent; color: var(--dim); border: 0; padding: 8px 14px; font: 600 13px var(--f-body); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { color: var(--player); text-shadow: 0 0 8px var(--player); background: var(--panel); }
.go { background: transparent; color: var(--fire); border: 2px solid var(--fire); padding: 10px 34px;
  font: 400 20px var(--f-display); cursor: pointer; box-shadow: 0 0 12px var(--fire), inset 0 0 12px var(--fire);
  text-shadow: 0 0 8px var(--fire); }
.go.ghost { color: var(--dim); border-color: var(--line); box-shadow: none; text-shadow: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
button:focus-visible { outline: 2px solid var(--player); outline-offset: 3px; }
.sub { font-size: 13px; color: var(--dim); margin: 0; }
.tabs button { padding: 10px 28px; font-size: 15px; letter-spacing: .04em; }
.tabs button[aria-pressed="true"] { color: var(--fire); text-shadow: 0 0 8px var(--fire); }
.panel { display: grid; gap: 14px; justify-items: center; }
.panel[hidden] { display: none; }
.rules { margin: 0; padding: 12px 22px; list-style: none; border: 1px solid var(--line); background: var(--panel); display: grid; gap: 6px; font-size: 14px; color: var(--ink); }
.best { font-family: var(--f-mono); font-size: 15px; color: var(--amber); text-shadow: 0 0 8px var(--amber); }
.best.none { color: var(--dim); text-shadow: none; }
.bind { background: transparent; color: var(--player); border: 1px solid var(--line); padding: 8px 14px;
  font: 600 13px var(--f-body); cursor: pointer; min-width: 120px; }
.bind[data-wait="true"] { border-color: var(--player); box-shadow: 0 0 10px var(--player); }
.bind:disabled { opacity: .35; cursor: not-allowed; }
@media (max-width: 520px) { .boss { width: 100%; } header .keys { display: none; } }

<header>
  <div class="logo">PROELIUM FATALE</div>
  <div class="keys">P 일시정지 · ESC 메뉴로</div>
</header>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>

    <div id="menu" class="overlay">
      <div class="seg tabs" role="group" aria-label="모드" id="mode-tabs">
        <button data-mode="boss">보스전</button>
        <button data-mode="endless">무한 모드</button>
      </div>
      <div class="panel" id="boss-panel">
      <h1 class="neon fire">보스를 고르십시오</h1>
      <div class="bosses">
        <button class="boss" id="b-vergilius" aria-pressed="true">
          <b>베르길리우스</b>
        </button>
        <button class="boss" id="b-roland" aria-pressed="false">
          <b>롤랑 &amp; 안젤리카</b>
        </button>
        <button class="boss" id="b-spider" aria-pressed="false">
          <b>거미집</b>
        </button>
      </div>
      </div>
      <div class="panel" id="endless-panel" hidden>
        <h1 class="neon fire">무한 모드</h1>
        <ul class="rules">
          <li>30초마다 무작위 보스가 나타납니다.</li>
          <li>보스가 바뀔 때마다 체력이 1칸 회복됩니다.</li>
          <li>라운드가 지날수록 공격이 거세집니다.</li>
        </ul>
        <div class="best none" id="endless-best">아직 기록이 없습니다</div>
      </div>
      <div class="label">이동 방식</div>
      <div class="seg" role="group" aria-label="이동 방식">
        <button id="c-arrows" data-ctrl="arrows">방향키</button>
        <button id="c-wasd" data-ctrl="wasd">WASD</button>
        <button id="c-mouse" data-ctrl="mouse">마우스</button>
      </div>
      <div class="label">대쉬 · 쿨타임은 1초이며, 쓰는 동안 잠깐 무적이 됩니다</div>
      <div class="row">
        <div class="seg" role="group" aria-label="대쉬 입력">
          <button id="dash-key" data-dash="key">키보드</button>
          <button id="dash-mouse" data-dash="mouse">마우스 클릭</button>
        </div>
        <button class="bind" id="dash-bind">키: Space</button>
      </div>
      <div class="label">그래픽 품질 · 화면이 끊기면 낮춰 주십시오</div>
      <div class="seg" role="group" aria-label="그래픽 품질" id="quality">
        <button data-q="auto">자동</button>
        <button data-q="2">높음</button>
        <button data-q="1">중간</button>
        <button data-q="0">낮음</button>
      </div>
      <div class="label">화면 흔들림</div>
      <div class="seg" role="group" aria-label="화면 흔들림" id="shake-opt">
        <button data-shake="1">켜기</button>
        <button data-shake="0">끄기</button>
      </div>
      <button class="go" id="start">시작</button>
      <p class="sub" id="menu-sub">210초 동안 버티면 승리합니다. 체력은 5칸입니다. 키보드로 이동할 때 Shift를 누르면 천천히 움직입니다.</p>
      
    </div>

    <div id="result" class="overlay" hidden>
      <h1 class="neon" id="r-title">버텨냈습니다</h1>
      <p class="sub" id="r-sub"></p>
      <div class="row">

        <button class="go ghost" id="back">보스 선택</button>

    }
  }
  if ((style === "ring" || style === "ringB") && !(spider && spider.closing)) {
    const m = matScale();
    width *= m;
    len *= m;
    if (curve) {
      curve *= m;
    }
  }
  const h = {
    cx,
    cy,
    angle,
    len,
    width,
    curve: curve ?? rand(-1, 1) * len * .12,
    dir: Math.random() < .5 ? 1 : -1,
    t: -delay,
    warn,
    sweep: .09,
    active: .16,
    fade: .45,
    scar: .9,
    fired: false,
    blood: !style && bloodMode,
    style,
    skill: style === "roland" ? "durandal" : null
  };
  if (h.blood) {
    const top = smoothNoise(SAMPLES + 1, .84, 1.14, 6), bot = smoothNoise(SAMPLES + 1, .84, 1.14, 6);
    h.jag = top.map((v, i) => [ v, bot[i] ]);
  }
  h.pts = buildBlade(h);
  return h;
}

function smoothNoise(n, lo, hi, every) {
  const knots = Array.from({
    length: Math.ceil(n / every) + 2
  }, () => rand(lo, hi));
  return Array.from({
    length: n
  }, (_, i) => {
    const f = i / every, a = Math.floor(f), t = f - a, s = t * t * (3 - 2 * t);
    return knots[a] * (1 - s) + knots[a + 1] * s;
  });
}

function buildBlade(h) {
  const dx = Math.cos(h.angle), dy = Math.sin(h.angle), pts = [];
  for (let i = 0; i <= SAMPLES; i++) {
    const u = i / SAMPLES, s = (u * 2 - 1) * h.len;
    const bend = h.curve * (1 - (u * 2 - 1) ** 2);
    pts.push({
      x: h.cx + dx * s - dy * bend,
      y: h.cy + dy * s + dx * bend,
      nx: -dy,
      ny: dx,
      hw: h.width / 2 * Math.pow(Math.sin(Math.PI * u), .7)
    });
  }
  return pts;
}

function drawnRange(h) {
  const after = h.t - h.warn;
  const p = clamp(after / h.sweep, 0, 1);
  const n = Math.round(p * SAMPLES);
  return h.dir === 1 ? [ 0, n ] : [ SAMPLES - n, SAMPLES ];
}

function startSwing() {

function swingPose(sw) {
  const S = SWINGS[sw.type], u = Math.min(1, sw.t / S.dur);
  const f = S.from * sw.side, to = S.to * sw.side, back = Math.sign(f) * .35, start = f + back;
  const out = {
    ang: sw.base,
    ext: 0,
    alpha: 1,
    trail: null
  };
  if (u < .25) {
    const e = (u / .25) ** 2;
    out.ang = sw.base + f + back * e;
    if (S.thrust) {
      out.ext = -14 * e;
    }
  } else if (u < .55) {
    const k = (u - .25) / .3, e = 1 - Math.pow(1 - k, 3);
    out.ang = sw.base + start + (to - start) * e;
    if (S.thrust) {
      out.ext = -14 + 40 * e;
    }
    out.trail = {
      a0: sw.base + start,
      a1: out.ang,
      alpha: .55
    };
  } else {
    const k = (u - .55) / .45;
    out.ang = sw.base + to - Math.sign(to - f) * .12 * Math.sin(Math.PI * Math.min(1, k * 1.6));
    if (S.thrust) {
      out.ext = 26 - 10 * k;
    }
    out.alpha = 1 - k * k;
    out.trail = {
      a0: sw.base + start,
      a1: sw.base + to,
      alpha: .55 * (1 - k)
    };
  }
  return out;
}

function axePos(A, s) {
  const bend = 80;
  if (s < A.out) {
    const u = s / A.out, e = 1 - (1 - u) * (1 - u);

    return {
      x: A.ox + (A.tx - A.ox) * e + A.nx * w,
      y: A.oy + (A.ty - A.oy) * e + A.ny * w
    };
  }
  const u = Math.min(1, (s - A.out) / A.back), e = u * u;
  const w = -Math.sin(Math.PI * u) * bend * A.side;
  return {
    x: A.tx + (A.ox - A.tx) * e + A.nx * w,
    y: A.ty + (A.oy - A.ty) * e + A.ny * w
  };
}

    vx: Math.cos(a) * sp,
    vy: Math.sin(a) * sp,
    rot: rand(0, 6),
    vr: rand(-14, 14),
    pts,
    life: rand(.8, 1.3),
    max: 1.3
  });
}

function addGouge(y, h, dir) {
  const top = [], bot = [];
  for (let x = -20; x <= W + 20; x += 24) {
    top.push([ x, -h * rand(.12, .3) ]);
    bot.push([ x, h * rand(.12, .3) ]);
  }
  particles.push({
    type: "gouge",
    x: 0,
    y,
    vx: 0,
    vy: 0,
    top,
    bot,
    life: 1.6,
    max: 1.6
  });
  for (let i = 0; i < 14; i++) {
    const x = rand(0, W);
    addSlab(x, y + rand(-h, h) * .3, dir > 0 ? rand(-.35, .35) : Math.PI + rand(-.35, .35), 0, rand(300, 620), rand(5, 11));
  }
  for (let i = 0; i < 6; i++) {
    const x = rand(40, W - 40);
    addCrack(x, y, (Math.random() < .5 ? -1 : 1) * Math.PI / 2 + rand(-.6, .6), h * rand(.5, 1.1), 1.4, RUBBLE.crack);
  }
}

function drawGroundMarks() {
  ctx.save();
  ctx.lineJoin = "round";
  for (const p of particles) {
    if (p.type !== "crater" && p.type !== "gouge") {
      continue;
    }
    const a = Math.min(1, p.life / p.max * 1.8);
    ctx.save();
    ctx.translate(p.x, p.y);
    if (p.type === "crater") {
      ctx.globalAlpha = a * .85;
      ctx.fillStyle = RUBBLE.fill;
      ctx.beginPath();
      p.poly.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = RUBBLE.rim;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.globalAlpha = a * .35;
      ctx.strokeStyle = RUBBLE.hi;
      ctx.lineWidth = 1;
      ctx.save();
      ctx.scale(.8, .8);
      ctx.stroke();
      ctx.restore();
      ctx.globalAlpha = a * .7;
      ctx.strokeStyle = RUBBLE.crack;
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      for (const L of p.lines) {
        L.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
      }
      ctx.stroke();
    } else {
      ctx.globalAlpha = a * .8;
      ctx.fillStyle = RUBBLE.fill;
      ctx.beginPath();
      p.top.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
      for (let i = p.bot.length - 1; i >= 0; i--) {
        ctx.lineTo(p.bot[i][0], p.bot[i][1]);
      }
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = RUBBLE.rim;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.globalAlpha = a * .4;
      ctx.strokeStyle = RUBBLE.hi;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i < 3; i++) {
        const yy = (i - 1) * 5;
        ctx.moveTo(0, yy);
        for (let x = 0; x <= W; x += 40) {
          ctx.lineTo(x, yy + Math.sin(x * .07 + i) * 2);
        }
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
}

function addShards(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2);
    particles.push({
      type: "shard",
      x,
      y,
      vx: Math.cos(a) * rand(80, 320),
      vy: Math.sin(a) * rand(80, 320) - 80,
      rot: rand(0, 6),
      vr: rand(-14, 14),
      s: rand(5, 11),
      life: rand(.5, .9),
      max: .9,
      color: pick([ DUO.aWhite, DUO.aMid ])
    });
  }
}

    origin: ANGELICA_POS,
    angles,
    warn: .4,
    delay,
    speed: 1150,

  });

function weaponFireFx(h) {
  if (h.iaido) {

      max: .6
    });

  if (h.crystal) {
    for (let i = 8; i <= SAMPLES - 8; i += 8) {

      if (onScreen(p.x, p.y)) {
        addShards(p.x, p.y, 2);

      if (!onScreen(p.x, p.y)) {

      addCrack(p.x, p.y, rand(-.4, .4) + (Math.random() < .5 ? 0 : Math.PI), rand(60, 130), 2);

function updateDuo(dt) {

  for (const l of laters) {

    if (l.t <= 0 && !l.done) {

      l.fn();
    }
  }
  laters = laters.filter(l => !l.done);
  for (const b of bullets) {
    b.t += dt;

    if (!b.fired) {

          vr: rand(-18, 18),
          life: .9,

    }
    const px = b.x, py = b.y;
    b.x += Math.cos(b.ang) * b.speed * dt;

    if (Math.random() < .7) {
      particles.push({
        type: "streak",
        x: b.x,

    if (vulnerable() && Math.hypot(player.x - (px + sx * tq), player.y - (py + sy * tq)) < b.r + player.r * .6) {

      spawnBgLine();
      bgNext = elapsed + rand(1.6, 2.6);
    }
  }
  for (const L of bgLines) {
    L.t += dt;
  }
  bgLines = bgLines.filter(L => L.t < L.life);
  if (duo.aura) {
    smokes.push(makeSmoke(1));
    if (Math.random() < .5) {
      smokes.push(makeSmoke(1));
    }
  }
  for (const m of smokes) {
    m.life -= dt;
    m.x += m.vx * dt;
    m.y += m.vy * dt;
    m.vx += Math.sin(m.life * 9 + m.seed) * 30 * dt;
  }
  smokes = smokes.filter(m => m.life > 0);
  updateFurioso(dt);
  if (duo.banner) {
    duo.banner.t += dt;
    if (duo.banner.t > duo.banner.dur) {
      duo.banner = null;
    }
  }
  for (const k in duo.pageFlash) {
    duo.pageFlash[k] = Math.max(0, duo.pageFlash[k] - dt * 2);
  }
  if (duo.mask && !duo.furi) {
    duo.maskT -= dt;
    duo.maskFlash = Math.max(0, (duo.maskFlash || 0) - dt * 2);
    if (duo.maskT <= 0) {
      duo.maskT = 3;
      const keys = Object.keys(MASK_SKILLS);
      let k = pick(keys);
      while (k === duo.maskSkill) {
        k = pick(keys);
      }
      duo.maskSkill = k;
      duo.maskFlash = 1;
      particles.push({
        type: "ring",
        x: ROLAND_POS.x,
        y: ROLAND_POS.y,
        vx: 0,
        vy: 0,
        r: 16,
        grow: 120,
        life: .4,
        max: .4,
        color: DUO.rEdge
      });
    }
  }
  if (duo.maskAnim) {
    const M = duo.maskAnim;
    M.t += dt;
    if (!M.on && M.t > 1.2) {
      M.on = true;
      duo.mask = true;
      duo.maskT = 1.5;
      shake = Math.max(shake, 14);
      flash = Math.max(flash, 1.4);
      flashColor = "#000000";
      for (let i = 0; i < 3; i++) {
        particles.push({
          type: "ring",
          x: ROLAND_POS.x,
          y: ROLAND_POS.y,
          vx: 0,
          vy: 0,
          r: 14,
          grow: 500 + i * 300,
          life: .8,
          max: .8,
          color: DUO.rEdge
        });
      }
    }
    if (M.t > 3.2) {
      duo.maskAnim = null;
    }
  }
  if (duo.say) {
    duo.say.t += dt;
    if (duo.say.t > duo.say.text.length / TYPE_SPEED + 1.3) {
      duo.say = null;
    }
  }
  if (duo.swing) {
    duo.swing.t += dt;
    if (duo.swing.t > SWINGS[duo.swing.type].dur) {
      duo.swing = null;
    }
  }
  duo.gunT = Math.max(0, duo.gunT - dt);
  duo.recoil = Math.max(0, duo.recoil - dt * 6);
  if (shakeHold > 0) {
    shakeHold -= dt;
    shake = Math.max(shake, 7 + 10 * shakeHold);
  }
  for (const c of crescents) {
    c.t += dt;
    if (c.t < c.warn) {
      continue;
    }
    if (!c.fired) {
      c.fired = true;
      shake = Math.max(shake, 8);
      flash = Math.max(flash, .5);
      flashColor = "#000000";
    }
    c.trail.push({
      x: c.x,
      y: c.y,
      life: .16
    });
    c.x += Math.cos(c.ang) * c.speed * dt;
    c.y += Math.sin(c.ang) * c.speed * dt;
    if (Math.random() < .6) {
      addSpark(c.x, c.y, c.ang + Math.PI + rand(-.8, .8), rand(120, 300), pick(STYLE.roland.sparks));
    }
    const cx = c.x - Math.cos(c.ang) * c.R, cy = c.y - Math.sin(c.ang) * c.R;
    const d = Math.hypot(player.x - cx, player.y - cy);
    let da = Math.atan2(player.y - cy, player.x - cx) - c.ang;
    da = Math.atan2(Math.sin(da), Math.cos(da));
    if (vulnerable() && Math.abs(da) < .95 && Math.abs(d - c.R) < c.th * .5 * Math.cos(da * .9) + player.r * .6) {
      damage({
        angle: c.ang + Math.PI / 2
      });
    }
    if (!onScreen(c.x, c.y) && c.t > c.warn + .3) {
      c.done = true;
    }
  }
  for (const c of crescents) {
    for (const t of c.trail) {
      t.life -= dt;
    }
    c.trail = c.trail.filter(t => t.life > 0);
  }
  crescents = crescents.filter(c => !c.done);
  for (const C of cleaves) {
    C.t += dt;
    const s2 = C.t - C.warn;
    if (s2 < 0) {
      continue;
    }
    if (s2 < C.fall) {
      const k = s2 / C.fall;
      C.tipY = -40 + (H + 20) * k * k * k;
      if (vulnerable() && Math.abs(player.x - C.x) < C.w / 2 + player.r * .5 && player.y < C.tipY) {
        damage({
          angle: Math.PI / 2
        });
      }
    } else if (!C.fired) {
      C.fired = true;
      C.tipY = H + 20;
      if (vulnerable() && Math.abs(player.x - C.x) < C.w / 2 + player.r * .5) {
        damage({
          angle: Math.PI / 2
        });
      }
      shake = Math.max(shake, 34);
      shakeHold = .6;
      flash = Math.max(flash, 1.2);
      flashColor = DUO.aWhite;
      for (let y = 40; y < H; y += 55) {
        addCrack(C.x - C.w / 2, y, Math.PI + rand(-.5, .5), rand(70, 150), 2.2);
        addCrack(C.x + C.w / 2, y, rand(-.5, .5), rand(70, 150), 2.2);
        addDebris(C.x + rand(-1, 1) * C.w / 2, y, 3, 1.4);
      }
      for (const sx of [ -1, 1 ]) {
        particles.push({
          type: "ring",
          x: C.x + sx * C.w / 2,
          y: H - 40,
          vx: 0,
          vy: 0,
          r: 20,
          grow: 700,
          life: .5,
          max: .5,
          color: DUO.aWhite
        });
      }
      particles.push({
        type: "mist",
        x: C.x,
        y: H - 60,
        vx: 0,
        vy: 0,
        r: C.w * .6,
        grow: 200,
        life: .8,
        max: .8,
        color: DUO.aGrey
      });
    }
    if (s2 > C.fall + C.hold) {
      C.done = true;
    }
  }
  cleaves = cleaves.filter(C => !C.done);
  for (const f of flurries) {
    f.t += dt;
    const T = f.t, end = f.track + f.lock + f.dur;
    if (T < f.track) {
      const k = Math.min(1, dt * 3.5);
      f.x += (player.x - f.x) * k;
      f.y += (player.y - f.y) * k;
    } else if (T < f.track + f.lock) {
      if (!f.locked) {
        f.locked = true;
        particles.push({
          type: "glint",
          x: f.x,
          y: f.y,
          vx: 0,
          vy: 0,
          life: .6,
          max: .6
        });
      }
    } else if (T < end) {
      if (!f.fired) {
        f.fired = true;
        shake = Math.max(shake, 12);
        flash = Math.max(flash, .6);
        flashColor = DUO.aWhite;
      }
      shake = Math.max(shake, 4);
      for (let i = 0; i < 3; i++) {
        particles.push({
          type: "cutline",
          x: f.x,
          y: f.y,
          vx: 0,
          vy: 0,
          R: f.R,
          a: rand(0, Math.PI),
          off: rand(-.85, .85) * f.R,
          w: rand(1.2, 2.6),
          life: .14,
          max: .14
        });
      }
      if (Math.random() < .6) {
        addSpark(f.x + rand(-1, 1) * f.R * .6, f.y + rand(-1, 1) * f.R * .6, rand(0, Math.PI * 2), rand(150, 380), pick(STYLE.angelica.sparks));
      }
      if (vulnerable() && Math.hypot(player.x - f.x, player.y - f.y) < f.R + player.r * .5) {
        damage({
          angle: rand(0, Math.PI)
        });
      }
    } else if (!f.ended) {
      f.ended = true;
      shake = Math.max(shake, 10);
      const a = rand(0, Math.PI);
      particles.push({
        type: "cutline",
        x: f.x,
        y: f.y,
        vx: 0,
        vy: 0,
        R: f.R * 1.25,
        a,
        off: 0,
        w: 4,
        life: .35,
        max: .35
      });
      particles.push({
        type: "crack",
        x: f.x,
        y: f.y,
        vx: 0,
        vy: 0,
        pts: [ [ f.x - Math.cos(a) * f.R, f.y - Math.sin(a) * f.R ], [ f.x + Math.cos(a) * f.R, f.y + Math.sin(a) * f.R ] ],
        w: 1.4,
        life: .7,
        max: .7
      });
    }
    if (T > end + f.fade) {
      f.done = true;
    }
  }
  flurries = flurries.filter(f => !f.done);
}

function around(dist, ang = rand(0, Math.PI * 2)) {
  return {
    x: clamp(player.x + Math.cos(ang) * dist, 20, W - 20),
    y: clamp(player.y + Math.sin(ang) * dist, 20, H - 20)
  };
}

function xSlash(x, y, len, width, warn, delay = 0, extra) {
  const a = rand(0, Math.PI);
  for (const d of [ 0, Math.PI / 2 ]) {
    const h = makeSlash({
      cx: x,
      cy: y,
      angle: a + d,
      width,
      len,
      warn,
      delay,
      curve: 0,
      style: "angelica"
    });
    if (extra) {
      extra(h);
    }
    hazards.push(h);
  }
}

const FURI_START = 1.3, FURI_STEP = .95;

function startFurioso() {
  duo.furiQueued = false;
  if (duo.furi) {
    return;
  }
  duo.furi = {
    t: 0,
    i: 0
  };
  duo.pages = new Set;
  duo.pageFlash = {};
  shake = Math.max(shake, 12);
  flash = Math.max(flash, .8);
  flashColor = DUO.rEdge;
  duo.r = 1;
}

function updateFurioso(dt) {
  const F = duo.furi;
  if (!F) {
    return;
  }
  F.t += dt;
  while (F.i < FURIOSO.length && F.t >= FURI_START + F.i * FURI_STEP) {
    const step = FURIOSO[F.i];
    duo.weapon = step.name;
    duo.kind = step.icon;
    duo.weaponT = .9;
    duo.r = 1;
    F.cur = {
      icon: step.icon,
      x: player.x,
      y: player.y,
      t: 0,
      n: F.i + 1
    };
    step.fn();
    shake = Math.max(shake, 10);
    F.pulse = 1;
    F.i++;
  }
  if (F.cur) {
    F.cur.t += dt;
  }
  F.pulse = Math.max(0, (F.pulse || 0) - dt * 3);
  if (F.i >= FURIOSO.length && F.t > FURI_START + FURIOSO.length * FURI_STEP + 1.8) {
    duo.furi = null;
    nextPatternAt = elapsed + .8;
  }
}

  if (transformT >= 0) {
    transformT = Math.max(transformT, 1.6);
  }
  shake = 26;
  flash = 1.8;
  flashColor = BLOOD.bright;
  sigilPulse = 1;
  for (let i = 0; i < 3; i++) {
    particles.push({
      type: "ring",
      x: W / 2,
      y: 46,
      vx: 0,
      vy: 0,
      r: 20,
      grow: 480 + i * 260,
      life: .6,
      max: .6,
      color: i === 1 ? BLOOD.mid : BLOOD.bright
    });
  }
  for (let i = 0; i < 45; i++) {
    addBlood(W / 2, 46, rand(0, Math.PI * 2), rand(150, 460), 1.2);
  }
}

function startScript(n) {
  const s = BOSSES[bossKey].scripts?.[n];
  if (!s) {
    return;
  }
  script = s;
  scriptIdx = 0;
  scriptT = 0;
}

function stepDuration(step) {
  if (step.say) {
    return step.say.length / TYPE_SPEED + (step.hold ?? 1.5);
  }
  return step.wait ?? 0;
}

function runScript(dt) {
  const step = script[scriptIdx];
  if (!step) {
    script = null;
    line = null;
    nextPatternAt = elapsed + .6;
    return;
  }
  if (scriptT === 0) {
    if (step.clear) {
      line = null;
    }
    if (step.say) {
      line = {
        text: step.say,
        t: 0,
        tone: step.tone,
        name: step.name
      };
    }
    if (step.act) {
      SCRIPT_ACTS[step.act]();
      sigilPulse = 1;
    }
  }
  scriptT += dt;
  if (scriptT >= stepDuration(step)) {
    scriptIdx++;
    scriptT = 0;
  }
}

function skipScript() {
  if (!script) {
    return;
  }
  scriptIdx = script.length;
  scriptT = 0;
  hazards = hazards.filter(h => !h.big);
  if (bossKey === "vergilius" && curPhase >= 4 && !bloodMode) {
    finishTransform();
  }
  if (bossKey === "roland" && curPhase >= 4 && !duo.solo) {
    finishTakeover();
  }
  if (bossKey === "roland" && curPhase >= 5 && !duo.mask) {
    finishMask();
  }
  if (bossKey === "spider") {
    for (const k in FATHERS) {
      if (FATHERS[k].join <= curPhase) {
        FATHERS[k].arrived = true;
      }
    }
  }
  if (bossKey === "spider" && spider.laev) {
    spider.laev = null;
    hazards = hazards.filter(h => !h.laev);
  }
  if (bossKey === "spider") {
    spider.seals = Math.max(spider.seals, clamp(curPhase - 3, 0, 3));
  }
}

function phase() {
  const p = Math.min(6, 1 + Math.floor(elapsed / phaseLen()));
  return Math.min(p, BOSSES[bossKey].maxPhase);
}

function patternGap() {
  const B = BOSSES[bossKey];
  return [ 0, 1.5, 1.2, .95, .9, 1, .8 ][phase()] * (B.gapByPhase?.[phase()] ?? B.gapMul ?? 1) * endlessAggro();
}

function schedule() {
  if (bossKey === "vergilius" && phase() >= 6) {
    if (ult) {
      return;
    }
    if (elapsed >= ultNext) {
      startUltimate();
      return;
    }
  }
  if (duo.furi) {
    return;
  }
  if (bossKey === "spider" && (spider.overheat || spider.overheatQueued || spider.tibia || spider.tibiaQueued || spider.laev)) {
    return;
  }
  if (bossKey === "spider" && spiderUltBusy()) {
    const owner = spider.disposal ? "thumb" : spider.closing ? "ring" : spider.rend ? "pinky" : spider.replica ? "index" : spider.lu ? "middle" : null;
    if (phase() < 6 || !owner || elapsed < nextPatternAt) {
      return;
    }
    nextPatternAt = elapsed + 2.2 + (SP.support(owner) || 0);
    return;
  }
  if (elapsed < nextPatternAt) {
    return;
  }
  let pool = BOSSES[bossKey].patterns.filter(p => p.phase <= phase() && (!p.until || phase() <= p.until) && (!p.after || elapsed >= p.after)).flatMap(p => Array(p.weight ?? 1).fill(p.name));
  if (endless && bossKey === "roland" && phase() >= 6 && endless.n < ENDLESS_FURIOSO_FROM) {
    const lite = pool.filter(n => !n.startsWith("solo"));
    if (lite.length) {
      pool = lite;
    }
  }
  if (bossKey === "roland" && phase() >= 6 && Math.random() < .7) {
    const fresh = pool.filter(n => (PATTERN_PAGES[n] || []).some(pg => !duo.pages.has(pg)));
    if (fresh.length) {
      pool = fresh;
    }
  }
  if (bossKey === "spider") {
    pool = pool.filter(n => n !== "midGrudge" || elapsed >= (spider.grudgeNext || 0));
  }
  if (bossKey === "spider" && phase() >= 6) {
    pool = [ "allOut" ];
  }
  if (bossKey === "spider" && phase() < 6) {
    const stage = Object.keys(FATHERS).find(k => FATHERS[k].join === phase());
    const mine = new Set(FATHER_PATTERNS[stage] || []);
    const on = pool.filter(n => mine.has(n));
    if (on.length) {
      pool = on;
    }
  }
  let pick = pool[Math.floor(Math.random() * pool.length)];
  if (new Set(pool).size > 1) {
    while (pick === lastPattern) {
      pick = pool[Math.floor(Math.random() * pool.length)];
    }
  }
  const extraRest = PATTERNS[pick]() || 0;
  if (endless && endless.cur.father && Math.random() < ENDLESS_FATHER_COMBO) {
    const f = endless.cur.father, all2 = FATHER_PATTERNS[f].filter(n => n !== "midGrudge"), other = all2.filter(n => n !== pick), pool2 = other.length ? other : all2;
    if (pool2.length) {
      const n2 = pool2[Math.floor(Math.random() * pool2.length)];
      later(.5, () => {
        if (!spiderUltBusy() && !spider.overheat) {
          SP[n2]();
        }
      });
    }
  }
  lastPattern = pick;
  sigilPulse = 1;
  nextPatternAt = elapsed + patternGap() + extraRest;
}

function update(dt) {
  movePlayer(dt);
  if (line) {
    line.t += dt;
  }
  if (script) {
    runScript(dt);
  } else {
    elapsed += dt;
    if (endless) {
      updateEndless(dt);
    }
    if (phase() > curPhase) {
      curPhase = phase();
      if (curPhase >= 6) {
        ultNext = elapsed + 1.5;
      }
      startScript(curPhase);
    }
    if (!script) {
      schedule();
    }
  }
  for (const h of hazards) {
    h.t += dt;
    const after = h.t - h.warn;
    if (after < 0) {
      continue;
    }
    if (!h.fired) {
      h.fired = true;
      onSlashFire(h);
    }
    if (after < h.sweep) {
      sweepEffects(h);
    }
    if (after < h.sweep + h.active + h.fade) {
      bladeFlames(h);
    }
    if (after < h.sweep + h.active) {
      if (vulnerable() && hitBlade(h)) {
        damage(h);
      }
    } else if (after > h.sweep + h.active + h.fade && Math.random() < (h.blood ? .12 : .5)) {
      const p = h.pts[Math.floor(Math.random() * h.pts.length)];
      if (h.blood) {
        addBlood(p.x, p.y, Math.PI / 2, rand(10, 40), .7);
      } else if (!h.style) {
        addFlame(p.x, p.y, .6);
      }
    }
  }
  hazards = hazards.filter(h => h.t < h.warn + h.sweep + h.active + h.fade + h.scar);
  updateSpears(dt);
  updateWaves(dt);
  updatePools(dt);
  if (ult) {
    updateUltimate(dt);
  }
  updateDuo(dt);
  updateSpider(dt);
  const pops = [];
  for (const p of particles) {
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.type === "flame") {
      p.vy -= 70 * dt;
      p.vx += rand(-420, 420) * dt;
      p.vx *= .94;
      if (!p.core && Math.random() < dt * .35) {
        pops.push(makePop(p.x, p.y));
      }
    } else if (p.type === "spark") {
      p.vy += 420 * dt;
      p.vx *= .97;
      p.vy *= .97;
    } else if (p.type === "blood" && !p.inward) {
      p.vy += 650 * dt;
      p.vx *= .98;
    } else if (p.type === "ring" || p.type === "mist") {
      p.r += p.grow * dt;
    } else if (p.type === "slab") {
      const f = Math.max(0, 1 - 4.5 * dt);
      p.vx *= f;
      p.vy *= f;
      p.rot += p.vr * dt;
      p.vr *= f;
    } else if (p.type === "casing" || p.type === "debris" || p.type === "shard") {
      p.vy += 700 * dt;
      p.vx *= .99;
      p.rot += p.vr * dt;
    }
    if (p.life <= 0 && p.type === "blood" && !p.inward && Math.random() < .2) {
      pops.push(makeSplat(p.x, p.y, p.size));
    }
  }
  for (const q of pops) {
    particles.push(q);
  }
  let alive = 0;
  for (let i = 0; i < particles.length; i++) {
    if (particles[i].life > 0) {
      particles[alive++] = particles[i];
    }
  }
  particles.length = alive;
  const cap = Math.min(MAX_PARTICLES, QUALITY[quality].parts);
  if (particles.length > cap) {
    particles.splice(0, particles.length - cap);
  }
  if (player.inv > 0) {
    player.inv -= dt;
  }
  player.stun = Math.max(0, player.stun - dt);
  player.slowT = Math.max(0, (player.slowT || 0) - dt);
  player.dashT = Math.max(0, player.dashT - dt);
  player.dashInv = Math.max(0, player.dashInv - dt);
  player.dashCd = Math.max(0, player.dashCd - dt);
  if (player.dashInv > 0) {
    player.trail.push({
      x: player.x,
      y: player.y,
      life: .25
    });
  }
  for (const t of player.trail) {
    t.life -= dt;
  }
  player.trail = player.trail.filter(t => t.life > 0);
  shake = Math.max(0, shake - dt * 40);
  flash = Math.max(0, flash - dt * 4);
  hurt = Math.max(0, hurt - dt * 2.5);
  sigilPulse = Math.max(0, sigilPulse - dt * 2);
  if (transformT >= 0) {
    transformT += dt;
    const sx = W / 2, sy = 46;
    if (transformT < 1.6) {
      for (let i = 0; i < 7; i++) {
        const a = rand(0, Math.PI * 2), r = rand(170, 330), life = rand(.45, .85);
        const x = sx + Math.cos(a) * r, y = sy + Math.sin(a) * r * .8;
        const tang = a + Math.PI / 2;
        particles.push({
          type: "blood",
          inward: true,
          x,
          y,
          vx: (sx - x) / life + Math.cos(tang) * 140,
          vy: (sy - y) / life + Math.sin(tang) * 140,
          life,
          max: life,
          size: rand(2, 4.5),
          color: pick([ BLOOD.bright, BLOOD.mid, BLOOD.dark ])
        });
      }
    }
    if (!bloodMode && transformT >= 1.6) {
      finishTransform();
    }
    if (transformT > 2.4) {
      transformT = -1;
    }
  }
  if (bloodMode && Math.random() < dt * 5) {
    addBlood(W / 2 + rand(-22, 22), 46 + rand(-6, 24), Math.PI / 2 + rand(-.6, .6), rand(20, 90), .8);
  }
  if (!script && elapsed >= CLEAR_TIME) {
    endGame(true);
  }
}

const STUN_TIME = .7;

function movePlayer(dt) {
  if (player.knockT > 0) {
    const k = player.knockT / .22;
    player.knockT -= dt;
    player.x = clamp(player.x + player.knockV.x * k * dt, player.r, W - player.r);
    player.y = clamp(player.y + player.knockV.y * k * dt, player.r, H - player.r);
    return;
  }
  if (player.stun > 0) {
    player.x = clamp(player.x, player.r, W - player.r);
    player.y = clamp(player.y, player.r, H - player.r);
    return;
  }
  if (control === "mouse") {
    if (player.slowT > 0) {
      const f = Math.min(1, dt * 5);
      player.x += (mouse.x - player.x) * f;
      player.y += (mouse.y - player.y) * f;
    } else {
      player.x = mouse.x;
      player.y = mouse.y;
    }
  } else {
    const map = control === "wasd" ? {
      u: "KeyW",
      d: "KeyS",
      l: "KeyA",
      r: "KeyD"
    } : {
      u: "ArrowUp",
      d: "ArrowDown",
      l: "ArrowLeft",
      r: "ArrowRight"
    };
    const vx = (keys.has(map.r) ? 1 : 0) - (keys.has(map.l) ? 1 : 0);
    const vy = (keys.has(map.d) ? 1 : 0) - (keys.has(map.u) ? 1 : 0);
    const len = Math.hypot(vx, vy) || 1;
    if (vx || vy) {
      player.face = {
        x: vx / len,
        y: vy / len
      };
    }
    if (player.dashT > 0) {
      player.x += player.dashDir.x * DASH_SPEED * dt;
      player.y += player.dashDir.y * DASH_SPEED * dt;
    } else {
      const slow = (keys.has("ShiftLeft") || keys.has("ShiftRight")) && !dashCfg.key.startsWith("Shift");
      const speed = (slow ? 170 : 330) * (player.slowT > 0 ? .5 : 1);
      player.x += vx / len * speed * dt;
      player.y += vy / len * speed * dt;
    }
  }
  player.x = clamp(player.x, player.r, W - player.r);
  player.y = clamp(player.y, player.r, H - player.r);
}

function hitBlade(h) {
  const [i0, i1] = drawnRange(h);
  for (let i = i0; i < i1; i++) {
    const a = h.pts[i], b = h.pts[i + 1];
    const abx = b.x - a.x, aby = b.y - a.y;
    const t = clamp(((player.x - a.x) * abx + (player.y - a.y) * aby) / (abx * abx + aby * aby), 0, 1);
    const d = Math.hypot(player.x - (a.x + abx * t), player.y - (a.y + aby * t));
    if (d < a.hw + (b.hw - a.hw) * t + player.r * .5) {
      return true;
    }
  }
  return false;
}

const DASH_CD = 1;

const DASH_MOVE = .16;

const DASH_INV = .4;

const DASH_SPEED = 1150;

function vulnerable() {
  return player.inv <= 0 && player.dashInv <= 0 && !(bossKey === "spider" && seatedSafe());
}

function tryDash() {
  if (state !== "play" || script || player.dashCd > 0 || player.stun > 0) {
    return;
  }
  player.dashCd = DASH_CD;
  player.dashInv = DASH_INV;
  if (control !== "mouse") {
    player.dashT = DASH_MOVE;
    player.dashDir = {
      ...player.face
    };
  }
  particles.push({
    type: "ring",
    x: player.x,
    y: player.y,
    vx: 0,
    vy: 0,
    r: 6,
    grow: 280,
    life: .3,
    max: .3,
    color: COLOR.player
  });
}

let ult = null, ultNext = Infinity, waves = [], pools = [];

const ULT_TIMELINE = [ [ 0, () => spawnWave(1) ], [ 1.25, () => spawnPools() ], [ 2.15, () => poolsToSpears() ], [ 2.4, () => spawnWave(-1) ], [ 3.6, () => dropSpears() ], [ 4.5, () => tripleSlash() ], [ 6, () => endUltimate() ] ];

function startUltimate() {
  ult = {
    t: 0,
    step: 0
  };
  sigilPulse = 1;
}

function updateUltimate(dt) {
  ult.t += dt;
  while (ult && ult.step < ULT_TIMELINE.length && ult.t >= ULT_TIMELINE[ult.step][0]) {
    const fn = ULT_TIMELINE[ult.step][1];
    ult.step++;
    fn();
  }
}

function endUltimate() {
  ult = null;
  ultNext = elapsed + 9 * endlessAggro();
  nextPatternAt = elapsed + .6;
}

function spawnWave(dir) {
  waves.push({
    dir,
    t: 0,
    warn: .6,
    x: dir === 1 ? -170 : W + 170,
    speed: 2300,
    th: 130,
    bulge: 130,
    fired: false
  });
  sigilPulse = 1;
}

function waveProfile(y) {
  const u = (y - H / 2) / (H / 2 + 80);
  return Math.max(0, 1 - u * u);
}

function updateWaves(dt) {
  for (const w of waves) {
    w.t += dt;
    if (w.t < w.warn) {
      continue;
    }
    if (!w.fired) {
      w.fired = true;
      shake = Math.max(shake, 22);
      flash = Math.max(flash, 1.3);
      flashColor = BLOOD.bright;
    }
    w.x += w.dir * w.speed * dt;
    for (let i = 0; i < 6; i++) {
      const y = rand(0, H), fx = w.x + w.dir * w.bulge * waveProfile(y);
      if (onScreen(fx, y)) {
        addBlood(fx, y, (w.dir === 1 ? 0 : Math.PI) + rand(-.9, .9), rand(200, 520));
      }
    }
    if (Math.random() < dt * 18) {
      const y = rand(0, H), fx = w.x + w.dir * w.bulge * waveProfile(y);
      particles.push({
        type: "mist",
        x: fx,
        y,
        vx: w.dir * 120,
        vy: 0,
        r: 20,
        grow: 120,
        life: .6,
        max: .6,
        color: BLOOD.bright
      });
    }
    const prof = waveProfile(player.y);
    const front = w.x + w.dir * w.bulge * prof;
    const thick = w.th * (.35 + .65 * prof);
    if (vulnerable() && Math.abs(player.x - (front - w.dir * thick / 2)) < thick / 2 + player.r * .5) {
      damage({
        angle: Math.PI / 2
      });
    }
  }
  waves = waves.filter(w => w.dir === 1 ? w.x < W + 420 : w.x > -420);
}

function spawnPools() {
  pools = [];
  const n = Math.random() < .5 ? 9 : 10;
  const cols = 5, rows = 2, x0 = 30, y0 = 150;
  const cw = (W - 2 * x0) / cols, ch = (H - 10 - y0) / rows;
  const cells = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      cells.push([ c, r ]);
    }
  }
  cells.sort(() => Math.random() - .5);
  for (const [c, row] of cells.slice(0, n)) {
    const r = rand(62, 100);
    const x = x0 + c * cw + rand(28, cw - 28);
    const y = y0 + row * ch + rand(28, ch - 28);
    const hitR = rand(44, 64);
    pools.push({
      x,
      y,
      r,
      hitR,
      t: 0,
      shape: smoothNoise(18, .82, 1.16, 3),
      spin: rand(0, Math.PI * 2),
      spear: null,
      done: false
    });
  }
  shake = Math.max(shake, 8);
  for (const p of pools) {
    for (let i = 0; i < 10; i++) {
      addBlood(p.x, p.y, rand(0, Math.PI * 2), rand(80, 260));
    }
  }
}

function coag(p) {
  return clamp((p.t - .25) / .6, 0, 1);
}

const POOL_SPEAR_HALF = 90;

const RISE_T = .26, MORPH_T = .25, FALL_T = .1, STUCK_T = .8;

function spearUp(s) {
  return {
    x: -Math.sin(s.ang),
    y: -Math.cos(s.ang)
  };
}

function poolsToSpears() {
  shake = Math.max(shake, 10);
  for (const p of pools) {
    const ang = rand(-.45, .45);
    const dist = Math.min(rand(300, 380), (p.y - 45) / Math.cos(ang));
    const s = {
      phase: "rise",
      t: 0,
      ang,
      dist,
      x: p.x,
      y: p.y
    };
    const up = spearUp(s);
    s.hx = p.x + up.x * dist;
    s.hy = p.y + up.y * dist;
    p.spear = s;
    for (let i = 0; i < 8; i++) {
      addBlood(p.x, p.y, -Math.PI / 2 + rand(-.7, .7), rand(150, 380));
    }
    particles.push({
      type: "ring",
      x: p.x,
      y: p.y,
      vx: 0,
      vy: 0,
      r: p.r * .4,
      grow: 160,
      life: .3,
      max: .3,
      color: BLOOD.bright
    });
  }
}

function dropSpears() {
  const order = [ ...pools ].sort(() => Math.random() - .5);
  order.forEach((p, i) => {
    if (p.spear) {
      p.spear.phase = "wait";
      p.spear.t = -i * .09;
    }
  });
}

function impactPool(p) {
  shake = Math.max(shake, 11);
  flash = Math.max(flash, .5);
  flashColor = BLOOD.bright;
  particles.push({
    type: "ring",
    x: p.x,
    y: p.y,
    vx: 0,
    vy: 0,
    r: p.hitR * .6,
    grow: 260,
    life: .4,
    max: .4,
    color: BLOOD.bright
  });
  particles.push({
    type: "mist",
    x: p.x,
    y: p.y,
    vx: 0,
    vy: 0,
    r: p.hitR * .7,
    grow: 90,
    life: .6,
    max: .6,
    color: BLOOD.bright
  });
  for (let i = 0; i < 16; i++) {
    addBlood(p.x, p.y, rand(0, Math.PI * 2), rand(140, 420));
  }
  if (vulnerable() && Math.hypot(player.x - p.x, player.y - p.y) < p.hitR + player.r * .5) {
    damage({
      angle: Math.PI / 2 - p.spear.ang
    });
  }
}

function updatePools(dt) {
  for (const p of pools) {
    p.t += dt;
    const c = coag(p);
    if (!p.spear && c > 0 && c < 1 && Math.random() < dt * 16) {
      const a = rand(0, Math.PI * 2), x = p.x + Math.cos(a) * p.r, y = p.y + Math.sin(a) * p.r, life = .35;
      particles.push({
        type: "blood",
        inward: true,
        x,
        y,
        vx: (p.x - x) / life,
        vy: (p.y - y) / life,
        life,
        max: life,
        size: rand(1.5, 3),
        color: pick([ BLOOD.bright, BLOOD.mid ])
      });
    }
    const s = p.spear;
    if (!s) {
      continue;
    }
    s.t += dt;
    const up = spearUp(s);
    if (s.phase === "rise") {
      const k = Math.min(1, s.t / RISE_T), e = 1 - Math.pow(1 - k, 3);
      s.x = p.x + (s.hx - p.x) * e;
      s.y = p.y + (s.hy - p.y) * e;
      if (Math.random() < .5) {
        addBlood(s.x + rand(-6, 6), s.y + 10, Math.PI / 2, rand(20, 80), .7);
      }
      if (k >= 1) {
        s.phase = "morph";
        s.t = 0;
      }
    } else if (s.phase === "morph") {
      if (s.t >= MORPH_T) {
        s.phase = "hover";
        s.t = 0;
      }
    } else if (s.phase === "hover") {
      const bob = Math.sin(performance.now() / 160 + p.spin) * 3;
      s.x = s.hx + up.x * bob;
      s.y = s.hy + up.y * bob;
    } else if (s.phase === "wait") {
      if (s.t >= 0) {
        s.phase = "fall";
        s.t = 0;
        s.fx = s.x;
        s.fy = s.y;
      }
    } else if (s.phase === "fall") {
      const k = Math.min(1, s.t / FALL_T), e = k * k;
      const ex = p.x + up.x * POOL_SPEAR_HALF, ey = p.y + up.y * POOL_SPEAR_HALF;
      s.x = s.fx + (ex - s.fx) * e;
      s.y = s.fy + (ey - s.fy) * e;
      if (k >= 1) {
        s.phase = "stuck";
        s.t = 0;
        s.x = ex;
        s.y = ey;
        impactPool(p);
      }
    } else if (s.phase === "stuck" && s.t > STUCK_T) {
      p.done = true;
    }
  }
  pools = pools.filter(p => !p.done);
}

function tripleSlash() {
  let a = rand(0, Math.PI);
  for (let i = 0; i < 3; i++) {
    a += rand(.8, 1.3);
    hazards.push(makeSlash({
      cx: player.x + rand(-20, 20),
      cy: player.y + rand(-20, 20),
      angle: a,
      width: 64,
      len: 620,
      delay: i * .22,
      warn: .42
    }));
  }
}

function updateSpears(dt) {
  for (const s of spears) {
    s.t += dt;
    if (s.t < s.track) {
      s.x += (s.restX - s.x) * Math.min(1, dt * 6);
      s.y += (player.y - s.y) * Math.min(1, dt * 3.2);
      if (Math.random() < dt * 6) {
        addBlood(s.x - s.dir * rand(20, 140), s.y, Math.PI / 2, rand(10, 40), .7);
      }
    } else if (s.t < s.track + s.lock) {} else {
      if (!s.flying) {
        s.flying = true;
        shake = Math.max(shake, 16);
        flash = Math.max(flash, .8);
        flashColor = BLOOD.bright;
        for (let i = 0; i < 18; i++) {
          addBlood(s.x, s.y, (s.dir === 1 ? Math.PI : 0) + rand(-.9, .9), rand(150, 420));
        }
      }
      const prevX = s.x;
      s.x += s.dir * s.speed * dt;
      for (let i = 0; i < 3; i++) {
        addBlood(prevX + (s.x - prevX) * Math.random(), s.y + rand(-4, 4), (s.dir === 1 ? Math.PI : 0) + rand(-.6, .6), rand(60, 220), .8);
      }
      const tail = s.x - s.dir * s.len;
      const x0 = Math.min(tail, s.x), x1 = Math.max(tail, s.x);
      if (vulnerable() && player.x > x0 && player.x < x1 && Math.abs(player.y - s.y) < s.half + player.r * .5) {
        damage({
          angle: 0
        });
      }
    }
  }
  spears = spears.filter(s => {
    const tail = s.x - s.dir * s.len;
    return !(s.flying && (s.dir === 1 ? tail > W + 40 : tail < -40));
  });
}

function damage(h) {
  if (h && h.knock != null) {
    player.knockT = .22;
    player.knockV = {
      x: Math.cos(h.knock) * 900,
      y: Math.sin(h.knock) * 900
    };
    player.slowT = Math.max(player.slowT || 0, .5);
  }
  player.hp -= 1;
  player.inv = INVINCIBLE_TIME;
  shake = 18;
  hurt = 1;
  if (h && h.stun) {
    player.stun = Math.max(player.stun, h.stun);
    particles.push({
      type: "ring",
      x: player.x,
      y: player.y,
      vx: 0,
      vy: 0,
      r: 6,
      grow: 160,
      life: .35,
      max: .35,
      color: DUO.aMid
    });
  }
  hitStop = .09;
  const ang = (h ? h.angle : 0) + (Math.random() < .5 ? 1 : -1) * rand(.9, 1.25);
  particles.push({
    type: "cut",
    x: player.x,
    y: player.y,
    vx: 0,
    vy: 0,
    ang,
    life: .45,
    max: .45
  });
  for (let i = 0; i < 30; i++) {
    const side = Math.random() < .5 ? 1 : -1;
    const a = ang + side * Math.PI / 2 + rand(-.45, .45);
    if (i % 2) {
      addSpark(player.x, player.y, a, rand(220, 560), COLOR.player);
    } else if (bloodMode) {
      addBlood(player.x, player.y, a, rand(160, 420));
    } else {
      addSpark(player.x, player.y, a, rand(220, 560), bossKey === "roland" ? DUO.aGrey : bossKey === "spider" ? WEB_COLOR : COLOR.ember);
    }
  }
  if (!bloodMode && bossKey === "vergilius") {
    for (let i = 0; i < 10; i++) {
      addFlame(player.x + rand(-10, 10), player.y + rand(-10, 10), 1.1);
    }
  }
  if (player.hp <= 0) {
    endGame(false);
  }
}

function onSlashFire(h) {
  const S = sty(h);
  if (h.furiosoFinal || h.disposalFinal) {
    hitStop = .2;
    shakeHold = .5;
  }
  if (h.laev) {
    for (let i = 4; i < SAMPLES; i += 5) {
      const q = h.pts[i];
      if (onScreen(q.x, q.y)) {
        addSpark(q.x, q.y, -Math.PI / 2 + rand(-.8, .8), rand(150, 420), pick(STYLE["laev" + h.laev].sparks));
        if (i % 15 === 4) {
          addDebris(q.x, q.y, 1, .8);
        }
      }
    }
  }
  if (h.style === "index" && !h.light) {
    for (let i = 6; i < SAMPLES; i += 10) {
      const q = h.pts[i];
      if (onScreen(q.x, q.y)) {
        goldDrip(q.x, q.y, 1);
      }
    }
  }
  if (h.boneDust) {
    for (let i = 4; i < SAMPLES; i += 6) {
      const q = h.pts[i];
      if (onScreen(q.x, q.y)) {
        addDebris(q.x, q.y, 2, .8);
      }
    }
  }
  shake = Math.max(shake, h.big ? 24 : 9);
  flash = Math.max(flash, h.big ? 1.6 : .55);
  flashColor = S.flash;
  if (h.style) {
    weaponFireFx(h);
  }
  if (h.big) {
    for (let i = 0; i < 3; i++) {
      const p = h.pts[Math.round(SAMPLES * (.3 + i * .2))];
      particles.push({
        type: "ring",
        x: p.x,
        y: p.y,
        vx: 0,
        vy: 0,
        r: 10,
        grow: 700 + i * 150,
        life: .5,
        max: .5,
        color: S.rings[i === 1 ? 1 : 0]
      });
    }
  }
  const mid = h.pts[SAMPLES / 2];
  if (onScreen(mid.x, mid.y) && !h.light) {
    particles.push({
      type: "ring",
      x: mid.x,
      y: mid.y,
      vx: 0,
      vy: 0,
      r: 6,
      grow: 520,
      life: .35,
      max: .35,
      color: S.ring
    });
  }
  for (let i = 0; i < h.pts.length; i++) {
    if (h.light && i % 4) {
      continue;
    }
    const p = h.pts[i];
    if (!onScreen(p.x, p.y)) {
      continue;
    }
    const side = Math.random() < .5 ? 1 : -1;
    const out = Math.atan2(p.ny * side, p.nx * side) + rand(-.5, .5);
    if (h.blood) {
      if (Math.random() < (h.big ? .9 : .7)) {
        addBlood(p.x + p.nx * side * p.hw * .5, p.y + p.ny * side * p.hw * .5, out, rand(140, 460));
      }
      if (i % 8 === 4) {
        particles.push({
          type: "mist",
          x: p.x,
          y: p.y,
          vx: p.nx * side * 30,
          vy: p.ny * side * 30,
          r: p.hw * .6 + 6,
          grow: 70 + p.hw,
          life: .7,
          max: .7,
          color: BLOOD.bright
        });
      }
      continue;
    }
    if (h.style) {
      if (i % 3 === 0) {
        addSpark(p.x, p.y, out, rand(180, 480), pick(S.sparks));
      }
      continue;
    }
    addSpark(p.x, p.y, out, rand(180, 520));
    for (let j = 0; j < 2; j++) {
      const s = rand(-1, 1);
      addFlame(p.x + p.nx * s * p.hw, p.y + p.ny * s * p.hw, 1.2);
    }
  }
}

function sweepEffects(h) {
  const [i0, i1] = drawnRange(h);
  const tip = h.pts[h.dir === 1 ? i1 : i0];
  if (!onScreen(tip.x, tip.y)) {
    return;
  }
  const fwd = h.angle + (h.dir === 1 ? 0 : Math.PI);
  if (h.blood) {
    for (let i = 0; i < 4; i++) {
      addBlood(tip.x, tip.y, fwd + rand(-.8, .8), rand(150, 480));
    }
    return;
  }
  if (h.style) {
    for (let i = 0; i < 4; i++) {
      addSpark(tip.x, tip.y, fwd + rand(-.6, .6), rand(250, 600), pick(sty(h).sparks));
    }
    return;
  }
  for (let i = 0; i < 6; i++) {
    addSpark(tip.x, tip.y, fwd + rand(-.7, .7), rand(250, 650));
  }
  for (let i = 0; i < 5; i++) {
    addFlame(tip.x + rand(-8, 8), tip.y + rand(-8, 8), 1.3);
  }
}

function bladeFlames(h) {
  if (h.style) {
    return;
  }
  const [i0, i1] = drawnRange(h);
  if (h.blood) {
    const n = h.big ? 3 : 2;
    for (let j = 0; j < n; j++) {
      const p = h.pts[i0 + Math.floor(Math.random() * (i1 - i0 + 1))];
      const side = Math.random() < .5 ? 1 : -1;
      if (onScreen(p.x, p.y)) {
        addBlood(p.x + p.nx * side * p.hw * .6, p.y + p.ny * side * p.hw * .6, Math.atan2(p.ny * side, p.nx * side) - .4, rand(60, 240), .9);
      }
    }
    return;
  }
  const n = h.big ? 7 : 3;
  for (let j = 0; j < n; j++) {
    const p = h.pts[i0 + Math.floor(Math.random() * (i1 - i0 + 1))];
    if (!onScreen(p.x, p.y)) {
      continue;
    }
    const s = rand(-1, 1);
    addFlame(p.x + p.nx * s * p.hw * .8, p.y + p.ny * s * p.hw * .8, h.big ? 1.5 : 1.1);
  }
}

  drawAxes();
  drawFlurries();

  }
  drawMaskedLayer();

  ctx.restore();
  if (bossKey === "spider") {
    drawTears();
  }
  drawLine();
  drawDuoLabels();
  drawSpiderText();
  drawDuoSay();
  drawMaskInfo();
  drawPages();
  drawFurioso();
  if (flash > 0) {
    ctx.globalAlpha = Math.min(1, flash) * .22;
    ctx.fillStyle = flashColor;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  if (hurt > 0) {
    const hc = bossKey === "roland" ? DUO.aWhite : bossKey === "spider" ? WEB_COLOR : bloodMode ? BLOOD.bright : COLOR.fire;
    ctx.save();
    ctx.globalAlpha = hurt;
    ctx.strokeStyle = hc;
    ctx.shadowColor = hc;
    ctx.shadowBlur = 40;
    ctx.lineWidth = 14;
    ctx.strokeRect(0, 0, W, H);

    ctx.fillStyle = COLOR.dim;
    ctx.font = '500 11px "IBM Plex Mono", monospace';
    ctx.fillText(qualityToast.text, W - 12, H - 12);
    ctx.restore();
  }
}

const MASK_SKILLS = {
  durandal: "뒤랑달",
  shotgun: "로직 아틀리에",
  lance: "알라스 공방",
  hammer: "늙은소년 공방",
  axe: "느티나무 공방",
  twin: "크리스탈 아틀리에",
  katana: "묵 공방",
  greatsword: "휠스 인더스트리"
};

const MASK_ALPHA = .2;

let drawingMasked = false;

function isMasked(item) {
  return !!(duo.mask && !duo.furi && item && item.skill && item.skill === duo.maskSkill);
}

function maskSkip(item) {
  return isMasked(item) !== drawingMasked;
}

function maskMul(skill) {
  return duo.mask && !duo.furi && duo.maskSkill === skill ? MASK_ALPHA : 1;
}

function drawMaskedLayer() {
  if (!duo.mask || !duo.maskSkill) {
    return;
  }
  const m = ctx.getTransform();
  maskCtx.save();
  maskCtx.setTransform(1, 0, 0, 1, 0, 0);
  maskCtx.clearRect(0, 0, maskLayer.width, maskLayer.height);
  maskCtx.restore();
  const mr = maskLayer.width / cv.width;
  maskCtx.setTransform(m.a * mr, m.b * mr, m.c * mr, m.d * mr, m.e * mr, m.f * mr);
  ctx = maskCtx;
  drawingMasked = true;
  drawQuakes();
  for (const h of hazards) {
    drawWarning(h);
  }
  for (const h of hazards) {
    drawScar(h);
  }
  for (const h of hazards) {
    drawBlade(h);
  }
  drawBullets();
  drawLances();
  drawAxes();
  drawFlurries();
  drawCrescents();
  drawCleaves();
  drawingMasked = false;
  ctx = mainCtx;
  maskCtx.setTransform(maskLayer.width / W, 0, 0, maskLayer.height / H, 0, 0);
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = MASK_ALPHA;
  ctx.drawImage(maskLayer, 0, 0, cv.width, cv.height);
  ctx.restore();
}

function drawMaskShape(x, y, s = 1, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.beginPath();
  ctx.ellipse(0, 0, 11, 17, 0, 0, Math.PI * 2);
  ctx.fillStyle = DUO.rFill;
  ctx.fill();
  ctx.strokeStyle = DUO.rEdge;
  ctx.lineWidth = 2 / s;
  ctx.shadowColor = DUO.rEdge;
  ctx.shadowBlur = 12;
  ctx.stroke();
  ctx.restore();
}

function drawGrid() {
  ctx.strokeStyle = COLOR.line;
  ctx.lineWidth = 1;
  ctx.globalAlpha = .3 + flash * .6;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 60) {
    ctx.moveTo(x + .5, 0);
    ctx.lineTo(x + .5, H);
  }
  for (let y = 0; y <= H; y += 60) {
    ctx.moveTo(0, y + .5);
    ctx.lineTo(W, y + .5);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawSmokes() {
  if (!smokes.length) {
    return;
  }
  const rad = m => {
    const k = m.life / m.max;
    return m.r0 * Math.pow(k, .7) * (.6 + .4 * Math.min(1, (1 - k) * 6));
  };
  ctx.save();
  ctx.shadowColor = DUO.rEdge;
  ctx.shadowBlur = 10;
  ctx.fillStyle = DUO.rEdge;
  for (const m of smokes) {
    ctx.beginPath();
    ctx.arc(m.x, m.y, rad(m) + 1.8, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.fillStyle = DUO.rFill;
  for (const m of smokes) {
    ctx.beginPath();
    ctx.arc(m.x, m.y, rad(m), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawBgLines() {
  if (!bgLines.length) {
    return;
  }
  ctx.save();
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  for (const L of bgLines) {
    const k = L.t / L.life;
    const a = L.peak * Math.min(1, L.t / .3, (L.life - L.t) / 1);
    const n = Math.min(L.text.length, Math.floor(L.t * BG_TYPE));
    ctx.save();
    ctx.translate(L.x, L.y - k * 10);
    ctx.rotate(L.ang);
    ctx.globalAlpha = Math.max(0, a);
    ctx.font = `600 ${L.size}px "IBM Plex Sans KR", "Malgun Gothic", sans-serif`;
    const full = ctx.measureText(L.text).width;
    ctx.fillStyle = DUO.rEdge;
    ctx.shadowColor = DUO.rEdge;
    ctx.shadowBlur = 6;
    ctx.fillText(L.text.slice(0, n), -full / 2, 0);
    if (n < L.text.length && Math.floor(L.t * 6) % 2 === 0) {
      const w = ctx.measureText(L.text.slice(0, n)).width;
      ctx.fillRect(-full / 2 + w + 2, -L.size * .45, 2, L.size * .9);
    }
    ctx.restore();
  }
  ctx.restore();
}

function drawDuoSigils() {
  drawSmokes();
  const M = {
    x: (ROLAND_POS.x + ANGELICA_POS.x) / 2,
    y: ROLAND_POS.y
  };
  ctx.save();
  if (duo.comboT > 0 && !duo.solo && !duo.angelicaGone) {
    const a = Math.min(1, duo.comboT * 1.5);
    ctx.lineWidth = 2.5;
    ctx.globalAlpha = a;
    ctx.shadowBlur = 14;
    ctx.strokeStyle = DUO.rEdge;
    ctx.shadowColor = DUO.rEdge;
    ctx.setLineDash([ 6, 5 ]);
    ctx.beginPath();
    ctx.moveTo(ROLAND_POS.x + 22, ROLAND_POS.y);
    ctx.lineTo(M.x, M.y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = DUO.aWhite;
    ctx.shadowColor = DUO.aWhite;
    ctx.beginPath();
    ctx.moveTo(M.x, M.y);
    ctx.lineTo(ANGELICA_POS.x - 22, ANGELICA_POS.y);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  const t = performance.now() / 1e3;
  const sigil = (pos, color, pulse, glyph, name, inner) => {
    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.strokeStyle = color;
    ctx.fillStyle = inner;
    ctx.shadowColor = color;
    ctx.shadowBlur = 10 + 14 * pulse + 4 * Math.sin(t * 3);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = color;
    glyph();
    if (pulse > 0) {
      ctx.globalAlpha = pulse;
      ctx.beginPath();
      ctx.arc(0, 0, 18 + (1 - pulse) * 30, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.shadowBlur = 0;
    ctx.font = '500 10px "IBM Plex Mono", monospace';
    ctx.textAlign = "center";
    ctx.fillText(name, 0, 34);
    ctx.restore();
  };
  sigil(ROLAND_POS, DUO.rEdge, duo.r, () => {
    iconSprite("durandal", drawDurandal);
    if (duo.solo) {
      ctx.save();
      ctx.translate(-7, 7);
      ctx.rotate(t * .8);
      ctx.lineWidth = 1.4;
      ctx.strokeRect(-3.5, -3.5, 7, 7);
      ctx.restore();
    }
  }, "롤랑", DUO.rFill);
  if (duo.maskAnim && !duo.maskAnim.on) {
    const k = Math.min(1, duo.maskAnim.t / 1.2), e = 1 - Math.pow(1 - k, 3);
    drawMaskShape(ROLAND_POS.x + Math.sin(duo.maskAnim.t * 5) * 6 * (1 - k), ROLAND_POS.y + 150 * (1 - e), 1.6 - .6 * e, Math.min(1, k * 3));
  } else if (duo.mask) {
    drawMaskShape(ROLAND_POS.x, ROLAND_POS.y, 1, 1);
  }
  if (duo.glove) {
    const k = Math.min(1, duo.glove.t / 1.05), e = k * k;
    const x = W * .6 + (ROLAND_POS.x - W * .6) * e, y = ROLAND_POS.y - Math.sin(Math.PI * k) * 40;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(t * 5);
    ctx.strokeStyle = DUO.aWhite;
    ctx.shadowColor = DUO.aWhite;
    ctx.shadowBlur = 16;
    ctx.lineWidth = 2;
    ctx.strokeRect(-7, -7, 14, 14);
    ctx.restore();
  }
  if (duo.fall) {
    const f = duo.fall;
    const crack = f.final ? Math.min(1, (f.t - 2.9) / .6) : 0;
    ctx.save();
    ctx.globalAlpha = f.broke ? Math.max(0, 1 - (f.t - 3.5) / .5) : 1;
    const jit = f.t < 1.6 ? 3 : f.final && !f.broke ? 1.5 : 0;
    ctx.translate(ANGELICA_POS.x + rand(-jit, jit), ANGELICA_POS.y + rand(-jit, jit));
    ctx.fillStyle = f.flash > 0 ? DUO.aWhite : "#2a2a30";
    ctx.globalAlpha *= f.flash > 0 ? .5 + .5 * f.flash : 1;
    ctx.beginPath();
    ctx.arc(0, 0, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = f.broke ? Math.max(0, 1 - (f.t - 3.5) / .5) : 1;
    ctx.strokeStyle = DUO.aWhite;
    ctx.lineWidth = 2;
    ctx.shadowColor = DUO.aWhite;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(0, 0, 18, 0, Math.PI * 2);
    ctx.stroke();
    ctx.save();
    ctx.rotate(f.t < 1.6 ? Math.sin(performance.now() / 40) * .15 : 0);
    iconSprite("angelica", drawAngelicaGlove);
    ctx.restore();
    if (crack > 0) {
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      for (let i = 0; i < 7; i++) {
        const a = i * .9 + .3, r = 24 * crack;
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a) * r * .5, Math.sin(a) * r * .5 + 2);
        ctx.lineTo(Math.cos(a + .2) * r, Math.sin(a + .2) * r);
      }
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.font = '500 10px "IBM Plex Mono", monospace';
    ctx.textAlign = "center";
    ctx.fillStyle = DUO.aWhite;
    ctx.fillText("안젤리카", 0, 34);
    ctx.restore();
  }
  if (!duo.fall && !duo.angelicaGone) {
    sigil(ANGELICA_POS, DUO.aWhite, duo.a, () => {
      iconSprite("angelica", drawAngelicaGlove);
    }, "안젤리카", "#2a2a30");
  }
  ctx.restore();
}

function agGrad(y0, y1, x0 = 0, x1 = 0) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, DUO.aWhite);
  g.addColorStop(.5, DUO.aGrey);
  g.addColorStop(1, DUO.aWhite);
  return g;
}

function drawQuakes() {
  for (const q of quakes) {
    if (maskSkip(q)) {
      continue;
    }
    if (q.t < 0) {
      continue;
    }
    const S = STYLE[q.style];
    ctx.save();
    ctx.translate(q.x, q.y);
    ctx.strokeStyle = S.glow;
    ctx.fillStyle = S.glow;
    ctx.shadowColor = S.glow;
    if (q.t < q.warn) {
      const prog = q.t / q.warn;
      ctx.globalAlpha = .06 + .14 * prog;
      ctx.beginPath();
      ctx.arc(0, 0, q.R, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = .9;
      ctx.lineWidth = 1.5;
      ctx.shadowBlur = 10;
      ctx.setLineDash([ 10, 7 ]);
      ctx.beginPath();
      ctx.arc(0, 0, q.R, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, 0, q.R * (1.7 - .7 * prog), 0, Math.PI * 2);
      ctx.stroke();
      if (q.kind === "hammer") {
        drawHammer(q, prog);
      }
    } else {
      const k = 1 - (q.t - q.warn) / (q.active + q.fade);
      ctx.globalAlpha = Math.max(0, k) * .6;
      ctx.shadowBlur = 40;
      ctx.beginPath();
      ctx.arc(0, 0, q.R, 0, Math.PI * 2);
      ctx.fill();
      if (q.kind === "hammer" && k > .35) {
        ctx.globalAlpha = (k - .35) / .65;
        drawHammer(q, 1);
      }
      if (q.kind === "kick") {
        ctx.globalAlpha = Math.max(0, k);
        ctx.strokeStyle = S.tip;
        ctx.shadowBlur = 16;
        ctx.lineCap = "round";
        for (const [r, a0, w] of [ [ q.R * .85, q.side * .4, 7 ], [ q.R * .6, q.side * .4 + Math.PI, 5 ] ]) {
          ctx.lineWidth = w;
          ctx.beginPath();
          ctx.arc(0, 0, r, a0, a0 + q.side * 2.6, q.side < 0);
          ctx.stroke();
        }
      }
    }
    ctx.restore();
  }
}

function drawHammer(q, prog) {
  const side = q.side, pivot = {
    x: q.x - side * 46,
    y: q.y - 40
  };
  const af = Math.atan2(q.y - pivot.y, q.x - pivot.x), len = Math.hypot(q.x - pivot.x, q.y - pivot.y);
  let a, ghosts = 0;
  if (prog < .78) {
    const e = prog / .78;
    a = af - side * (.5 + 1.9 * (1 - (1 - e) * (1 - e))) + (e > .6 ? rand(-.03, .03) : 0);
  } else if (prog < 1) {
    const k = (prog - .78) / .22;
    a = af - side * 2.4 * (1 - k * k * k);
    ghosts = 3;
  } else {
    a = af;
  }
  const pose = (ang, alpha) => {
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.translate(pivot.x - q.x, pivot.y - q.y);
    ctx.rotate(ang);
    ctx.shadowColor = DUO.aWhite;
    ctx.shadowBlur = 12;
    ctx.translate(len - 26, 0);
    drawWeapon("hammer", 1);
    ctx.restore();
  };
  for (let i = ghosts; i >= 1; i--) {
    pose(a + side * .22 * i, .22);
  }
  pose(a, 1);
}

function drawBullets() {
  for (const b of bullets) {
    if (maskSkip(b)) {
      continue;
    }
    if (b.t < 0) {
      continue;
    }
    const S = STYLE[b.style];
    ctx.save();
    ctx.strokeStyle = S.glow;
    ctx.fillStyle = S.glow;
    ctx.shadowColor = S.glow;
    if (b.t < b.warn) {
      if (b.lead && b.spread) {
        const [a0, a1] = b.spread, L = 1100, blink = Math.floor(b.t * 16) % 2 ? .75 : .35;
        ctx.globalAlpha = .08 + .1 * (b.t / b.warn);
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.arc(b.x, b.y, L, a0 - .05, a1 + .05);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = blink;
        ctx.lineWidth = 1.2;
        ctx.setLineDash([ 8, 6 ]);
        for (const a of [ a0 - .05, a1 + .05 ]) {
          ctx.beginPath();
          ctx.moveTo(b.x, b.y);
          ctx.lineTo(b.x + Math.cos(a) * L, b.y + Math.sin(a) * L);
          ctx.stroke();
        }
      } else if (!b.spread) {
        const blink = Math.floor(b.t * 18) % 2 ? .85 : .35;
        ctx.globalAlpha = blink;
        ctx.lineWidth = 1.2;
        ctx.setLineDash([ 6, 6 ]);
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(b.x + Math.cos(b.ang) * 1100, b.y + Math.sin(b.ang) * 1100);
        ctx.stroke();
      }
    } else {
      const tx = Math.cos(b.ang), ty = Math.sin(b.ang);
      ctx.shadowBlur = 12;
      ctx.lineCap = "round";
      const duoB = b.style === "angelica", head = duoB ? DUO.aWhite : S.tip, tail = duoB ? DUO.aGrey : S.glow;
      ctx.strokeStyle = tail;
      ctx.lineWidth = b.r * 1.3;
      ctx.globalAlpha = .6;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x - tx * 34, b.y - ty * 34);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = head;
      ctx.lineWidth = b.r * 1.5;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x - tx * 9, b.y - ty * 9);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawLances() {
  for (const L of lances) {
    if (maskSkip(L)) {
      continue;
    }
    ctx.save();
    if (L.t < L.warn) {
      const prog = L.t / L.warn, blink = Math.floor(L.t * (prog > .7 ? 22 : 10)) % 2 ? 1 : .4;
      ctx.fillStyle = DUO.aWhite;
      ctx.globalAlpha = .05 + .12 * prog;
      ctx.fillRect(0, L.y - L.half, W, L.half * 2);
      ctx.strokeStyle = DUO.aMid;
      ctx.globalAlpha = blink;
      ctx.lineWidth = 1.2;
      ctx.setLineDash([ 16, 10 ]);
      ctx.beginPath();
      ctx.moveTo(0, L.y - L.half);
      ctx.lineTo(W, L.y - L.half);
      ctx.moveTo(0, L.y + L.half);
      ctx.lineTo(W, L.y + L.half);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = DUO.aWhite;
      ctx.lineWidth = 3;
      ctx.shadowColor = DUO.aWhite;
      ctx.shadowBlur = 10;
      const ex = L.dir === 1 ? 26 : W - 26;
      for (let i = 0; i < 3; i++) {
        const x = ex + L.dir * i * 16;
        ctx.globalAlpha = (.4 + .6 * prog) * (1 - i * .25);
        ctx.beginPath();
        ctx.moveTo(x - L.dir * 7, L.y - 13);
        ctx.lineTo(x + L.dir * 6, L.y);
        ctx.lineTo(x - L.dir * 7, L.y + 13);
        ctx.stroke();
      }
    } else {
      const d = L.dir, tip = L.x, back = L.x - d * L.len, neck = L.x - d * L.len * .62;
      ctx.shadowColor = DUO.aWhite;
      ctx.shadowBlur = 22;
      ctx.fillStyle = DUO.aGrey;
      ctx.fillRect(Math.min(neck, back), L.y - 3, Math.abs(neck - back), 6);
      ctx.fillStyle = agGrad(L.y - 15, L.y + 15, 0, 0);
      ctx.beginPath();
      ctx.moveTo(tip, L.y);
      ctx.lineTo(neck, L.y - 15);
      ctx.lineTo(neck, L.y + 15);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = DUO.aWhite;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(neck, L.y - 15);
      ctx.lineTo(tip, L.y);
      ctx.stroke();
      ctx.fillStyle = DUO.aGrey;
      ctx.fillRect(neck - (d === 1 ? 16 : 0), L.y - 17, 16, 34);
      ctx.strokeRect(neck - (d === 1 ? 16 : 0), L.y - 17, 16, 34);
      ctx.globalAlpha = .5;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(tip - d * 10, L.y, 26, d === 1 ? -.9 : Math.PI - .9, d === 1 ? .9 : Math.PI + .9);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawFlurries() {
  for (const f of flurries) {
    if (maskSkip(f)) {
      continue;
    }
    const T = f.t, end = f.track + f.lock + f.dur;
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.shadowColor = DUO.aWhite;
    if (T < f.track) {
      const spin = T * 2.2;
      ctx.strokeStyle = DUO.aMid;
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = .75;
      ctx.setLineDash([ 10, 8 ]);
      ctx.lineDashOffset = -T * 40;
      ctx.beginPath();
      ctx.arc(0, 0, f.R, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = DUO.aWhite;
      ctx.lineWidth = 2;
      ctx.shadowBlur = 8;
      for (let i = 0; i < 4; i++) {
        const a = spin + i * Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * (f.R - 10), Math.sin(a) * (f.R - 10));
        ctx.lineTo(Math.cos(a) * (f.R + 6), Math.sin(a) * (f.R + 6));
        ctx.stroke();
      }
    } else if (T < f.track + f.lock) {
      const k = (T - f.track) / f.lock, blink = Math.floor(T * (k > .6 ? 24 : 12)) % 2 ? 1 : .45;
      ctx.fillStyle = DUO.aWhite;
      ctx.globalAlpha = .06 + .16 * k;
      ctx.beginPath();
      ctx.arc(0, 0, f.R, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = DUO.aWhite;
      ctx.lineWidth = 2.5;
      ctx.shadowBlur = 14;
      ctx.globalAlpha = blink;
      ctx.beginPath();
      ctx.arc(0, 0, f.R, 0, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = .6;
      ctx.beginPath();
      ctx.arc(0, 0, f.R * (1 - k), 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.save();
      ctx.translate(-24, -f.R - 18);
      drawWeapon("katana", 1.1);
      ctx.restore();
    } else {
      const k = T < end ? 1 : 1 - (T - end) / f.fade;
      ctx.fillStyle = DUO.aWhite;
      ctx.globalAlpha = Math.max(0, k) * (.12 + Math.random() * .12);
      ctx.beginPath();
      ctx.arc(0, 0, f.R, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = DUO.aWhite;
      ctx.lineWidth = 2;
      ctx.shadowBlur = 16;
      ctx.globalAlpha = Math.max(0, k);
      ctx.beginPath();
      ctx.arc(0, 0, f.R, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawAxes() {
  for (const A of axes) {
    if (maskSkip(A)) {
      continue;
    }
    ctx.save();
    if (A.t < A.warn) {
      ctx.strokeStyle = DUO.aMid;
      ctx.lineWidth = 1.2;
      ctx.setLineDash([ 4, 7 ]);
      ctx.globalAlpha = .4 + .5 * (A.t / A.warn);
      ctx.beginPath();
      for (let i = 0; i <= 24; i++) {
        const p = axePos(A, (A.out + A.back) * i / 24);
        i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
      }
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = DUO.aWhite;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(A.tx - 9, A.ty - 9);
      ctx.lineTo(A.tx + 9, A.ty + 9);
      ctx.moveTo(A.tx + 9, A.ty - 9);
      ctx.lineTo(A.tx - 9, A.ty + 9);
      ctx.stroke();
    } else {
      for (const t of A.trail) {
        ctx.globalAlpha = t.life / .18 * .35;
        ctx.fillStyle = DUO.aGrey;
        ctx.beginPath();
        ctx.arc(t.x, t.y, A.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.translate(A.x, A.y);
      ctx.rotate(A.rot);
      ctx.save();
      ctx.translate(-12, 8);
      drawWeapon("axe", 1.1);
      ctx.restore();
      ctx.strokeStyle = DUO.aWhite;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, A.r + 6, 0, Math.PI * 2);
      ctx.globalAlpha = .25;
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawWeapon(kind, s = 1) {
  ctx.save();
  ctx.scale(s, s);
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  const roland = kind === "durandal" || kind === "scabbard";
  const C = roland ? {
    hi: DUO.rEdge,
    mid: "#9a9aa4",
    lo: "#4a4a52",
    dark: DUO.rFill,
    fill: DUO.rFill
  } : {
    hi: DUO.aWhite,
    mid: DUO.aMid,
    lo: DUO.aGrey,
    dark: "#26262c",
    fill: null
  };
  const LW = 1.3 / s, THIN = .8 / s;
  ctx.shadowColor = C.hi;
  ctx.shadowBlur = 8;
  const grad = h => C.fill || agGrad(-h, h);
  const poly = (pts, fill, stroke = C.hi, w = LW) => {
    ctx.beginPath();
    pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.closePath();
    if (fill) {
      ctx.fillStyle = fill;
      ctx.fill();
    }
    if (stroke) {
      ctx.strokeStyle = stroke;
      ctx.lineWidth = w;
      ctx.stroke();
    }
  };
  const line = (pts, color = C.mid, w = THIN) => {
    ctx.beginPath();
    pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.strokeStyle = color;
    ctx.lineWidth = w;
    ctx.stroke();
  };
  const rivet = (x, y, r = 1) => {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = C.hi;
    ctx.fill();
  };
  const ring = (x, y, r, fill = C.dark, stroke = C.hi) => {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    if (fill) {
      ctx.fillStyle = fill;
      ctx.fill();
    }
    ctx.strokeStyle = stroke;
    ctx.lineWidth = LW;
    ctx.stroke();
  };
  const wrap = (x0, x1, h, step = 3) => {
    poly([ [ x0, -h ], [ x1, -h ], [ x1, h ], [ x0, h ] ], C.dark);
    ctx.beginPath();
    for (let x = x0; x < x1 - .1; x += step) {
      ctx.moveTo(x, -h);
      ctx.lineTo(Math.min(x + step, x1), h);
      ctx.moveTo(x, h);
      ctx.lineTo(Math.min(x + step, x1), -h);
    }
    ctx.strokeStyle = C.mid;
    ctx.lineWidth = THIN;
    ctx.stroke();
  };
  const band = (x, h, w = 2) => poly([ [ x - w / 2, -h ], [ x + w / 2, -h ], [ x + w / 2, h ], [ x - w / 2, h ] ], C.lo);
  switch (kind) {
   case "durandal":
    {
      poly([ [ -2, -2.6 ], [ 50, -2.2 ], [ 58, -1.3 ], [ 66, 0 ], [ 58, 1.3 ], [ 50, 2.2 ], [ -2, 2.6 ] ], C.fill);
      poly([ [ 3, -.8 ], [ 46, -.5 ], [ 48, 0 ], [ 46, .5 ], [ 3, .8 ] ], null, C.mid, THIN);
      line([ [ 50, -2.2 ], [ 58, 0 ], [ 50, 2.2 ] ], C.mid);
      poly([ [ -2, -2.8 ], [ 4, -2.6 ], [ 4, 2.6 ], [ -2, 2.8 ] ], C.fill);
      poly([ [ -3, -2.5 ], [ -6, -10 ], [ -4, -13.5 ], [ -1, -13 ], [ -1.5, -3 ], [ -1.5, 3 ], [ -1, 13 ], [ -4, 13.5 ], [ -6, 10 ], [ -3, 2.5 ] ], C.fill);
      ring(-4.5, -13.5, 1.6, C.fill);
      ring(-4.5, 13.5, 1.6, C.fill);
      wrap(-22, -6, 1.9, 2.6);

function crescentPath(c, x, y, scale = 1) {
  const cx = x - Math.cos(c.ang) * c.R, cy = y - Math.sin(c.ang) * c.R, n = 16;
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const u = i / n * 2 - 1, a = c.ang + u * .95, w = c.th * .5 * (1 - u * u) * scale;
    const r = c.R + w;
    i ? ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r) : ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
  }
  for (let i = n; i >= 0; i--) {
    const u = i / n * 2 - 1, a = c.ang + u * .95, w = c.th * .5 * (1 - u * u) * scale;
    const r = c.R - w;
    ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
  }
  ctx.closePath();
}

function drawCrescents() {
  for (const c of crescents) {
    if (maskSkip(c)) {
      continue;
    }
    ctx.save();
    if (c.t < c.warn) {
      const blink = Math.floor(c.t * 16) % 2 ? .8 : .35;
      ctx.strokeStyle = DUO.rEdge;
      ctx.globalAlpha = blink;
      ctx.lineWidth = 1.2;
      ctx.setLineDash([ 10, 8 ]);
      ctx.beginPath();
      ctx.moveTo(c.x, c.y);
      ctx.lineTo(c.x + Math.cos(c.ang) * 1200, c.y + Math.sin(c.ang) * 1200);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = .5 + .5 * (c.t / c.warn);
      ctx.fillStyle = DUO.rFill;
      ctx.lineWidth = 1.5;
      crescentPath(c, c.x, c.y, c.t / c.warn);
      ctx.fill();
      ctx.stroke();
    } else {
      for (const t of c.trail) {
        ctx.globalAlpha = t.life / .16 * .35;
        ctx.strokeStyle = DUO.rEdge;
        ctx.lineWidth = 1;
        crescentPath(c, t.x, t.y, .8);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.shadowColor = DUO.rEdge;
      ctx.shadowBlur = 14;
      ctx.fillStyle = DUO.rFill;
      crescentPath(c, c.x, c.y);
      ctx.fill();
      ctx.strokeStyle = DUO.rEdge;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawCleaves() {
  for (const C of cleaves) {
    if (maskSkip(C)) {
      continue;
    }
    ctx.save();
    const s2 = C.t - C.warn;
    if (s2 < 0) {
      const prog = C.t / C.warn, blink = Math.floor(C.t * (prog > .7 ? 20 : 8)) % 2 ? 1 : .4;
      ctx.fillStyle = DUO.aWhite;
      ctx.globalAlpha = .05 + .12 * prog;
      ctx.fillRect(C.x - C.w / 2, 0, C.w, H);
      ctx.strokeStyle = DUO.aMid;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([ 14, 10 ]);
      ctx.globalAlpha = blink;
      ctx.beginPath();
      ctx.moveTo(C.x - C.w / 2, 0);
      ctx.lineTo(C.x - C.w / 2, H);
      ctx.moveTo(C.x + C.w / 2, 0);
      ctx.lineTo(C.x + C.w / 2, H);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = DUO.aWhite;
      ctx.lineWidth = 3;
      for (const side of [ -1, 1 ]) {
        for (let i = 0; i < 3; i++) {
          const x = C.x + side * (C.w / 2 + 16 + i * 16 + C.t * 2 % 1 * 16), y = H * .6;
          ctx.globalAlpha = (.4 + .6 * prog) * (1 - i * .25);
          ctx.beginPath();
          ctx.moveTo(x - side * 6, y - 12);
          ctx.lineTo(x + side * 6, y);
          ctx.lineTo(x - side * 6, y + 12);
          ctx.stroke();
        }
      }
      ctx.globalAlpha = Math.min(1, prog * 1.5);
      ctx.translate(C.x, 170 - 110 * prog - 60 * (C.w / 26));
      ctx.rotate(Math.PI / 2);
      drawWeapon("greatsword", C.w / 26);
    } else {
      const k = s2 < C.fall ? 1 : 1 - (s2 - C.fall) / C.hold;
      ctx.globalAlpha = Math.max(0, k);
      ctx.fillStyle = DUO.aWhite;
      ctx.globalAlpha = Math.max(0, k) * .15;
      ctx.fillRect(C.x - C.w / 2, 0, C.w, Math.max(0, C.tipY));
      ctx.globalAlpha = Math.max(0, k);
      const len = 60 * (C.w / 26);
      ctx.translate(C.x, C.tipY - len);
      ctx.rotate(Math.PI / 2);
      drawWeapon("greatsword", C.w / 26);
    }
    ctx.restore();
  }
}

function drawGun() {
  if (duo.gunT <= 0) {
    return;
  }
  ctx.save();
  ctx.globalAlpha = Math.min(1, duo.gunT * 4) * maskMul("shotgun");
  ctx.translate(ANGELICA_POS.x, ANGELICA_POS.y + 6);
  ctx.rotate(duo.gunAng);
  ctx.translate(-10 - duo.recoil * 10, 0);
  if (Math.cos(duo.gunAng) < 0) {
    ctx.scale(1, -1);
  }
  drawWeapon("shotgun", 1.1);
  ctx.restore();
}

function drawSwing(sw) {
  const P = {
    x: ROLAND_POS.x - 20,
    y: ROLAND_POS.y + 10
  };
  const pose = swingPose(sw), S = SWINGS[sw.type];
  ctx.save();
  ctx.translate(P.x, P.y);
  if (pose.trail && pose.trail.alpha > .01) {
    if (S.thrust) {
      ctx.globalAlpha = pose.trail.alpha * maskMul("durandal");
      ctx.strokeStyle = DUO.rEdge;
      ctx.lineWidth = 1.2;
      for (const o of [ -6, 0, 6 ]) {
        ctx.beginPath();
        ctx.moveTo(Math.cos(pose.ang) * 30 - Math.sin(pose.ang) * o, Math.sin(pose.ang) * 30 + Math.cos(pose.ang) * o);
        ctx.lineTo(Math.cos(pose.ang) * (100 + pose.ext) - Math.sin(pose.ang) * o, Math.sin(pose.ang) * (100 + pose.ext) + Math.cos(pose.ang) * o);
        ctx.stroke();
      }
    } else {
      let {a0, a1} = pose.trail;
      const span = a1 - a0;
      if (Math.abs(span) > 1.8) {
        a0 = a1 - Math.sign(span) * 1.8;
      }
      const ccw = a1 < a0;
      ctx.globalAlpha = pose.trail.alpha * maskMul("durandal");
      ctx.beginPath();
      ctx.arc(0, 0, 86, a0, a1, ccw);
      ctx.arc(0, 0, 22, a1, a0, !ccw);
      ctx.closePath();
      ctx.fillStyle = DUO.rFill;
      ctx.fill();
      ctx.strokeStyle = DUO.rEdge;
      ctx.lineWidth = 1.6;
      ctx.shadowColor = DUO.rEdge;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(0, 0, 86, a0, a1, ccw);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = pose.alpha * maskMul("durandal");
  ctx.rotate(pose.ang);

function drawFurioso() {
  const F = duo.furi;
