const LAEV_THROW_SPEED = 2200;

function startLaevThrow() {
  const side = player.x < W / 2 ? 1 : -1, x = side > 0 ? W + 6 : -6, y = clamp(player.y + rand(-80, 80), 70, H - 70);
  spider.lt = {
    x,
    y,
    x0: x,
    y0: y,
    spin: 0,
    t: 0,
    warn: .8,
    state: "warn",
    aim: aimAt({
      x,
      y
    }, player.x, player.y),
    pinned: false,
    st: 0
  };
  if (spider.lu) {
    spider.lu.thrown = true;
  }
}

function updateLaevThrow(dt) {
  const T = spider.lt;
  if (!T) {
    return;
  }
  T.t += dt;
  if (T.state === "warn") {
    if (T.t < T.warn - .25) {
      T.aim = aimAt(T, player.x, player.y);
    }
    T.spin += dt * (16 + 26 * T.t / T.warn);
    if (T.t >= T.warn) {
      T.state = "fly";
      T.vx = Math.cos(T.aim) * LAEV_THROW_SPEED;
      T.vy = Math.sin(T.aim) * LAEV_THROW_SPEED;
      shake = Math.max(shake, 10);
    }
  } else if (T.state === "fly") {
    const toP = aimAt(T, player.x, player.y), ahead = (player.x - T.x) * Math.cos(T.aim) + (player.y - T.y) * Math.sin(T.aim);
    if (!T.pinned && ahead > 450) {
      let d = toP - T.aim;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      T.aim += clamp(d, -.5 * dt, .5 * dt);
      T.vx = Math.cos(T.aim) * LAEV_THROW_SPEED;
      T.vy = Math.sin(T.aim) * LAEV_THROW_SPEED;
    }
    T.x += T.vx * dt;
    T.y += T.vy * dt;
    T.spin += dt * 24;
    if (Math.random() < .9) {
      addSpark(T.x, T.y, rand(0, Math.PI * 2), rand(100, 320), pick(EMBERS));
    }
    if (!T.pinned && vulnerable() && Math.hypot(player.x - T.x, player.y - T.y) < 36) {
      damage({
        angle: T.aim
      });
      T.pinned = true;
      player.knockT = 0;
    }
    if (T.pinned) {
      player.x = T.x;
      player.y = T.y;
      player.stun = Math.max(player.stun, .3);
    }
    const m = 16;
    if (T.x < m || T.x > W - m || T.y < m || T.y > H - m) {
      T.x = clamp(T.x, m, W - m);
      T.y = clamp(T.y, m, H - m);
      T.state = "stuck";
      T.st = 0;
      shake = Math.max(shake, 18);
      addDebris(T.x, T.y, 10, 1.2);
      for (let i = 0; i < 20; i++) {
        addSpark(T.x, T.y, T.aim + Math.PI + rand(-1, 1), rand(150, 450), pick(EMBERS));
      }
      if (T.pinned) {
        T.px = clamp(T.x - Math.cos(T.aim) * 20, 20, W - 20);
        T.py = clamp(T.y - Math.sin(T.aim) * 20, 20, H - 20);
      }
    }
  } else if (T.state === "stuck") {
    T.st += dt;
    if (T.pinned) {
      player.x = T.px;
      player.y = T.py;
      player.stun = Math.max(player.stun, .3);
      if (!T.kicked && T.st >= .3) {
        T.kicked = true;
        const away = aimAt({
          x: T.px,
          y: T.py
        }, W / 2, H / 2);
        addZone({
          shape: "rect",
          x: W / 2,
          y: T.py,
          w: W + 40,
          h: 84,
          ang: 0,
          style: "middle",
          deco: "kick",
          dir: Math.cos(away) >= 0 ? 1 : -1,
          knock: away,
          warn: 1,
          active: .18,
          fade: .35
        });
      }
      if (T.kicked && T.st >= 1.32) {
        T.pinned = false;
        T.said = true;
        T.st = 0;
        mSay("불스아이군!", 1);
      }
    } else if (T.st >= (T.said ? .7 : .5)) {
      T.state = "pull";
      T.pt = 0;
      T.sx = T.x;
      T.sy = T.y;
    }
  } else if (T.state === "pull") {
    T.pt += dt;
    const u = Math.min(1, T.pt / .6), e = 1 - Math.pow(1 - Math.min(1, T.pt / .18), 3);
    T.x = T.sx - Math.cos(T.aim) * 90 * e;
    T.y = T.sy - Math.sin(T.aim) * 90 * e;
    T.alpha = 1 - u * u;
    if (T.pt < .05) {
      for (let i = 0; i < 10; i++) {
        addSpark(T.sx, T.sy, T.aim + Math.PI + rand(-.6, .6), rand(200, 500), pick(EMBERS));
      }
    }
    if (u >= 1) {
      spider.lt = null;
    }
  }
}

function drawLaevThrow() {
  const T = spider.lt;
  if (!T) {
    return;
  }
  const s = 1.6;
  ctx.save();
  if (T.state === "warn") {
    const k = T.t / T.warn, locked = T.t >= T.warn - .25;
    ctx.strokeStyle = locked ? "#fff0d0" : "#ff7a1a";
    ctx.shadowColor = "#ff5a12";
    ctx.shadowBlur = 10;
    ctx.lineWidth = 2 + 3 * k;
    ctx.globalAlpha = .35 + .5 * k;
    ctx.setLineDash([ 14, 10 ]);
    ctx.beginPath();
    ctx.moveTo(T.x, T.y);
    ctx.lineTo(T.x + Math.cos(T.aim) * 1400, T.y + Math.sin(T.aim) * 1400);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }
  if (T.alpha != null) {
    ctx.globalAlpha = Math.max(0, T.alpha);
  }
  if (T.state === "fly") {
    const L = 300, bx = T.x - Math.cos(T.aim) * L, by = T.y - Math.sin(T.aim) * L;
    const g = ctx.createLinearGradient(bx, by, T.x, T.y);
    g.addColorStop(0, "rgba(255,90,18,0)");
    g.addColorStop(1, "rgba(255,170,80,0.75)");
    ctx.strokeStyle = g;
    ctx.lineWidth = 16;
    ctx.lineCap = "round";
    ctx.shadowColor = "#ff5a12";
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(T.x, T.y);
    ctx.stroke();
  }
  ctx.translate(T.x, T.y);
  if (T.state === "stuck" || T.state === "pull") {
    ctx.rotate(T.aim);
    ctx.scale(s, s);
    ctx.translate(-LAEV_LEN + 10, 0);
  } else if (T.state === "fly") {
    ctx.rotate(T.aim);
    ctx.scale(s, s);
    ctx.translate(-LAEV_LEN + 16, 0);
  } else {
    ctx.rotate(T.spin);
    ctx.scale(s, s);
    ctx.translate(-24, 0);
  }
  drawLaevBlade();
  ctx.restore();
}

function updateLaevUlt(dt) {
  updateLaevWeapons(dt);
  updateLaevThrow(dt);
  const U = spider.lu;
  if (!U) {
    return;
  }
  U.t += dt;
  FATHERS.middle.pulse = Math.max(FATHERS.middle.pulse, .5);
  if (U.kind === "stab" && U.t >= U.end) {
    spider.lu = null;
  }
  if (U.kind === "exec" && !U.thrown && U.t > 7.2 && !spider.lt) {
    startLaevThrow();
  }
  if (U.kind === "exec" && U.thrown && !spider.lt) {
    spider.lu = null;
    FATHERS.middle.skillT = .6;
  }
  if (U.t > 16) {
    spider.lu = null;
    spider.lt = null;
  }
}

function startClosing() {
  spider.mat = 0;
  spider.matFlash = 1;
  hazards = hazards.filter(h => h.t > h.warn);
  laters = [];
  zones = zones.filter(z => z.t > z.warn);
  spider.precogs = [];
  spider.overheat = null;
  spider.overheatQueued = false;
  spider.disposal = null;
  spider.seat = null;
  spider.tibia = null;
  spider.tibiaQueued = false;
  spider.grabs = [];
  spider.closing = {
    t: 0,
    nextArt: 1,
    nextRow: 2.6,
    nextCut: 1.8,
    k: 0,
    end: false
  };
  fAct("ring", "폐장 - 설치미술 제1호");
  FATHERS.ring.skillT = 9.8;
  spider.banner = {
    text: "폐장",
    t: 0,
    big: true,
    color: BLOODC
  };
  const say = "폐장 시간이 되었군요. 그럼, 안녕히!";
  line = {
    text: say,
    t: 0,
    tone: "ring",
    name: "약지 아비 · 칼리스토"
  };
  spider.lineT = say.length / TYPE_SPEED + 1.6;
  shake = Math.max(shake, 16);
  flash = Math.max(flash, 1);
  flashColor = BLOODC;
}

const ART_LEN = [ [ 170, 230 ], [ 160, 220 ], [ 180, 240 ], [ 110, 150 ] ];

const ART_TH = [ .07, .045, .075, .09 ];

function addArt(x, y, warn = .8, tilt = rand(-.28, .28), kind = Math.floor(Math.random() * 4)) {
  const [l0, l1] = ART_LEN[kind];
  spider.arts.push({
    x: clamp(x, 20, W - 20),
    y: clamp(y, 20, H - 20),
    L: rand(l0, l1),
    ang: -Math.PI / 2 + tilt,
    kind,
    t: 0,
    warn,
    active: .45,
    fade: .6,
    ax: FATHERS.ring.x + rand(-30, 30),
    fired: false,
    flip: Math.random() < .5 ? 1 : -1
  });
}

function artOrient(kind) {
  if (kind === 1 || kind === 2) {
    ctx.scale(-1, 1);
  }
}

function artHit(A) {
  const g = artGrow(A), c = Math.cos(A.ang), s = Math.sin(A.ang);
  const bx = A.x - c * A.L / 2, by = A.y - s * A.L / 2, cx = bx + c * A.L * g / 2, cy = by + s * A.L * g / 2;
  const dx = player.x - cx, dy = player.y - cy;
  if (Math.abs(dx * c + dy * s) > A.L * g / 2) {
    return false;
  }
  const u = clamp(dx * c + dy * s, -A.L / 2, A.L / 2), px = cx + c * u, py = cy + s * u;
  const taper = 1 - Math.abs(u) / (A.L / 2) * .6;
  return Math.hypot(player.x - px, player.y - py) < A.L * ART_TH[A.kind] * taper + player.r * .5;
}

function updateClosing(dt) {
  const C = spider.closing;
  if (C) {
    C.t += dt;
    FATHERS.ring.pulse = Math.max(FATHERS.ring.pulse, .6);
    const sp = clamp(C.t / 8, 0, 1);
    if (C.t < 8.2 && C.t >= C.nextArt) {
      addArt(player.x + rand(-170, 170), player.y + rand(-130, 130));
      C.nextArt += .6 - .22 * sp;
    }
    if (C.t < 8.2 && C.t >= C.nextRow) {
      const n = 5, dir = Math.random() < .5 ? 1 : -1, y = player.y + rand(-30, 30);
      for (let i = 0; i < n; i++) {
        const d = (i - (n - 1) / 2) * 96;
        addArt(player.x + d, y, .7 + (dir > 0 ? i : n - 1 - i) * .07);
      }
      C.nextRow += 2.6;
    }
    if (C.t < 8 && C.t >= C.nextCut) {
      const h = makeSlash({
        cx: player.x,
        cy: player.y,
        angle: rand(0, Math.PI),
        width: 70,
        len: 520,
        warn: .6,
        curve: rand(80, 140) * (C.k % 2 ? -1 : 1),
        style: "ring"
      });
      h.sweep = .14;
      h.boneDust = true;
      hazards.push(h);
      C.k++;
      C.nextCut += 1.4 - .4 * sp;
    }
    if (!C.end && C.t >= 8.4) {
      C.end = true;
      spider.finaleArts = [];
      const spots = [];
      for (let x = 36; x <= W - 30; x += 96) {
        spots.push([ x, H + 4, -1 ]);
      }
      for (let y = H - 150; y >= 150; y -= 170) {
        spots.push([ W - 20, y + 60, -1 ]);
      }
      for (let x = W - 36; x >= 30; x -= 96) {
        spots.push([ x, 4, 1 ]);
      }
      for (let y = 150; y <= H - 150; y += 170) {
        spots.push([ 20, y + 60, -1 ]);
      }
      spots.forEach(([bx, by, dirY], i) => {
        const kind = Math.floor(Math.random() * 4), [l0, l1] = ART_LEN[kind], L = rand(l0, l1) * .6, tilt = rand(-.22, .22);
        const ang = (dirY < 0 ? -Math.PI / 2 : Math.PI / 2) + tilt;
        addArt(bx + Math.cos(ang) * L / 2, by + Math.sin(ang) * L / 2, .6 + i * .035, 0, kind);
        const A = spider.arts[spider.arts.length - 1];
        A.L = L;
        A.ang = ang;
        A.x = bx + Math.cos(ang) * L / 2;
        A.y = by + Math.sin(ang) * L / 2;
        spider.finaleArts.push({
          x: bx,
          y: by,
          L,
          ang,
          kind,
          flip: A.flip,
          born: 0
        });
      });
    }
    if (C.t > 9.8) {
      spider.closing = null;
      spider.terrainPending = true;
    }
  }
  for (const A of spider.arts) {
    A.t += dt;
    const after = A.t - A.warn;
    if (after < 0) {
      continue;
    }
    if (!A.fired) {
      A.fired = true;
      shake = Math.max(shake, 6);
      addDebris(A.x, A.y, 2, .9);
      for (let i = 0; i < 4; i++) {
        addSpark(A.x + Math.cos(A.ang) * rand(-.5, .5) * A.L, A.y + Math.sin(A.ang) * rand(-.5, .5) * A.L, rand(0, Math.PI * 2), rand(120, 320), pick([ BLOODC, BLOODC, BONE ]));
      }
    }
    if (after < A.active && vulnerable() && artHit(A)) {
      damage({
        angle: A.ang + Math.PI / 2
      });
    }
  }
  spider.arts = spider.arts.filter(A => A.t < A.warn + A.active + A.fade);
  if (spider.terrainPending && !spider.arts.length) {
    spider.terrainPending = false;
    placeTerrain();
  }
}

function artGrow(A) {
  return Math.min(1, Math.max(0, A.t - A.warn) / .09);
}

function placeTerrain() {
  if (spider.finaleArts && spider.finaleArts.length) {
    spider.terrain = spider.finaleArts;
    spider.finaleArts = null;
    return;
  }
  spider.terrain = [];
  for (let i = 0; i < 12; i++) {
    const edge = i < 6 ? 1 : i % 3 === 0 ? 0 : i % 3 === 1 ? 2 : 3;
    const kind = Math.floor(Math.random() * 4), [l0, l1] = ART_LEN[kind], L = rand(l0, l1) * rand(.55, .85), tilt = rand(-.3, .3);
    let x, y, up = true;
    if (edge === 1) {
      x = rand(30, W - 30);
      y = H + 6;
    } else if (edge === 0) {
      x = rand(80, W - 80);
      y = -6;
      up = false;
    } else if (edge === 2) {
      x = rand(10, 34);
      y = rand(H * .4, H + 6);
    } else {
      x = W - rand(10, 34);
      y = rand(H * .4, H + 6);
    }
    spider.terrain.push({
      x,
      y,
      L,
      ang: (up ? -Math.PI / 2 : Math.PI / 2) + tilt,
      kind,
      flip: Math.random() < .5 ? 1 : -1,
      born: 0
    });
  }
}

function sinkTerrain() {
  if (spider.terrainPending) {
    spider.terrainPending = false;
    placeTerrain();
  }
  if (spider.terrain) {
    for (const T of spider.terrain) {
      T.sink = true;
      T.born = 1;
      T.delay = Math.random() * .8;
    }
  }
}

function drawTerrain() {
  if (!spider.terrain) {
    return;
  }
  spider.terrain = spider.terrain.filter(T => !(T.sink && T.born <= 0));
  for (const T of spider.terrain) {
    if (T.sink) {
      if (T.delay > 0) {
        T.delay -= 1 / 60;
      } else {
        T.born = Math.max(0, T.born - .012);
      }
    } else {
      T.born = Math.min(1, T.born + .04);
    }
    ctx.save();
    ctx.globalAlpha = .38 * T.born;
    ctx.translate(T.x, T.y);
    ctx.rotate(T.ang);
    ctx.translate(T.L / 2 * T.born, 0);
    ctx.scale(T.born, T.flip);
    artOrient(T.kind);
    drawArtSprite(T.kind, T.L);
    ctx.restore();
  }
}

function drawArts() {
  for (const A of spider.arts) {
    ctx.save();
    if (A.t < A.warn) {
      const prog = A.t / A.warn, wob = Math.sin(A.t * 30 + A.x) * 4 * (1 - prog);
      ctx.strokeStyle = BLOODC;
      ctx.shadowColor = BLOODC;
      ctx.shadowBlur = 8;
      ctx.lineWidth = 1.2;
      ctx.globalAlpha = .35 + .5 * prog;
      ctx.beginPath();
      ctx.moveTo(A.ax, 62);
      ctx.quadraticCurveTo((A.ax + A.x) / 2 + wob * 6, (62 + A.y) / 2, A.x, A.y);
      ctx.stroke();
      const blink = Math.floor(A.t * (prog > .7 ? 22 : 10)) % 2 ? 1 : .45, th = A.L * ART_TH[A.kind];
      ctx.translate(A.x, A.y);
      ctx.rotate(A.ang);
      ctx.beginPath();
      ctx.moveTo(-A.L / 2, -th);
      ctx.lineTo(A.L / 2, 0);
      ctx.lineTo(-A.L / 2, th);
      ctx.closePath();
      ctx.globalAlpha = .06 + .18 * prog;
      ctx.fillStyle = BLOODC;
      ctx.fill();
      ctx.globalAlpha = blink;
      ctx.setLineDash([ 7, 5 ]);
      ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = .5 + .5 * prog;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(-A.L / 2, 0, 5, th * 1.6, 0, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      const after = A.t - A.warn, grow = artGrow(A), k = after < A.active ? 1 : 1 - (after - A.active) / A.fade;
      ctx.globalAlpha = Math.max(0, k);
      ctx.translate(A.x, A.y);
      ctx.rotate(A.ang);
      ctx.translate(-A.L / 2, 0);
      ctx.fillStyle = ART_C.fleshDk;
      ctx.beginPath();
      ctx.ellipse(0, 0, 6, A.L * ART_TH[A.kind] * 1.8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.translate(A.L / 2 * grow, 0);
      ctx.scale(grow, A.flip);
      artOrient(A.kind);
      drawArtSprite(A.kind, A.L);
    }
    ctx.restore();
  }
}

function artSprite(kind, L) {
  const S = cv.width / W, Lr = Math.max(40, Math.round(L / 8) * 8), key = "art:" + kind + ":" + Lr + ":" + S.toFixed(2);
  let c = spriteCache.get(key);
  if (!c) {
    if (spriteCache.size > 160) {
      spriteCache.clear();
    }
    const pad = 10, hw = Lr * .55 + pad, hh = Lr * .27 + pad;
    c = document.createElement("canvas");
    c.width = Math.ceil(hw * 2 * S);
    c.height = Math.ceil(hh * 2 * S);
    const g = c.getContext("2d");
    g.setTransform(S, 0, 0, S, hw * S, hh * S);
    const keep = ctx;
    ctx = g;
    drawArtShape(kind, Lr);
    ctx = keep;
    c.hw = hw;
    c.hh = hh;
    c.Lr = Lr;
    spriteCache.set(key, c);
  }
  return c;
}

function drawArtSprite(kind, L) {
  const c = artSprite(kind, L), k = L / c.Lr;
  ctx.drawImage(c, -c.hw * k, -c.hh * k, c.hw * 2 * k, c.hh * 2 * k);
}

const ART_C = {
  line: "#0b0a0c",
  boneHi: "#e4e0d8",
  bone: "#a8a39c",
  boneLo: "#5e5a56",
  boneDk: "#2e2b2a",
  flesh: "#8e1d24",
  fleshHi: "#c0323a",
  fleshDk: "#4e0c12"
};

function drawArtShape(kind, L) {
  const C = ART_C, h = L / 2;
  const poly = (pts, fill, w = 1.6) => {
    ctx.beginPath();
    pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = C.line;
    ctx.lineWidth = w;
    ctx.stroke();
  };
  const strand = (pts, col, w) => {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length - 1; i += 2) {
      ctx.quadraticCurveTo(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]);
    }
    ctx.strokeStyle = col;
    ctx.lineWidth = w;
    ctx.stroke();
  };
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.shadowColor = C.fleshHi;
  ctx.shadowBlur = 6;
  if (kind === 0) {
    const T = L * .05;
    poly([ [ -h, 0 ], [ -h * .75, -T * .6 ], [ h * .45, -T * .7 ], [ h, 0 ], [ h * .45, T * .7 ], [ -h * .75, T * .6 ] ], C.boneLo);
    for (let x = -h * .72; x < h * .3; x += L * .055) {
      poly([ [ x, -T * 1.1 ], [ x + L * .04, -T * .9 ], [ x + L * .042, T * .9 ], [ x + 2, T * 1.15 ] ], C.bone, 1.2);
    }
    for (let x = -h * .72; x < h * .3; x += L * .055) {
      ctx.fillStyle = C.boneHi;
      ctx.fillRect(x + 2, -T * .8, L * .015, T * .6);
    }
    for (let i = 0; i < 4; i++) {
      const p = [];
      for (let x = -h * .85; x <= h * .42; x += L * .06) {
        p.push([ x, Math.sin(x * .09 + i * 1.7) * T * 1.2 + (i - 1.5) * T * .3 ]);
      }
      strand(p, i % 2 ? C.flesh : C.fleshDk, i % 2 ? 2.4 : 3.2);
    }
    poly([ [ h * .3, -T * .4 ], [ h * .42, -T * 3.6 ], [ h * .46, -T * .3 ] ], C.boneHi, 1.2);
    poly([ [ h * .38, T * .4 ], [ h * .48, T * 2.4 ], [ h * .5, T * .3 ] ], C.bone, 1.2);
  } else if (kind === 1) {
    const T = L * .03;
    poly([ [ -h, 0 ], [ -h * .3, -T * .8 ], [ h * .42, -T ], [ h * .5, -T * 1.6 ], [ h * .58, -T * .9 ], [ h * .82, -T * 1.1 ], [ h * .9, -T * 2.4 ], [ h, -T * 1.6 ], [ h * .96, T * .4 ], [ h, T * 1.8 ], [ h * .86, T * 1.4 ], [ h * .58, T * 1.1 ], [ h * .5, T * 1.7 ], [ h * .42, T * 1.1 ], [ -h * .3, T * .8 ] ], C.bone);
    ctx.beginPath();
    ctx.moveTo(-h * .6, -T * .2);
    ctx.lineTo(h * .4, -T * .4);
    ctx.strokeStyle = C.boneHi;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-h * .2, T * .4);
    ctx.lineTo(h * .4, T * .6);
    ctx.strokeStyle = C.boneLo;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    poly([ [ h * .84, -T * .6 ], [ h * .95, -T * 1.2 ], [ h * .93, T * .8 ] ], C.boneLo, 1);
  } else if (kind === 2) {
    const T = L * .04;
    poly([ [ -h, 0 ], [ -h * .42, -T * .45 ], [ -h * .42, T * .45 ] ], C.boneLo);
    poly([ [ -h * .45, -T * .5 ], [ h * .98, -T * .6 ], [ h, T * .6 ], [ -h * .45, T * .5 ] ], C.boneDk, 1.2);
    for (let i = 0, x = -h * .44; x < h * .42; i++, x += L * .034) {
      const s = .8 + i * .045;
      poly([ [ x, -T * s ], [ x + L * .012, -T * s * 1.35 ], [ x + L * .028, -T * s * 1.2 ], [ x + L * .03, T * s * 1.2 ], [ x + L * .012, T * s * 1.35 ], [ x, T * s ] ], C.boneDk, 1);
      ctx.fillStyle = C.bone;
      ctx.fillRect(x + 1.5, -T * s * 1.05, L * .009, T * s * .9);
      ctx.fillStyle = C.boneLo;
      ctx.fillRect(x + 1.5, T * s * .1, L * .009, T * s * .8);
    }
    const fl = [];
    for (let x = h * .05; x <= h * .92; x += L * .03) {
      fl.push([ x, -T * (1.3 + .5 * Math.sin(x * .21)) ]);
    }
    for (let x = h * .92; x >= h * .05; x -= L * .03) {
      fl.push([ x, T * (1.2 + .5 * Math.cos(x * .17)) ]);
    }
    poly(fl, C.flesh, 1.2);
    for (let i = 0; i < 4; i++) {
      const p = [];
      for (let x = h * .07; x <= h * .9; x += L * .035) {
        p.push([ x, Math.sin(x * .15 + i * 1.6) * T * 1.1 ]);
      }
      strand(p, i % 2 ? C.fleshHi : C.fleshDk, i % 2 ? 1.3 : 2);
    }
    poly([ [ h * .88, -T * .9 ], [ h, -T * 1.8 ], [ h * .97, -T * .2 ], [ h * 1.04, T * .4 ], [ h * .95, T * 1.4 ], [ h * .86, T * .8 ] ], C.boneDk, 1.2);
    for (const [x, up, dn] of [ [ h * .28, 5.6, 5 ], [ h * .6, 4, 3.4 ] ]) {
      poly([ [ x - L * .013, -T * 1.2 ], [ x - L * .002, -T * up ], [ x + L * .013, -T * 1.2 ] ], C.boneDk, 1.3);
      poly([ [ x - L * .013, T * 1.2 ], [ x - L * .002, T * dn ], [ x + L * .013, T * 1.2 ] ], C.boneDk, 1.3);
      ctx.beginPath();
      ctx.moveTo(x - L * .004, -T * 1.4);
      ctx.lineTo(x - L * .002, -T * up * .8);
      ctx.strokeStyle = C.bone;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  } else {
    const T = L * .065;
    poly([ [ -h, 0 ], [ -h * .6, -T * .75 ], [ -h * .3, -T * 1 ], [ -h * .12, -T * 1.6 ], [ h * .05, -T * 1.25 ], [ h * .3, -T * 1.1 ], [ h * .42, -T * 1.4 ], [ h * .6, -T * .8 ], [ h, 0 ], [ h * .6, T * .75 ], [ h * .35, T * 1 ], [ h * .1, T * 1.3 ], [ -h * .15, T * 1 ], [ -h * .35, T * 1.25 ], [ -h * .6, T * .75 ] ], C.fleshDk);
    for (const [x0, x1] of [ [ -h * .62, -h * .18 ], [ -h * .12, h * .36 ], [ h * .42, h * .72 ] ]) {
      ctx.beginPath();
      ctx.moveTo(x0, -T * .35);
      ctx.lineTo(x1, -T * .4);
      ctx.lineTo(x1, T * .35);
      ctx.lineTo(x0, T * .3);
      ctx.closePath();
      ctx.fillStyle = "#b8948f";
      ctx.fill();
      ctx.strokeStyle = C.line;
      ctx.lineWidth = 1;
      ctx.stroke();
      for (const xx of [ x0, x1 ]) {
        ctx.beginPath();
        ctx.ellipse(xx, 0, T * .4, T * .62, 0, 0, Math.PI * 2);
        ctx.fillStyle = C.flesh;
        ctx.fill();
        ctx.stroke();
      }
      ctx.fillStyle = "#d9a0a0";
      ctx.globalAlpha *= .75;
      ctx.fillRect(x0 + 3, -T * .25, x1 - x0 - 6, T * .16);
      ctx.globalAlpha /= .75;
    }
    strand([ [ -h * .85, T * .1 ], [ -h * .4, -T * .9 ], [ 0, -T * .1 ], [ h * .4, T * .8 ], [ h * .85, 0 ] ], C.fleshHi, 1.4);
    strand([ [ -h * .7, -T * .4 ], [ -h * .2, T * .7 ], [ h * .2, -T * .6 ], [ h * .5, T * .4 ], [ h * .75, -T * .2 ] ], C.fleshDk, 2);
  }
}

function updateGrabs(dt) {
  spider.exposedT = Math.max(0, spider.exposedT - dt);
  for (const G of spider.grabs) {
    G.t += dt;
    if (G.t < G.track) {
      const k = Math.min(1, dt * 2.2);
      G.x += (player.x - G.x) * k;
      G.y += (player.y - G.y) * k;
    } else if (G.t >= G.track + G.lock && !G.done) {
      G.done = true;
      shake = Math.max(shake, 10);
      for (let i = 0; i < 16; i++) {
        const a = i / 16 * Math.PI * 2;
        addSpark(G.x + Math.cos(a) * G.R, G.y + Math.sin(a) * G.R, a + Math.PI, rand(120, 300), pick([ BLOODC, BONE ]));
      }
      if (Math.hypot(player.x - G.x, player.y - G.y) < G.R + player.r * .5 && player.dashInv <= 0) {
        player.stun = Math.max(player.stun, 1);
        spider.exposedT = 3;
        spider.held = {
          x: player.x,
          y: player.y,
          t: 0
        };
        flash = Math.max(flash, .6);
        flashColor = BLOODC;
        hurt = Math.max(hurt, .6);
      }
    }
  }
  spider.grabs = spider.grabs.filter(G => G.t < G.track + G.lock + .4);
  if (spider.held) {
    spider.held.t += dt;
    if (spider.held.t > 1) {
      spider.held = null;
    }
  }
}

function drawGrabs() {
  for (const G of spider.grabs) {
    ctx.save();
    ctx.translate(G.x, G.y);
    ctx.strokeStyle = BLOODC;
    ctx.fillStyle = BLOODC;
    ctx.shadowColor = BLOODC;
    ctx.shadowBlur = 10;
    if (!G.done) {
      const locking = G.t >= G.track, k = locking ? (G.t - G.track) / G.lock : 0;
      const blink = locking ? Math.floor(G.t * 24) % 2 ? 1 : .45 : .8;
      ctx.globalAlpha = .06 + .16 * k;
      ctx.beginPath();
      ctx.arc(0, 0, G.R, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = blink;
      ctx.lineWidth = 2;
      ctx.setLineDash([ 8, 6 ]);
      ctx.lineDashOffset = -G.t * 30;
      ctx.beginPath();
      ctx.arc(0, 0, G.R, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.lineWidth = 1;
      ctx.globalAlpha = .6;
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * Math.PI * 2 + G.t * .8, r2 = G.R * (1 - k * .8);
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * G.R, Math.sin(a) * G.R);
        ctx.quadraticCurveTo(0, 0, Math.cos(a + 2.4) * r2, Math.sin(a + 2.4) * r2);
        ctx.stroke();
      }
      ctx.strokeStyle = BONE;
      ctx.globalAlpha = .9;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, G.R * (1.3 - .3 * k), 0, Math.PI * 2);
      ctx.globalAlpha = .35 + .4 * k;
      ctx.stroke();
    } else {
      const k = 1 - (G.t - G.track - G.lock) / .4;
      ctx.globalAlpha = Math.max(0, k);
      ctx.lineWidth = 4;
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.arc(0, 0, G.R * (.3 + .7 * k), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }
  if (spider.held) {
    const Hd = spider.held, k = 1 - Hd.t;
    ctx.save();
    ctx.strokeStyle = BLOODC;
    ctx.shadowColor = BLOODC;
    ctx.shadowBlur = 8;
    ctx.lineWidth = 1.3;
    ctx.globalAlpha = Math.max(0, k);
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * Math.PI * 2 + .3;
      ctx.beginPath();
      ctx.moveTo(player.x + Math.cos(a) * 90, player.y + Math.sin(a) * 90);
      ctx.lineTo(player.x, player.y);
      ctx.stroke();
    }
    ctx.restore();
  }
  if (spider.exposedT > 0) {
    ctx.save();
    ctx.textAlign = "center";
    ctx.fillStyle = BLOODC;
    ctx.shadowColor = BLOODC;
    ctx.shadowBlur = 8;
    ctx.font = '600 11px "IBM Plex Sans KR", sans-serif';
    ctx.fillText("신체관극 · 참격 +50%", player.x, player.y + 30);
    ctx.fillStyle = COLOR.line;
    ctx.fillRect(player.x - 30, player.y + 36, 60, 3);
    ctx.fillStyle = BLOODC;
    ctx.fillRect(player.x - 30, player.y + 36, 60 * spider.exposedT / 3, 3);
    ctx.restore();
  }
}

function updateSeat(dt) {
  const S = spider.seat;
  if (!S) {
    return;
  }
  S.t += dt;
  if (S.t < S.warn) {
    S.x = player.x;
    S.y = player.y;
    return;
  }
  if (!S.sat) {
    S.sat = true;
    S.x = player.x;
    S.y = player.y;
    particles.push({
      type: "ring",
      x: S.x,
      y: S.y,
      vx: 0,
      vy: 0,
      r: 30,
      grow: -30,
      life: .4,
      max: .4,
      color: FATHERS.ring.color
    });
  }
  if (!S.broken && Math.hypot(player.x - S.x, player.y - S.y) > 14) {
    S.broken = true;
    player.inv = 0;
    player.dashInv = 0;
    damage({
      angle: rand(0, Math.PI)
    });
  }
  if (S.t > S.warn + S.dur) {
    spider.seat = null;
  }
}

function seatedSafe() {
  const S = spider && spider.seat;
  return !!(S && S.sat && !S.broken);
}

function drawSeat() {
  const S = spider.seat;
  if (!S) {
    return;
  }
  const c = FATHERS.ring.color;
  ctx.save();
  ctx.strokeStyle = c;
  ctx.fillStyle = c;
  ctx.shadowColor = c;
  ctx.textAlign = "center";
  if (S.t < S.warn) {
    const blink = Math.floor(S.t * 10) % 2 ? 1 : .45;
    ctx.globalAlpha = blink;
    ctx.lineWidth = 2;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(player.x, player.y - 58);
    ctx.lineTo(player.x + 18, player.y - 28);
    ctx.lineTo(player.x - 18, player.y - 28);
    ctx.closePath();
    ctx.stroke();
    ctx.font = '700 18px "IBM Plex Sans KR", sans-serif';
    ctx.fillText("!", player.x, player.y - 33);
    ctx.font = '600 13px "IBM Plex Sans KR", sans-serif';
    ctx.globalAlpha = 1;
    ctx.fillText("착석 · 멈추십시오", player.x, player.y - 66);
    ctx.setLineDash([ 5, 5 ]);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(player.x, player.y, 22, 0, Math.PI * 2);
    ctx.stroke();
  } else {
    const k = 1 - (S.t - S.warn) / S.dur;
    ctx.lineWidth = 3;
    ctx.shadowBlur = 14;
    ctx.globalAlpha = S.broken ? .3 : 1;
    ctx.beginPath();
    ctx.arc(S.x, S.y, 22, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k);
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.globalAlpha *= .5;
    ctx.beginPath();
    ctx.arc(S.x, S.y, 14, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = S.broken ? .6 : 1;
    ctx.font = '600 12px "IBM Plex Sans KR", sans-serif';
    ctx.fillText(S.broken ? "상처" : "착석 중 · 무적", S.x, S.y - 32);
  }
  ctx.restore();
}

function drawCorpusGauge(x, y) {
  const w = 64, m = spider.mat || 0;
  ctx.save();
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.fillStyle = COLOR.line;
  ctx.fillRect(x - w / 2, y, w, 4);
  const g = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
  g.addColorStop(0, BONE);
  g.addColorStop(1, BLOODC);
  ctx.fillStyle = g;
  ctx.shadowColor = m >= 1 ? BLOODC : BONE;
  ctx.shadowBlur = 4 + 12 * (spider.matFlash || 0) + (m >= 1 ? 8 * Math.abs(Math.sin(performance.now() / 120)) : 0);
  ctx.fillRect(x - w / 2, y, w * m, 4);
  ctx.font = '500 9px "IBM Plex Mono", monospace';
  ctx.fillStyle = COLOR.dim;
  ctx.shadowBlur = 0;
  ctx.textAlign = "center";
  ctx.fillText(spider.closing ? "폐장" : spider.tibia ? "티비아" : `재료 ${Math.floor(m * 100)}%`, x, y + 15);
  ctx.restore();
}

function pinwheel(x, y, n, warn, R = 70) {
  const a0 = rand(0, Math.PI * 2), dir = Math.random() < .5 ? 1 : -1;
  for (let i = 0; i < n; i++) {
    const a = a0 + dir * i * Math.PI * 2 / n;
    const h = makeSlash({
      cx: x + Math.cos(a) * R,
      cy: y + Math.sin(a) * R,
      angle: a + Math.PI / 2,
      width: 26,
      len: 90,
      warn,
      delay: i * .035,
      curve: dir * 25,
      style: i % 2 ? "thumbR" : "thumb"
    });
    h.sweep = .04;
    hazards.push(h);
  }
}

function disposalCut(k, warn) {
  const a = rand(0, Math.PI * 2), r = rand(60, 170);
  const x = clamp(player.x + Math.cos(a) * r, 10, W - 10), y = clamp(player.y + Math.sin(a) * r, 10, H - 10);
  const h = makeSlash({
    cx: x,
    cy: y,
    angle: rand(0, Math.PI),
    width: k % 2 ? 24 : 32,
    len: rand(200, 270),
    warn,
    curve: k % 2 ? 0 : rand(60, 120) * (Math.random() < .5 ? 1 : -1),
    style: k % 2 ? "thumbR" : "thumb"
  });
  h.sweep = .06;
  hazards.push(h);
}

function updateDisposal(dt) {
  const D = spider.disposal;
  if (!D) {
    return;
  }
  D.t += dt;
  FATHERS.thumb.pulse = Math.max(FATHERS.thumb.pulse, .6);
  const rainEnd = 1.2 + DISP_RAIN;
  if (D.t < rainEnd) {
    const sp = clamp((D.t - 1.2) / DISP_RAIN, 0, 1);
    const warn = .58 - .1 * sp;
    while (D.t >= D.next) {
      disposalCut(D.k++, warn);
      D.next += .32 - .12 * sp;
      shake = Math.max(shake, 3);
    }
    if (D.t >= D.cross) {
      spX2(player.x, player.y, 280, 38, warn, "thumb", "thumbR");
      D.cross += 1.7 - .3 * sp;
    }
    if (D.t >= D.spin) {
      const a0 = rand(0, Math.PI * 2), dir = Math.random() < .5 ? 1 : -1, x = player.x, y = player.y;
      for (let i = 0; i < 8; i++) {
        if (i === 3 || i === 7) {
          continue;
        }
        const a = a0 + dir * i * Math.PI / 4;
        const h = makeSlash({
          cx: x + Math.cos(a) * 120,
          cy: y + Math.sin(a) * 120,
          angle: a + Math.PI / 2,
          width: 28,
          len: 150,
          warn,
          delay: i * .05,
          curve: dir * 40,
          style: i % 2 ? "thumbR" : "thumb"
        });
        h.sweep = .05;
        hazards.push(h);
      }
      D.spin += 3;
    }
  } else if (!D.end) {
    D.end = true;
    const o = fpos("thumb");
    const th = thrust(o, aimAt(o, player.x, player.y), "thumbR", .6, 54);
    th.big = true;
    hazards.push(th);
    later(.65, () => {
      const a = rand(0, Math.PI), x = player.x, y = player.y;
      for (const [d, st, w] of [ [ 0, "thumb", 140 ], [ Math.PI / 2, "thumbR", 90 ] ]) {
        const h = makeSlash({
          cx: x,
          cy: y,
          angle: a + d,
          width: w * .85,
          len: 760,
          warn: .8,
          curve: st === "thumb" ? 60 : 0,
          style: st
        });
        h.big = true;
        h.disposalFinal = true;
        h.sweep = .12;
        h.active = .2;
        hazards.push(h);
      }
    });
  }
  if (D.t > 10) {
    spider.disposal = null;
    spider.prey = 0;
  }
}

function spX2(x, y, len, width, warn, s1, s2) {
  const a = rand(0, Math.PI);
  hazards.push(makeSlash({
    cx: x,
    cy: y,
    angle: a,
    width,
    len,
    warn,
    curve: rand(-40, 40),
    style: s1
  }));
  hazards.push(makeSlash({
    cx: x,
    cy: y,
    angle: a + Math.PI / 2,
    width: width * .8,
    len,
    warn,
    delay: .06,
    curve: 0,
    style: s2
  }));
}

function precogFlash(x, y, size = 1) {
  spider.crosses.push({
    x,
    y,
    t: 0,
    dur: .75,
    size
  });
  particles.push({
    type: "ring",
    x,

    vx: 0,
    vy: 0,
    r: 4,
    grow: 160 * size,
    life: .35,
    max: .35,
    color: PRECOG
  });
}

function spX(x, y, len, width, warn, style, delay = 0) {
  const a = rand(0, Math.PI);
  for (const d of [ 0, Math.PI / 2 ]) {
    hazards.push(makeSlash({
      cx: x,
      cy: y,
      angle: a + d,
      width,
      len,
      warn,
      delay,
      curve: 0,
      style
    }));
  }
}

  if (bossKey !== "spider") {
    return;
  }
  if (spider.prev && dt > 0) {
    const vx = (player.x - spider.prev.x) / dt, vy = (player.y - spider.prev.y) / dt;
    spider.pv.x += (clamp(vx, -900, 900) - spider.pv.x) * Math.min(1, dt * 8);
    spider.pv.y += (clamp(vy, -900, 900) - spider.pv.y) * Math.min(1, dt * 8);
  }
  spider.prev = {
    x: player.x,
    y: player.y
  };
  for (const k in FATHERS) {
    const F = FATHERS[k];
    F.pulse = Math.max(0, F.pulse - dt * 2);
    F.skillT = Math.max(0, F.skillT - dt);
    F.arriveT = Math.max(0, F.arriveT - dt);
  }
  for (const e of spider.eyes) {
    e.t += dt;
  }
  spider.eyes = spider.eyes.filter(e => e.t < e.dur + .3);
  for (const c of spider.crosses) {
    c.t += dt;
  }
  updateOverheat(dt);
  updatePrecogs(dt);
  if (spider.overheatQueued && elapsed >= (spider.overheatAt || 0) && !spiderUltBusy() && !script) {
    startOverheat();
  }
  if (spider.tibia && elapsed >= (spider.tibiaEnd || 0)) {
    spider.tibia = null;
    nextPatternAt = elapsed + .6;
  }
  const FIN = {
    1: startDisposal,
    3: () => {
      SP.midGrudge();
      nextPatternAt = Math.max(nextPatternAt, elapsed + 3.4);
    },
    4: startRend,
    5: startReplica
  };
  const ph = phase();
  if (endless && spider.eUlts && spider.eUlts.length) {
    const lt = elapsed - phaseStart(ph);
    if (lt >= spider.eUlts[0].at && !spiderUltBusy()) {
      const k = spider.eUlts.shift().k;
      (k === "stab" ? startLaevStab : startLaevExec)();
    }
  }
  if (FIN[ph] && !script && !(endless && endless.cur.ults)) {
    const at = ph === 3 ? phaseStart(3) + phaseLen() / 2 : phaseEnd(ph) - 10;
    if (elapsed < at) {
      spider.finArmed[ph] = true;
    } else if (spider.finArmed[ph]) {
      spider.finArmed[ph] = false;
      FIN[ph]();
    }
  }
  if (ph === 6 && !script) {
    const lt = elapsed - phaseStart(6);
    if (!spider.all || lt < spider.all.lt) {
      const o = [ "thumb", "pinky", "index" ].sort(() => Math.random() - .5);
      spider.all = {
        lt,
        seq: [ o[0], "stab", o[1], "exec", o[2] ],
        next: .8,
        busy: false
      };
    }
    const A = spider.all;
    A.lt = lt;
    const busy = spiderUltBusy();
    if (A.busy && !busy) {
      A.next = lt + .8;
    }
    A.busy = busy;
    if (!busy && A.seq.length) {
      if (A.next - lt < 1.2) {
        nextPatternAt = Math.max(nextPatternAt, elapsed + .3);
      }
      if (lt >= A.next) {
        const k = A.seq.shift();
        ({
          thumb: startDisposal,
          ring: startClosing,
          pinky: startRend,
          index: startReplica,
          stab: startLaevStab,
          exec: startLaevExec
        })[k]();
        A.busy = true;
      }
    }
  }
  if (ph >= 2 && ph < 6 && !script) {
    if (spider.intPhase !== ph || elapsed < spider.intStart) {
      spider.intPhase = ph;
      spider.intStart = elapsed;
      spider.nextInt = Math.max(elapsed, phaseStart(ph)) + rand(3, 6);
    }
    if (elapsed >= spider.nextInt) {
      const busy = spider.disposal || spider.closing || spider.laev || spider.tibia || spider.overheat || spider.rend || spider.replica;
      if (busy) {
        spider.nextInt = elapsed + .8;
      } else {
        spider.nextInt = elapsed + rand(7, 10);
        const prev = Object.keys(FATHERS).filter(k => FATHERS[k].arrived && FATHERS[k].join < ph);
        if (prev.length) {
          const k = pick(prev);
          SP[pick(FATHER_PATTERNS[k])]();
        }
      }
    }
  }
  updateDisposal(dt);
  updateClosing(dt);
  updateLaev(dt);
  updateRend(dt);
  updateReplica(dt);
  updateLaevUlt(dt);
  updateRienWeapons(dt);
  updateSeat(dt);
  updateGrabs(dt);
  updateMaterial(dt);
  if (spider.lineT > 0) {
    spider.lineT -= dt;
    if (spider.lineT <= 0 && !script) {
      line = null;
    }
  }
  spider.eyeFlash = Math.max(0, spider.eyeFlash - dt * 2);
  spider.prey = Math.max(0, spider.prey - dt);
  spider.crosses = spider.crosses.filter(c => c.t < c.dur + .35);
  if (spider.prescript) {
    spider.prescript.t += dt;
    if (spider.prescript.t > 2) {
      spider.prescript = null;
    }
  }
  if (spider.banner) {
    spider.banner.t += dt;
    if (spider.banner.t > 1.6) {
      spider.banner = null;
    }
  }
  for (const z of zones) {
    z.t += dt;
    const after = z.t - z.warn;
    if (after < 0) {
      continue;
    }
    const S = STYLE[z.style];
    if (!z.fired) {
      z.fired = true;
      if (z.deco === "kick") {
        addGouge(z.y, z.h, z.dir);
      }
      shake = Math.max(shake, z.deco === "tile" ? 5 : 8);
      flash = Math.max(flash, .35);
      flashColor = S.flash;
      const n = z.shape === "ring" ? 10 : 6;
      for (let i = 0; i < n; i++) {
        let px, py;
        if (z.shape === "ring") {
          const a = rand(0, Math.PI * 2);
          px = z.x + Math.cos(a) * z.r1;
          py = z.y + Math.sin(a) * z.r1;
        } else {
          const u = rand(-.5, .5) * z.w;
          px = z.x + Math.cos(z.ang) * u;
          py = z.y + Math.sin(z.ang) * u;
        }
        if (onScreen(px, py)) {
          addSpark(px, py, rand(0, Math.PI * 2), rand(140, 380), pick(S.sparks));
        }
      }
    }
    if (z.deco === "burn" && after < z.active && Math.random() < .8) {
      const u = rand(-.5, .5) * z.w, v = rand(-.5, .5) * z.h;
      addSpark(z.x + Math.cos(z.ang) * u - Math.sin(z.ang) * v, z.y + Math.sin(z.ang) * u + Math.cos(z.ang) * v, -Math.PI / 2 + rand(-.4, .4), rand(60, 200), pick(S.sparks));
    }
    if (after < z.active && vulnerable() && zoneHit(z)) {
      damage({
        angle: z.ang + Math.PI / 2,
        knock: z.knock ?? null
      });
    }
  }
  zones = zones.filter(z => z.t < z.warn + z.active + z.fade);
}

function drawZones() {
  for (const z of zones) {
    if (z.t < 0) {
      continue;
    }
    const S = STYLE[z.style];
    ctx.save();
    ctx.strokeStyle = S.glow;
    ctx.fillStyle = S.glow;
    ctx.shadowColor = S.glow;
    if (z.t < z.warn) {
      const prog = z.t / z.warn, blink = Math.floor(z.t * (prog > .7 ? 22 : 10)) % 2 ? 1 : .4;
      ctx.globalAlpha = .05 + .15 * prog;
      zonePath(z);
      ctx.fill("evenodd");
      ctx.globalAlpha = blink * Math.min(1, z.t / .1);
      ctx.lineWidth = 1.3;
      ctx.shadowBlur = 8;
      ctx.setLineDash([ 10, 7 ]);
      zonePath(z);
      ctx.stroke();
    } else {
      const after = z.t - z.warn, live = after < z.active;
      const k = live ? 1 : 1 - (after - z.active) / z.fade;
      ctx.globalAlpha = Math.max(0, k) * (z.deco === "burn" ? .55 + .2 * Math.sin(z.t * 30) : z.deco === "tile" ? .42 : z.deco === "seats" ? .3 : .85);
      ctx.shadowBlur = 24;
      zonePath(z, live ? 2 : 0);
      ctx.fill("evenodd");
      ctx.globalAlpha = Math.max(0, k);
      ctx.fillStyle = S.tip;
      ctx.shadowBlur = 10;
      if (z.shape === "rect") {
        ctx.translate(z.x, z.y);
        ctx.rotate(z.ang);
        if (z.deco === "chain") {
          ctx.strokeStyle = S.tip;
          ctx.lineWidth = 2;
          for (let u = -z.w / 2; u < z.w / 2; u += 22) {
            ctx.beginPath();
            ctx.ellipse(u, 0, 10, u / 22 % 2 ? 5 : 2, 0, 0, Math.PI * 2);
            ctx.stroke();
          }
        } else if (z.deco === "bone") {
          ctx.fillRect(-z.w / 2 + 6, -z.h * .18, z.w - 12, z.h * .36);
          for (const s of [ -1, 1 ]) {
            for (const t of [ -1, 1 ]) {
              ctx.beginPath();
              ctx.arc(s * (z.w / 2 - 6), t * z.h * .25, z.h * .28, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        } else if (z.deco === "kick") {
          ctx.strokeStyle = S.tip;
          ctx.lineCap = "round";
          const off = (z.t - z.warn) * 1400 * z.dir % 120;
          for (let i = 0; i < 7; i++) {
            const yy = (i - 3) * z.h * .13, x0 = -z.w / 2 + ((i * 97 + off) % z.w + z.w) % z.w;
            ctx.lineWidth = i % 2 ? 2 : 3.5;
            ctx.beginPath();
            ctx.moveTo(x0, yy);
            ctx.lineTo(x0 - z.dir * 90, yy);
            ctx.stroke();
          }
        } else if (z.deco === "seats") {
          ctx.strokeStyle = S.tip;
          ctx.lineWidth = 2;
          const along = z.w >= z.h, L = along ? z.w : z.h, T = along ? z.h : z.w;
          for (let u = -L / 2 + 10; u < L / 2; u += 22) {
            ctx.beginPath();
            if (along) {
              ctx.moveTo(u, -T * .35);
              ctx.lineTo(u, T * .35);
            } else {
              ctx.moveTo(-T * .35, u);
              ctx.lineTo(T * .35, u);
            }
            ctx.stroke();
          }
        } else if (z.deco === "spike") {
          ctx.fillRect(-z.w / 2, -z.h * .15, z.w, z.h * .3);
        } else if (z.deco === "tile") {
          ctx.strokeStyle = S.scar;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-z.w / 2, -z.h / 2);
          ctx.lineTo(z.w / 2, z.h / 2);
          ctx.moveTo(z.w / 2, -z.h / 2);
          ctx.lineTo(0, 0);
          ctx.stroke();
        } else {
          ctx.fillRect(-z.w / 2, -z.h * .12, z.w, z.h * .24);
        }
      }
    }
    ctx.restore();
  }
  for (const e of spider.eyes) {
    const k = e.t < e.dur ? Math.min(1, e.t * 6) : 1 - (e.t - e.dur) / .3;
    ctx.save();
    ctx.globalAlpha = Math.max(0, k);
    ctx.strokeStyle = PRECOG;
    ctx.fillStyle = PRECOG;
    ctx.shadowColor = PRECOG;
    ctx.shadowBlur = 14;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(e.x - 22, e.y);
    ctx.quadraticCurveTo(e.x, e.y - 16, e.x + 22, e.y);
    ctx.quadraticCurveTo(e.x, e.y + 16, e.x - 22, e.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(e.x, e.y, 5 + 2 * Math.sin(e.t * 20), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawSpiderSigils() {

    const a = FATHERS[on[i]], b = FATHERS[on[i + 1]], sag = 14 + 4 * Math.sin(elapsed * 2 + i);

    ctx.lineWidth = 1.8;

    if (k === "thumb") {

    }
    if (k === "pinky") {

    }
    if (k === "index") {

    }
    if (k === "middle") {
      ctx.save();
      ctx.shadowBlur = 0;
      for (let i = 0; i < 3; i++) {
        const on = i >= spider.seals;
        ctx.globalAlpha = on ? .9 : .25;
        ctx.strokeStyle = on ? F.color : COLOR.dim;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.ellipse(F.x - 14 + i * 14, y + 78, 6, 3.4, 0, 0, Math.PI * 2);

      }
      ctx.globalAlpha = .9;
      ctx.font = '500 9px "IBM Plex Mono", monospace';

      ctx.textAlign = "center";
      ctx.fillText(spider.seals >= 3 ? "레바테인 해방" : `봉인 ${3 - spider.seals}겹`, F.x, y + 94);
      ctx.restore();
    }
  }
  drawMaskFall();
  ctx.restore();
}

function iconSprite(key, fn) {
  const S = cv.width / W * 1.25, k = "icon:" + key + ":" + S.toFixed(2);
  let c = spriteCache.get(k);
  if (!c) {
    if (spriteCache.size > 160) {
      spriteCache.clear();
    }
    c = document.createElement("canvas");
    c.width = c.height = Math.ceil(48 * S);
    const g = c.getContext("2d");
    g.setTransform(S, 0, 0, S, 24 * S, 24 * S);
    g.lineCap = "round";
    g.lineJoin = "round";
    const keep = ctx;
    ctx = g;
    try {
      fn();
    } finally {
      ctx = keep;
    }
    spriteCache.set(k, c);
  }
  ctx.save();
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
  ctx.drawImage(c, -24, -24, 48, 48);
  ctx.restore();
}

function icClip(r = 17) {
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.clip();
}

function icPoly(pts) {
  ctx.beginPath();
  pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.closePath();
}

function icDots(color, step = 2.2, r = .45, R = 18) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let y = -R, row = 0; y <= R; y += step, row++) {
    for (let x = -R + (row % 2 ? step / 2 : 0); x <= R; x += step) {
      ctx.moveTo(x + r, y);
      ctx.arc(x, y, r, 0, Math.PI * 2);
    }
  }
  ctx.fill();
}

function icGroup(paths, fill, edge, glow, dots) {
  ctx.save();
  ctx.shadowColor = glow || edge;
  ctx.shadowBlur = 8;
  ctx.strokeStyle = edge;
  ctx.lineWidth = 1.6;
  for (const f of paths) {
    f();
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  ctx.fillStyle = fill;
  for (const f of paths) {
    f();
    ctx.fill();
  }
  if (dots) {
    for (const f of paths) {
      ctx.save();
      f();
      ctx.clip();
      icDots(dots);
      ctx.restore();
    }
  }
  ctx.restore();
}

function icShape(path, fill, edge, glow, dots) {
  ctx.save();
  path();
  ctx.shadowColor = glow || edge;
  ctx.shadowBlur = 8;
  ctx.strokeStyle = edge;
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = fill;
  ctx.fill();
  if (dots) {
    ctx.clip();
    icDots(dots);
  }
  ctx.restore();
}

function icMap(cx, cy, k) {
  const m = ([x, y]) => [ (x - cx) * k, (y - cy) * k ];
  return {
    pt: m,
    poly(pts) {
      ctx.beginPath();
      pts.forEach((q, i) => {
        const [x, y] = m(q);
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      });
      ctx.closePath();
    },
    line(pts) {
      ctx.beginPath();
      pts.forEach((q, i) => {
        const [x, y] = m(q);
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      });
    },
    quad(a, c, b) {
      const [ax, ay] = m(a), [cx2, cy2] = m(c), [bx, by] = m(b);
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.quadraticCurveTo(cx2, cy2, bx, by);
    },
    circle(c, r) {
      const [x, y] = m(c);
      ctx.beginPath();
      ctx.arc(x, y, r * k, 0, Math.PI * 2);
    },
    ell(c, rx, ry, a = 0) {
      const [x, y] = m(c);
      ctx.beginPath();
      ctx.ellipse(x, y, rx * k, ry * k, a, 0, Math.PI * 2);
    },
    k
  };
}

  ctx.stroke();
  ctx.strokeStyle = "#8c8c9c";
  ctx.lineWidth = 1.6;
  M.line([ [ 90, 75 ], [ 107, 70 ] ]);
  ctx.stroke();
  ctx.strokeStyle = "#3a3a48";
  ctx.lineWidth = .4;
  for (const t of [ .25, .5, .75 ]) {
    const x = 90 + 17 * t, y = 75 - 5 * t;
    M.line([ [ x - 1, y - 1.2 ], [ x + 1, y + 1.2 ] ]);
    ctx.stroke();
  }
  ctx.fillStyle = "#ff6a6a";
  M.circle([ 115, 69 ], 1.5);
  ctx.fill();
}

function drawFatherIcon(k, c) {
  if (k === "index") {
    iconSprite("index:" + (spider.unmasked ? "face" : "mask"), spider.unmasked ? drawRienFace : drawRienMaskIcon);
    return;
  }
  if (k === "thumb") {
    const pc = spider.crosses.length > 0;
    iconSprite("thumb:" + pc, () => drawValentina(pc));
    return;
  }
  if (k === "middle") {
    iconSprite("middle", drawMatthias);
    return;
  }
  if (k === "ring") {
    iconSprite("ring", drawCallisto);
    return;
  }
  if (k === "pinky") {
    iconSprite("pinky", drawYoruIcon);
    return;
  }
}

function drawPrecogCrosses() {
  for (const c of spider.crosses) {
    const q = Math.min(1, c.t / c.dur), spin = 1 - Math.pow(1 - q, 3);
    const rot = spin * (Math.PI * 2 + Math.PI / 4);
    const fade = c.t < c.dur ? 1 : 1 - (c.t - c.dur) / .35;
    const L = (30 + 70 * Math.min(1, q * 2)) * c.size, th = (2.4 + 1.6 * q) * Math.max(.7, c.size), tip = L * .2;
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(rot);
    ctx.fillStyle = PRECOG;
    ctx.shadowColor = PRECOG;
    ctx.globalAlpha = Math.max(0, fade) * (.5 + .5 * q);
    for (const a of [ 0, Math.PI / 2 ]) {
      ctx.save();
      ctx.rotate(a);
      ctx.shadowBlur = 30;
      toothpickPath(L, th, tip);
      ctx.fill();
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = Math.max(0, fade);
    ctx.fillStyle = "#ffffff";
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.arc(0, 0, 2.6 * Math.max(.7, c.size), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawSpiderText() {
  if (bossKey !== "spider") {
    return;
  }
  drawPrecogCrosses();
  drawThumbMarks();
  drawSeat();
  ctx.save();
  ctx.textAlign = "center";
  const P = spider.prescript;
  if (P) {
    const c = FATHERS.index.color, n = Math.min(P.text.length, Math.floor(P.t * 28));
    ctx.globalAlpha = Math.min(1, (2 - P.t) * 2);
    ctx.font = '500 11px "IBM Plex Mono", monospace';
    ctx.fillStyle = COLOR.dim;
    const py = line ? 270 : 148;
    ctx.fillText(P.label || "지령", W / 2, py);
    ctx.font = '600 20px "IBM Plex Sans KR", sans-serif';
    ctx.fillStyle = c;
    ctx.shadowColor = c;
    ctx.shadowBlur = 16;
    ctx.fillText(P.text.slice(0, n), W / 2, py + 26);
  }
  const B = spider.banner;
  if (B) {
    ctx.globalAlpha = Math.min(1, B.t * 6, (1.6 - B.t) * 2);
    ctx.shadowColor = WEB_COLOR;
    ctx.shadowBlur = 18;
    if (B.big) {
      const c = B.color || FATHERS.thumb.color;
      ctx.font = '64px "Black Han Sans", sans-serif';
      ctx.fillStyle = c;
      ctx.shadowColor = c;
      ctx.shadowBlur = 30;
      ctx.globalAlpha = Math.min(1, B.t * 6, (1.6 - B.t) * 2);
      ctx.fillText(B.text, W / 2, H / 2 + 20);
    } else {
      ctx.font = '26px "Black Han Sans", sans-serif';
      ctx.fillStyle = B.color || WEB_COLOR;
      ctx.shadowColor = B.color || WEB_COLOR;
      ctx.fillText(B.text, W / 2, P ? 212 : line ? 256 : 150);
    }
  }
  ctx.restore();
}

resetGame();

paintControl();

paintDash();

paintMode();

resize();

requestAnimationFrame(loop);
</script>
