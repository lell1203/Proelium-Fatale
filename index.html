  ctx.save();
  if (F.pulse > 0) {
    ctx.globalAlpha = F.pulse * .8;
    ctx.strokeStyle = DUO.rEdge;
    ctx.shadowColor = DUO.rEdge;
    ctx.shadowBlur = 40;
    ctx.lineWidth = 6 + 14 * F.pulse;
    ctx.strokeRect(0, 0, W, H);
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = Math.max(0, a);
  ctx.textAlign = "center";
  if (F.t < FURI_START + .3) {
    const k = Math.min(1, F.t / .25);
    ctx.font = 'italic 92px "Black Han Sans", serif';
    ctx.fillStyle = DUO.rEdge;
    ctx.shadowColor = DUO.rEdge;
    ctx.shadowBlur = 30;
    ctx.globalAlpha = Math.max(0, a) * Math.min(1, (FURI_START + .3 - F.t) * 3);
    ctx.save();
    ctx.translate(W / 2, H / 2 + 30);
    ctx.scale(1.4 - .4 * k, 1.4 - .4 * k);
    ctx.fillText("Furioso", 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = Math.max(0, a);
  ctx.shadowBlur = 0;
  for (let i = 0; i < FURIOSO.length; i++) {
    const x = W / 2 + (i - 5.5) * 24, on = i < F.i, last = i === F.i - 1;
    ctx.fillStyle = on ? DUO.rEdge : COLOR.line;
    ctx.shadowColor = DUO.rEdge;
    ctx.shadowBlur = last ? 14 : 0;
    ctx.save();
    ctx.translate(x, H - 46);
    ctx.rotate(Math.PI / 4);
    const r = last ? 6 : 4;
    ctx.fillRect(-r, -r, r * 2, r * 2);
    ctx.restore();
  }
  if (F.cur && F.i > 0) {
    const step = FURIOSO[F.i - 1], k = Math.min(1, F.cur.t / .12);

    ctx.fillStyle = step.final ? DUO.rEdge : DUO.aMid;
    ctx.shadowColor = DUO.rEdge;
    ctx.shadowBlur = 10;

    ctx.translate(W / 2, H - 18);
    ctx.scale(1.25 - .25 * k, 1.25 - .25 * k);
    ctx.fillText(F.cur.n + ". " + step.name, 0, 0);
    ctx.restore();
  }
  ctx.restore();
}

function bladePath(h, i0, i1, k = 1, off = 0) {
  const P = h.pts, J = h.jag;
  ctx.beginPath();
  for (let i = i0; i <= i1; i++) {
    const p = P[i], w = p.hw * k * (J ? J[i][0] : 1) + off;
    i === i0 ? ctx.moveTo(p.x + p.nx * w, p.y + p.ny * w) : ctx.lineTo(p.x + p.nx * w, p.y + p.ny * w);
  }
  for (let i = i1; i >= i0; i--) {
    const p = P[i], w = -p.hw * k * (J ? J[i][1] : 1) + off;
    ctx.lineTo(p.x + p.nx * w, p.y + p.ny * w);
  }
  ctx.closePath();
}

function bandPath(h, i0, i1, a, b, side) {
  const P = h.pts;
  ctx.beginPath();
  for (let i = i0; i <= i1; i++) {
    const p = P[i], w = p.hw * a * side;
    i === i0 ? ctx.moveTo(p.x + p.nx * w, p.y + p.ny * w) : ctx.lineTo(p.x + p.nx * w, p.y + p.ny * w);
  }
  for (let i = i1; i >= i0; i--) {
    const p = P[i], w = p.hw * b * side;
    ctx.lineTo(p.x + p.nx * w, p.y + p.ny * w);
  }
  ctx.closePath();
}

function drawInnerWhite(h, i0, i1, k) {
  const mid = h.pts[SAMPLES / 2];
  const side = Math.abs(h.curve) > 4 ? -Math.sign(h.curve) : mid.ny < 0 ? 1 : -1;
  const m = .45 + .65 * k;
  const S = sty(h), col = S.innerColor || "#ffffff";
  ctx.save();
  ctx.shadowColor = col;
  for (const [a, b, alpha, blur] of S.innerBands || [ [ 0, .95, .28, 0 ], [ .3, .92, .45, 6 ], [ .58, .9, .95, 10 ] ]) {
    ctx.globalAlpha = k * alpha;
    ctx.shadowBlur = blur;
    ctx.fillStyle = col;
    bandPath(h, i0, i1, a * m, b * m, side);
    ctx.fill();
  }
  ctx.restore();
}

function drawRoughStreaks(h, i0, i1, k) {
  ctx.save();
  ctx.fillStyle = BLOOD.bright;
  ctx.shadowColor = BLOOD.bright;
  ctx.shadowBlur = 14;
  for (const side of [ 1, -1 ]) {
    for (const [gap, thick, alpha] of [ [ 1.35, .13, .85 ], [ 1.75, .07, .55 ] ]) {
      ctx.globalAlpha = k * alpha;
      const spread = gap + (1 - k) * .5;
      ctx.beginPath();
      for (let i = i0; i <= i1; i++) {
        const p = h.pts[i], c = side * (p.hw * spread + 4), w = c + p.hw * thick;
        i === i0 ? ctx.moveTo(p.x + p.nx * w, p.y + p.ny * w) : ctx.lineTo(p.x + p.nx * w, p.y + p.ny * w);
      }
      for (let i = i1; i >= i0; i--) {
        const p = h.pts[i], c = side * (p.hw * spread + 4), w = c - p.hw * thick;
        ctx.lineTo(p.x + p.nx * w, p.y + p.ny * w);
      }
      ctx.closePath();
      ctx.fill();
    }
  }
  ctx.restore();
}

function toothpickPath(len, th, tip) {
  ctx.beginPath();
  ctx.moveTo(-len, 0);
  ctx.lineTo(-len + tip, -th);
  ctx.lineTo(len - tip, -th);
  ctx.lineTo(len, 0);
  ctx.lineTo(len - tip, th);
  ctx.lineTo(-len + tip, th);
  ctx.closePath();
}

function drawSplats() {
  ctx.save();
  const groups = new Map;
  for (const p of particles) {
    if (p.type !== "splat") {
      continue;
    }
    const lv = Math.min(5, Math.floor(p.life / p.max * 6)), key = p.color + lv;
    let g = groups.get(key);
    if (!g) {
      g = {
        color: p.color,
        lv,
        list: []
      };
      groups.set(key, g);
    }
    g.list.push(p);
  }
  for (const g of groups.values()) {
    ctx.globalAlpha = .55 * (g.lv + .5) / 6;
    ctx.fillStyle = g.color;
    ctx.beginPath();
    for (const p of g.list) {
      ctx.moveTo(p.x + p.r, p.y);
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      for (const [dx, dy, r] of p.dots) {
        ctx.moveTo(p.x + dx + r, p.y + dy);
        ctx.arc(p.x + dx, p.y + dy, r, 0, Math.PI * 2);
      }
    }
    ctx.fill();
  }
  ctx.restore();
}

function lerpColor(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = s => Math.round((pa >> s & 255) * (1 - t) + (pb >> s & 255) * t);
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}

function wavePath(w, off, mul) {
  const ys = [];
  for (let y = -60; y <= H + 60; y += 16) {
    ys.push(y);
  }
  ctx.beginPath();
  ys.forEach((y, i) => {
    const p = waveProfile(y), x = w.x + w.dir * (w.bulge * p - off);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  for (let i = ys.length - 1; i >= 0; i--) {
    const y = ys[i], p = waveProfile(y);
    ctx.lineTo(w.x + w.dir * (w.bulge * p - off - w.th * (.35 + .65 * p) * mul), y);
  }
  ctx.closePath();
}

function drawWaves() {
  for (const w of waves) {
    ctx.save();
    if (w.t < w.warn) {
      const blink = Math.floor(w.t * 12) % 2 ? 1 : .4;
      ctx.fillStyle = BLOOD.bright;
      ctx.globalAlpha = blink * .55;
      ctx.fillRect(w.dir === 1 ? 0 : W - 24, 0, 24, H);
      ctx.strokeStyle = BLOOD.mark;
      ctx.shadowColor = BLOOD.bright;
      ctx.shadowBlur = 10;
      ctx.lineWidth = 3;
      const push = w.t * 3.2 % 1;
      for (const y of [ H * .22, H * .5, H * .78 ]) {
        for (let i = 0; i < 6; i++) {
          const x = (w.dir === 1 ? 0 : W) + w.dir * (70 + (i + push) * 150);
          ctx.globalAlpha = (.25 + .5 * (w.t / w.warn)) * (1 - i * .12);
          ctx.beginPath();
          ctx.moveTo(x - w.dir * 10, y - 14);
          ctx.lineTo(x + w.dir * 6, y);
          ctx.lineTo(x - w.dir * 10, y + 14);
          ctx.stroke();
        }
      }
      ctx.globalAlpha = blink;
      ctx.textAlign = "center";
      ctx.fillStyle = BLOOD.mark;
      ctx.shadowBlur = 18;
      ctx.font = '30px "Black Han Sans", "Malgun Gothic", sans-serif';
      ctx.fillText("대쉬로 돌파", W / 2, H / 2 - 30);
      ctx.font = '500 13px "IBM Plex Mono", monospace';
      ctx.fillText(`[ ${dashLabel()} ]`, W / 2, H / 2 - 6);
    } else {
      ctx.fillStyle = BLOOD.bright;
      ctx.shadowColor = BLOOD.bright;
      ctx.globalAlpha = .32;
      ctx.shadowBlur = 20;
      wavePath(w, w.th + 40, .16);
      ctx.fill();
      ctx.globalAlpha = .18;
      wavePath(w, w.th + 100, .1);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 60;
      wavePath(w, 0, 1);
      ctx.fill();
      ctx.shadowBlur = 12;
      ctx.fillStyle = BLOOD.mid;
      wavePath(w, w.th * .28, .38);
      ctx.fill();
    }
    ctx.restore();
  }
}

function blobPath(p, r) {
  ctx.beginPath();
  for (let i = 0; i <= 18; i++) {
    const a = i % 18 / 18 * Math.PI * 2, rr = r * p.shape[i % 18];
    i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
}

function drawPools() {
  for (const p of pools) {
    const grow = 1 - Math.pow(1 - Math.min(1, p.t / .2), 3);
    const c = coag(p);
    const r = p.r * grow * (1 - .1 * c);
    const s = p.spear;
    ctx.save();
    ctx.translate(p.x, p.y);
    blobPath(p, r);
    ctx.globalAlpha = s ? .4 : .8;
    ctx.fillStyle = lerpColor(BLOOD.bright, BLOOD.dark, c);
    ctx.shadowColor = BLOOD.bright;
    ctx.shadowBlur = 16 * (1 - c);
    ctx.fill();
    if (!s && c > 0) {
      ctx.globalAlpha = .9;
      ctx.shadowBlur = 0;
      ctx.strokeStyle = BLOOD.dark;
      ctx.lineWidth = 2 + 4 * c;
      blobPath(p, r);
      ctx.stroke();
      ctx.fillStyle = BLOOD.bright;
      ctx.shadowColor = BLOOD.bright;
      ctx.shadowBlur = 8;
      for (let k = 0; k < 6; k++) {
        const a = p.spin + k * Math.PI / 3 + c * .5;
        const outer = r * .92, inner = r * .92 * (1 - c * .85);
        const ca = Math.cos(a), sa = Math.sin(a), w = 3.5;
        ctx.beginPath();
        ctx.moveTo(ca * outer - sa * w, sa * outer + ca * w);
        ctx.lineTo(ca * inner, sa * inner);
        ctx.lineTo(ca * outer + sa * w, sa * outer - ca * w);
        ctx.closePath();
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(0, 0, 3 + 8 * c * (1 + .15 * Math.sin(p.t * 22)), 0, Math.PI * 2);
      ctx.fill();
    }
    if (s && s.phase !== "stuck") {
      const soon = s.phase === "fall" || s.phase === "wait" && s.t > -.25;
      const blink = Math.floor(performance.now() / (soon ? 45 : 110)) % 2 ? 1 : .35;
      ctx.globalAlpha = blink;
      ctx.shadowBlur = 10;
      ctx.shadowColor = BLOOD.bright;
      ctx.strokeStyle = BLOOD.mark;
      ctx.lineWidth = 2;
      ctx.setLineDash([ 8, 6 ]);
      ctx.beginPath();
      ctx.arc(0, 0, p.hitR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(-10, 0);
      ctx.lineTo(10, 0);
      ctx.moveTo(0, -10);
      ctx.lineTo(0, 10);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawBlob(x, y, r, wob) {
  ctx.beginPath();
  for (let i = 0; i <= 14; i++) {
    const a = i % 14 / 14 * Math.PI * 2;
    const rr = r * (1 + .14 * Math.sin(a * 3 + wob) + .08 * Math.sin(a * 5 - wob * 1.3));
    i ? ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath();
}

function drawPoolSpears() {
  const now = performance.now() / 1e3;
  for (const p of pools) {
    const s = p.spear;
    if (!s) {
      continue;
    }
    const blobR = clamp(p.r * .35, 9, 18);
    ctx.save();
    ctx.fillStyle = BLOOD.bright;
    ctx.shadowColor = BLOOD.bright;
    const axis = Math.PI / 2 - s.ang;
    if (s.phase === "rise") {
      const k = Math.min(1, s.t / RISE_T);
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = BLOOD.bright;
      ctx.lineWidth = blobR * .5 * (1 - k) + 1;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(s.x, s.y);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 20;
      drawBlob(s.x, s.y, blobR * (.7 + .3 * k), now * 9 + p.spin);
      ctx.fill();
    } else if (s.phase === "morph") {
      const m = Math.min(1, s.t / MORPH_T), e = m * m * (3 - 2 * m);
      ctx.translate(s.x, s.y);
      ctx.rotate(axis);
      ctx.globalAlpha = 1 - e;
      ctx.shadowBlur = 20;
      ctx.save();
      ctx.scale(1 + 2.5 * e, 1 - .6 * e);
      drawBlob(0, 0, blobR, now * 14 + p.spin);
      ctx.fill();
      ctx.restore();
      ctx.globalAlpha = e;
      ctx.shadowBlur = 26;
      toothpickPath(POOL_SPEAR_HALF * e, 3.5, 30 * e + 1);
      ctx.fill();
      if (Math.random() < .4) {
        addBlood(s.x, s.y + rand(-30, 30), rand(0, Math.PI * 2), rand(60, 200), .6);
      }
    } else {
      const alpha = s.phase === "stuck" ? 1 - Math.max(0, s.t - STUCK_T * .6) / (STUCK_T * .4) : 1;
      const tremble = s.phase === "wait" ? rand(-1.2, 1.2) : 0;
      ctx.globalAlpha = Math.max(0, alpha);
      ctx.translate(s.x + tremble, s.y);
      ctx.rotate(axis);
      ctx.shadowBlur = 26;
      toothpickPath(POOL_SPEAR_HALF, 3.5, 30);
      ctx.fill();
      ctx.shadowBlur = 8;
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawSpear(s) {
  const d = s.dir, hx = s.x, y = s.y;
  ctx.save();
  if (!s.flying) {
    const locked = s.t >= s.track;
    ctx.globalAlpha = locked ? Math.floor(s.t * 16) % 2 ? .85 : .35 : .22;
    ctx.strokeStyle = BLOOD.bright;
    ctx.lineWidth = locked ? 2 : 1.2;
    ctx.setLineDash([ 16, 10 ]);
    ctx.beginPath();
    ctx.moveTo(hx, y);
    ctx.lineTo(d === 1 ? W : 0, y);
    ctx.stroke();
    ctx.setLineDash([]);
    if (locked) {
      ctx.globalAlpha *= .5;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(hx, y - s.half);
      ctx.lineTo(d === 1 ? W : 0, y - s.half);
      ctx.moveTo(hx, y + s.half);
      ctx.lineTo(d === 1 ? W : 0, y + s.half);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  ctx.translate(hx - d * s.len / 2, y);
  ctx.fillStyle = BLOOD.bright;
  ctx.shadowColor = BLOOD.bright;
  ctx.shadowBlur = 28;
  toothpickPath(s.len / 2, 4, 70);
  ctx.fill();
  ctx.shadowBlur = 10;
  ctx.fill();
  ctx.restore();
}

function drawSpearCross(s) {
  if (s.flying || s.t < s.track) {
    return;
  }
  const q = clamp((s.t - s.track) / s.lock, 0, 1);
  const spin = 1 - Math.pow(1 - q, 3);
  const rot = spin * (Math.PI * 2 + Math.PI / 4);
  const L = 55 + 95 * q, th = 3.2 + 1.8 * q, tip = L * .2;
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(rot);
  ctx.fillStyle = BLOOD.bright;
  ctx.shadowColor = BLOOD.bright;
  ctx.globalAlpha = .4 + .6 * q;
  for (const a of [ 0, Math.PI / 2 ]) {
    ctx.save();
    ctx.rotate(a);
    ctx.shadowBlur = 34;
    toothpickPath(L, th, tip);
    ctx.fill();
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawWarning(h) {
  if (maskSkip(h)) {
    return;
  }
  if (h.t < 0 || h.t >= h.warn) {
    return;
  }
  const prog = h.t / h.warn;
  const blink = Math.floor(h.t * (prog > .7 ? 22 : 10)) % 2 === 0 ? 1 : .4;
  const S = sty(h);
  ctx.save();
  ctx.globalAlpha = .06 + prog * .16;
  ctx.fillStyle = S.warn;
  bladePath(h, 0, SAMPLES, prog);
  ctx.fill();
  ctx.globalAlpha = blink * Math.min(1, h.t / .12);
  ctx.strokeStyle = S.warn;
  ctx.lineWidth = 1.5;
  ctx.shadowColor = S.warn;
  ctx.shadowBlur = 10;
  ctx.setLineDash([ 12, 8 ]);
  bladePath(h, 0, SAMPLES, 1);
  ctx.stroke();
  ctx.restore();
  if (h.big) {
    drawDodgeMarker(h, prog, blink);
  }
}

function drawDodgeMarker(h, prog, blink) {
  const dx = Math.cos(h.angle), dy = Math.sin(h.angle);
  const nx = -dy, ny = dx;
  const t = clamp((player.x - h.cx) * dx + (player.y - h.cy) * dy, -h.len * .8, h.len * .8);
  const mx = clamp(h.cx + dx * t, 40, W - 40), my = clamp(h.cy + dy * t, 40, H - 40);
  const u = (t / h.len + 1) / 2;
  const halfW = h.width / 2 * Math.pow(Math.sin(Math.PI * u), .7);
  const mark = sty(h).mark;
  ctx.save();
  ctx.strokeStyle = mark;
  ctx.fillStyle = mark;
  ctx.shadowColor = mark;
  ctx.shadowBlur = 14;
  ctx.lineWidth = 3;
  ctx.lineJoin = "round";
  ctx.globalAlpha = blink;
  ctx.beginPath();
  ctx.moveTo(mx, my - 26);
  ctx.lineTo(mx + 24, my + 16);
  ctx.lineTo(mx - 24, my + 16);
  ctx.closePath();
  ctx.stroke();
  ctx.font = '700 26px "IBM Plex Sans KR", sans-serif';
  ctx.textAlign = "center";
  ctx.fillText("!", mx, my + 11);
  const push = performance.now() / 1e3 * 2 % 1;
  for (const side of [ -1, 1 ]) {
    for (let i = 0; i < 3; i++) {
      const d = halfW + 18 + i * 18 + push * 18;
      const cx = mx + nx * side * d, cy = my + ny * side * d;
      ctx.globalAlpha = (.35 + .65 * prog) * (1 - i * .25);
      ctx.beginPath();
      ctx.moveTo(cx - nx * side * 6 + dx * 12, cy - ny * side * 6 + dy * 12);
      ctx.lineTo(cx + nx * side * 6, cy + ny * side * 6);
      ctx.lineTo(cx - nx * side * 6 - dx * 12, cy - ny * side * 6 - dy * 12);
      ctx.stroke();
    }
  }
  ctx.restore();
}

const TONES = {
  normal: {
    color: COLOR.fire,
    glow: COLOR.fire,
    blur: 16,
    size: 24,
    passes: 1,
    name: COLOR.dim
  },
  roland: {
    color: DUO.rEdge,
    glow: DUO.rEdge,
    blur: 16,
    size: 22,
    passes: 1,
    name: COLOR.dim
  },
  deep: {
    color: "#ff1a26",
    glow: "#ff1a26",
    blur: 28,
    size: 25,
    passes: 2,
    name: BLOOD.mid
  },
  blood: {
    color: "#e3001b",
    glow: "#ff0018",
    blur: 46,
    size: 28,
    passes: 3,
    name: BLOOD.bright
  }
};

function drawLine() {
  if (!line) {
    return;
  }
  const T = TONES[line.tone || (bloodMode ? "blood" : "normal")];
  const n = Math.min(line.text.length, Math.floor(line.t * TYPE_SPEED));
  const throb = T.passes > 1 ? .85 + .15 * Math.sin(performance.now() / 160) : 1;
  ctx.save();
  ctx.textAlign = "center";
  ctx.font = '500 12px "IBM Plex Mono", monospace';
  ctx.fillStyle = T.name;
  const oy = bossKey === "spider" ? 80 : 0;
  ctx.fillText(line.name ?? BOSSES[bossKey].name, W / 2, 100 + oy);
  ctx.font = `600 ${T.size}px "IBM Plex Sans KR", "Malgun Gothic", sans-serif`;
  ctx.fillStyle = T.color;
  ctx.shadowColor = T.glow;
  ctx.shadowBlur = T.blur * throb;
  for (let i = 0; i < T.passes; i++) {
    ctx.fillText(line.text.slice(0, n), W / 2, 134 + oy);
  }
  ctx.restore();
}

function drawBlade(h) {
  if (maskSkip(h)) {
    return;
  }
  const after = h.t - h.warn;
  const end = h.sweep + h.active + h.fade;
  if (after < 0 || after >= end) {
    return;
  }
  const [i0, i1] = drawnRange(h);
  if (i1 - i0 < 1) {
    return;
  }
  const k = after < h.sweep + h.active ? 1 : 1 - (after - h.sweep - h.active) / h.fade;
  const S = sty(h);
  ctx.save();
  if (k < 1) {
    ctx.globalAlpha = k * .5;
    ctx.strokeStyle = S.glow;
    ctx.lineWidth = 2;
    ctx.shadowColor = S.glow;
    ctx.shadowBlur = 12;
    bladePath(h, i0, i1, .8, (1 - k) * 18);
    ctx.stroke();
    bladePath(h, i0, i1, .8, -(1 - k) * 18);
    ctx.stroke();
  }
  if (h.blood) {
    drawRoughStreaks(h, i0, i1, k);
  }
  ctx.globalAlpha = k;
  if (h.laevGrad) {
    drawLaevGrad(h, i0, i1, k);
  } else {
    S.layers.forEach(([color, blur, width], i) => {
      ctx.shadowColor = i === 0 ? S.glow : color;
      ctx.shadowBlur = blur;
      ctx.fillStyle = color;
      bladePath(h, i0, i1, i === 0 ? .45 + .65 * k : width * k);
      ctx.fill();
    });
  }
  if (S.innerWhite || S.innerColor) {
    drawInnerWhite(h, i0, i1, k);
  }
  if (S.glitch) {
    const j = 4 + 5 * Math.abs(Math.sin(h.t * 97 + h.cx));
    ctx.shadowBlur = 0;
    ctx.globalAlpha = .4 * k;
    ctx.fillStyle = S.glitch[0];
    bladePath(h, i0, i1, .55 * k, j);
    ctx.fill();
    ctx.fillStyle = S.glitch[1];
    bladePath(h, i0, i1, .55 * k, -j);
    ctx.fill();
    ctx.globalAlpha = k;
  }
  if (S.render === "black") {
    ctx.shadowColor = S.edge;
    ctx.shadowBlur = 14;
    ctx.fillStyle = S.fill;
    bladePath(h, i0, i1, .45 + .65 * k);
    ctx.fill();
    ctx.shadowBlur = 6;
    ctx.strokeStyle = S.edge;
    ctx.lineWidth = 2;
    ctx.lineJoin = "round";
    ctx.stroke();
  } else if (S.render === "grad") {
    const mid = h.pts[Math.round((i0 + i1) / 2)];
    const hw = Math.max(2, mid.hw * (.45 + .65 * k));
    const g = ctx.createLinearGradient(mid.x + mid.nx * hw, mid.y + mid.ny * hw, mid.x - mid.nx * hw, mid.y - mid.ny * hw);
    g.addColorStop(0, S.white);
    g.addColorStop(.5, S.grey);
    g.addColorStop(1, S.white);
    ctx.shadowColor = S.white;
    ctx.shadowBlur = 18;
    ctx.fillStyle = g;
    bladePath(h, i0, i1, .45 + .65 * k);
    ctx.fill();
  }
  if (after < h.sweep) {
    const tip = h.pts[h.dir === 1 ? i1 : i0];
    ctx.globalAlpha = 1;
    ctx.fillStyle = S.tip;
    ctx.shadowColor = S.glow;
    ctx.shadowBlur = 40;
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, h.width * .35, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = S.tipLine;
    ctx.lineWidth = 2;
    const L = h.width * 1.4;
    ctx.beginPath();
    ctx.moveTo(tip.x - L, tip.y);
    ctx.lineTo(tip.x + L, tip.y);
    ctx.moveTo(tip.x, tip.y - L);
    ctx.lineTo(tip.x, tip.y + L);
    ctx.stroke();
  }
  ctx.restore();
}

function drawScar(h) {
  if (maskSkip(h)) {
    return;
  }
  const after = h.t - h.warn - h.sweep - h.active;
  if (after < 0) {
    return;
  }
  const k = 1 - Math.max(0, after - h.fade) / h.scar;
  if (k <= 0) {
    return;
  }
  ctx.save();
  ctx.globalAlpha = k * (.55 + .25 * Math.sin(h.t * 40));
  const S = sty(h);
  ctx.strokeStyle = S.scar;
  ctx.shadowColor = S.glow;
  ctx.shadowBlur = 14;
  ctx.lineWidth = 2;
  ctx.beginPath();
  h.pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  ctx.stroke();
  ctx.restore();
}

function drawParticles() {
  ctx.save();
  for (const p of particles) {
    const k = p.life / p.max;
    ctx.globalAlpha = Math.min(1, k * 1.5);
    if (p.type === "flame") {
      const s = p.size * .32 * (.45 + .55 * k);
      const flick = .55 + .45 * Math.sin(p.rot + (p.max - p.life) * 32);
      const a = Math.min(1, k * 1.5) * flick;
      ctx.globalAlpha = a * .22;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, s * 2.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = a * .7;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = s * .9;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * .045, p.y - p.vy * .045);
      ctx.stroke();
      ctx.globalAlpha = a;
      ctx.fillStyle = s > 2.4 ? p.core || COLOR.ember : p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, s, 0, Math.PI * 2);
      ctx.fill();
    } else if (p.type === "spark") {
      ctx.strokeStyle = p.color;
      ctx.lineWidth = p.small ? 1.5 : 2.2;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * .04, p.y - p.vy * .04);
      ctx.stroke();
    } else if (p.type === "blood") {
      const s = p.size * (.55 + .45 * k);
      ctx.globalAlpha = Math.min(1, k * 2.2);
      ctx.strokeStyle = p.color;
      ctx.lineCap = "round";
      ctx.lineWidth = s * 1.5;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * .03, p.y - p.vy * .03);
      ctx.stroke();
    } else if (p.type === "cone") {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.ang);
      ctx.globalAlpha = k;
      ctx.fillStyle = DUO.aWhite;
      ctx.shadowColor = DUO.aWhite;
      ctx.shadowBlur = 30;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, p.len, -p.spread / 2, p.spread / 2);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      ctx.shadowBlur = 0;
    } else if (p.type === "casing") {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = DUO.aMid;
      ctx.fillRect(-4, -2, 8, 4);
      ctx.restore();
    } else if (p.type === "glint") {
      const s = 26 * Math.sin(Math.PI * (1 - k));
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.strokeStyle = DUO.aWhite;
      ctx.shadowColor = DUO.aWhite;
      ctx.shadowBlur = 16;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.moveTo(-s, 0);
      ctx.lineTo(s, 0);
      ctx.moveTo(0, -s * .6);
      ctx.lineTo(0, s * .6);
      ctx.stroke();
      ctx.restore();
      ctx.shadowBlur = 0;
    } else if (p.type === "shard") {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.shadowColor = DUO.aWhite;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(0, -p.s);
      ctx.lineTo(p.s * .45, p.s * .5);
      ctx.lineTo(-p.s * .45, p.s * .5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      ctx.shadowBlur = 0;
    } else if (p.type === "slab") {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.min(1, k * 2.5);
      ctx.beginPath();
      p.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
      ctx.closePath();
      ctx.fillStyle = RUBBLE.slab;
      ctx.fill();
      ctx.strokeStyle = STYLE.middle.glow;
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.restore();
    } else if (p.type === "debris") {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s);
      ctx.restore();
    } else if (p.type === "crack") {
      ctx.strokeStyle = p.color || DUO.aWhite;
      ctx.shadowColor = p.color || DUO.aWhite;
      ctx.shadowBlur = 8;
      ctx.lineWidth = p.w;
      ctx.lineJoin = "round";
      ctx.beginPath();
      p.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
      ctx.stroke();
      ctx.shadowBlur = 0;
    } else if (p.type === "cutline") {
      ctx.save();
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.R, 0, Math.PI * 2);
      ctx.clip();
      const dx = Math.cos(p.a), dy = Math.sin(p.a), ox = -dy * p.off, oy = dx * p.off;
      ctx.strokeStyle = DUO.aWhite;
      ctx.shadowColor = DUO.aWhite;
      ctx.shadowBlur = 10;
      ctx.lineWidth = p.w;
      ctx.globalAlpha = k;
      ctx.beginPath();
      ctx.moveTo(p.x + ox - dx * p.R * 1.2, p.y + oy - dy * p.R * 1.2);
      ctx.lineTo(p.x + ox + dx * p.R * 1.2, p.y + oy + dy * p.R * 1.2);
      ctx.stroke();
      ctx.restore();
    } else if (p.type === "streak") {
      ctx.strokeStyle = DUO.aMid;
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = k * .8;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + Math.cos(p.ang) * p.len, p.y + Math.sin(p.ang) * p.len);
      ctx.stroke();
    } else if (p.type === "mist") {
      ctx.globalAlpha = .16 * k;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    } else if (p.type === "ring") {
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 4 * k + 1;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
    } else if (p.type === "cut") {
      const age = p.max - p.life;
      const L = (p.len || 170) * Math.min(1, age / .05);
      const w = 11 * k;
      const dx = Math.cos(p.ang), dy = Math.sin(p.ang);
      ctx.globalAlpha = Math.min(1, k * 2);
      const cc = bossKey === "roland" ? DUO.rEdge : bossKey === "spider" ? WEB_COLOR : bloodMode ? BLOOD.bright : COLOR.fire;
      ctx.shadowColor = cc;
      ctx.shadowBlur = 22;
      ctx.fillStyle = cc;
      ctx.beginPath();
      ctx.moveTo(p.x - dx * L, p.y - dy * L);
      ctx.lineTo(p.x - dy * w, p.y + dx * w);
      ctx.lineTo(p.x + dx * L, p.y + dy * L);
      ctx.lineTo(p.x + dy * w, p.y - dx * w);
      ctx.closePath();
      ctx.fill();
      const seg = (lw, color, blur) => {
        ctx.shadowColor = color;
        ctx.shadowBlur = blur;
        ctx.strokeStyle = color;
        ctx.lineWidth = lw;
        ctx.beginPath();
        ctx.moveTo(p.x - dx * L * .75, p.y - dy * L * .75);
        ctx.lineTo(p.x + dx * L * .75, p.y + dy * L * .75);
        ctx.stroke();
      };
      seg(5 * k + 1, COLOR.player, 14);
      seg(1.6, COLOR.bg, 0);
      ctx.shadowBlur = 0;
    }
  }
  ctx.restore();
}

function drawPlayer() {
  if (player.stun > 0) {
    const t = performance.now() / 1e3;
    ctx.save();
    ctx.globalAlpha = Math.min(1, player.stun * 4);
    ctx.strokeStyle = DUO.aWhite;
    ctx.shadowColor = DUO.aWhite;
    ctx.shadowBlur = 8;
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
      const a = t * 7 + i * Math.PI * 2 / 3, x = player.x + Math.cos(a) * 14, y = player.y - 18 + Math.sin(a) * 5;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.PI / 4 + t * 4);
      ctx.strokeRect(-2.5, -2.5, 5, 5);
      ctx.restore();
    }
    ctx.restore();
  }
  ctx.save();
  for (const t of player.trail) {
    ctx.globalAlpha = t.life / .25 * .45;
    ctx.strokeStyle = COLOR.player;
    ctx.lineWidth = 2;
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.rotate(Math.PI / 4);
    const s = player.r * 1.6;
    ctx.strokeRect(-s / 2, -s / 2, s, s);
    ctx.restore();
  }
  ctx.restore();
  if (player.dashInv > 0) {
    ctx.save();
    ctx.globalAlpha = player.dashInv / DASH_INV;
    ctx.strokeStyle = COLOR.player;
    ctx.shadowColor = COLOR.player;
    ctx.shadowBlur = 16;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r * 2.2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
  if (player.inv > 0 && Math.floor(player.inv * 14) % 2 === 0) {
    return;
  }
  ctx.save();
  ctx.translate(player.x + (player.stun > 0 ? rand(-1.5, 1.5) : 0), player.y);
  ctx.rotate(Math.PI / 4);
  ctx.strokeStyle = COLOR.player;
  ctx.shadowColor = COLOR.player;
  ctx.shadowBlur = 14;
  ctx.lineWidth = 2.5;
  const s = player.r * 1.6;
  ctx.strokeRect(-s / 2, -s / 2, s, s);
  ctx.fillStyle = COLOR.player;
  ctx.fillRect(-2, -2, 4, 4);
  ctx.restore();
}

function drawHud() {
  ctx.save();
  for (let i = 0; i < MAX_HP; i++) {
    const x = 24 + i * 22, y = 24, on = i < player.hp;
    ctx.strokeStyle = on ? COLOR.player : COLOR.line;
    ctx.fillStyle = COLOR.player;
    ctx.shadowColor = COLOR.player;
    ctx.shadowBlur = on ? 10 : 0;
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, 14, 14);
    if (on) {
      ctx.fillRect(x + 4, y + 4, 6, 6);
    }
  }
  const ready = 1 - player.dashCd / DASH_CD;
  ctx.shadowBlur = 0;
  ctx.font = '500 10px "IBM Plex Mono", monospace';
  ctx.textAlign = "left";
  ctx.fillStyle = ready >= 1 ? COLOR.player : COLOR.dim;
  ctx.fillText("DASH", 24, 56);
  ctx.fillStyle = COLOR.line;
  ctx.fillRect(58, 49, 74, 6);
  ctx.fillStyle = COLOR.player;
  ctx.shadowColor = COLOR.player;
  ctx.shadowBlur = ready >= 1 ? 10 : 0;
  ctx.fillRect(58, 49, 74 * ready, 6);
  ctx.shadowBlur = 0;
  ctx.font = '500 16px "IBM Plex Mono", monospace';
  ctx.textAlign = "right";
  ctx.fillStyle = COLOR.ink;
  if (state !== "menu" && endless) {
    ctx.fillText(endless.total.toFixed(1) + "s", W - 24, 36);
    ctx.fillStyle = COLOR.dim;
    ctx.font = '500 12px "IBM Plex Mono", monospace';
    ctx.fillText(`ROUND ${endless.n} · 다음 ${Math.max(0, ENDLESS_SEG - endless.segT).toFixed(0)}s`, W - 24, 54);
    const bt = endlessBestCache ?? (endlessBestCache = endlessBest().t);
    if (bt) {
      ctx.fillText(`최고 ${bt.toFixed(1)}s`, W - 24, 70);
    }
  } else if (state !== "menu") {
    ctx.fillText(Math.max(0, CLEAR_TIME - elapsed).toFixed(1) + "s", W - 24, 36);
    ctx.fillStyle = COLOR.dim;
    ctx.font = '500 12px "IBM Plex Mono", monospace';
    ctx.fillText("PHASE " + phase(), W - 24, 54);
  }
  drawEndlessBanner();
  if (script && state === "play") {
    ctx.textAlign = "center";
    ctx.fillStyle = COLOR.dim;
    ctx.fillText("Enter 대사 건너뛰기", W / 2, H - 20);
  }
  if (state === "pause") {
    ctx.textAlign = "center";
    ctx.fillStyle = COLOR.ink;
    ctx.font = '28px "Black Han Sans", sans-serif';
    ctx.fillText("일시정지", W / 2, H / 2);
  }
  ctx.restore();
}

function phaseStart(p) {
  return Math.max(0, p - 1) * phaseLen();
}

function phaseEnd(p) {
  return p >= 6 ? CLEAR_TIME : phaseStart(p + 1);
}

let lastStart = {
  p: 1
};

function startGame(p = 1) {
  resetGame();
  CLEAR_TIME = BOSSES[bossKey].clearTime;
  p = Math.min(p, BOSSES[bossKey].maxPhase);
  lastStart = {
    p
  };
  endless = null;
  if (control === "mouse") {
    player.x = mouse.x;
    player.y = mouse.y;
  }
  elapsed = phaseStart(p);
  curPhase = p;
  if (p >= 6 && bossKey === "roland") {
    finishMask();
  }
  if (p >= 5 && bossKey === "roland") {
    finishTakeover();
  }
  if (bossKey === "spider") {
    for (const k in FATHERS) {
      if (FATHERS[k].join < p) {
        FATHERS[k].arrived = true;
      }
    }
  }
  if (bossKey === "spider") {
    spider.seals = clamp(p - 4, 0, 2);
  }
  if (bossKey === "spider" && p >= 6) {
    setRienUnmasked(true);
  }
  if (p >= 5 && bossKey === "vergilius") {
    bloodMode = true;
  }
  startScript(p);
  if (!script && p > 1) {
    nextPatternAt = elapsed + 1;
  }
  if (p >= 6) {
    ultNext = elapsed + 1.5;
  }
  state = "play";

function endlessAggro() {
  if (!endless) {
    return 1;
  }
  let m = Math.max(.5, 1 - .06 * (endless.n - 1));
  const c = endless.cur;
  if (c && c.key === "roland" && c.p >= 6) {
    m *= 1 + 1 * Math.max(0, 1 - (endless.n - 1) / 8);
  }
  if (c && c.father) {
    m *= ENDLESS_FATHER_GAP;
  }
  return m;
}

const ENDLESS_FURIOSO_FROM = 4;

const ENDLESS_FATHER_GAP = .8, ENDLESS_FATHER_COMBO = .4;

function startEndless() {
  endlessBestCache = null;
  const menuBoss = endless ? endless.menuBoss : bossKey;
  startGame(1);
  endless = {
    n: 0,
    segT: 0,
    total: 0,
    last: null,
    cur: null,
    banner: null,

  };
  lastStart = {
    p: 1,
    endless: true
  };

}

function endlessNext(first) {
  const E = endless;
  let pick;
  do {
    const g = ENDLESS_GROUPS[Math.floor(Math.random() * ENDLESS_GROUPS.length)];
    pick = g[Math.floor(Math.random() * g.length)];
  } while (pick === E.last);
  E.last = pick;
  E.cur = pick;
  E.n++;
  E.segT = 0;
  const keep = first ? null : {
    x: player.x,
    y: player.y,
    hp: Math.min(MAX_HP, player.hp + 1),
    dashCd: player.dashCd,
    stun: 0
  };
  bossKey = pick.key;
  resetGame();
  if (keep) {
    Object.assign(player, keep);
  } else if (control === "mouse") {
    player.x = mouse.x;
    player.y = mouse.y;
  }
  CLEAR_TIME = Infinity;
  const p = pick.p;
  elapsed = phaseStart(p) + .01;
  curPhase = p;
  if (bossKey === "vergilius" && p >= 5) {
    bloodMode = true;
  }
  if (bossKey === "roland" && p >= 6) {
    finishMask();
    finishTakeover();
  }
  if (bossKey === "spider") {
    FATHERS[pick.father].arrived = true;
    FATHERS[pick.father].arriveT = 1;
    FATHERS[pick.father].pulse = 1;
    if (pick.father === "middle") {
      spider.seals = 3;
    }
    if (pick.unmasked) {
      setRienUnmasked(true);
      spider.unlock = 3;
      spider.rienDone = 9;
    }
    spider.eUlts = (pick.ults || []).map(([at, k]) => ({
      at,
      k
    }));
  }
  nextPatternAt = elapsed + 1.4;
  if (p >= 6) {
    ultNext = elapsed + 2.5;
  }
  player.inv = Math.max(player.inv, 1);
  E.banner = {
    name: pick.name,
    sub: pick.sub || "",
    heal: !first,
    t: 0
  };
  shake = Math.max(shake, 10);
  flash = Math.max(flash, .6);
  flashColor = COLOR.ink;
}

function updateEndless(dt) {
  const E = endless;
  if (!E) {
    return;
  }
  E.segT += dt;
  E.total += dt;
  if (E.banner) {
    E.banner.t += dt;
    if (E.banner.t > 2.4) {
      E.banner = null;
    }
  }
  if (E.segT >= ENDLESS_SEG - .05) {
    endlessNext(false);
  }
}

function drawEndlessBanner() {

  if (binding) {

    if (e.code === "Escape") {
      binding = false;
      paintDash();
      return;
    }
    if (RESERVED.includes(e.code)) {
      bindBtn.textContent = "이동·메뉴 키는 쓸 수 없습니다";
      return;
    }
    dashCfg.key = e.code;

  if (dashCfg.input === "key" && e.code === dashCfg.key) {

    if (!e.repeat) {
      tryDash();
    }

  keys.add(e.code);
  if (e.code.startsWith("Arrow")) {
    e.preventDefault();
  }
  if (e.code === "KeyP" && (state === "play" || state === "pause")) {
    state = state === "play" ? "pause" : "play";

  if (e.code === "Escape" && state !== "menu") {

  if (e.code === "Enter" && state === "play" && script) {

    skipScript();

});

function trackPointer(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) / r.width * W;
  mouse.y = (e.clientY - r.top) / r.height * H;
  if (state === "play" && control === "mouse" && !player.stun && !(player.slowT > 0)) {
    player.x = clamp(mouse.x, player.r, W - player.r);
    player.y = clamp(mouse.y, player.r, H - player.r);
  }
}

addEventListener("pointermove", trackPointer);

cv.addEventListener("pointerdown", trackPointer);

function resize() {
  const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, QUALITY[quality].dpr);
  cv.width = Math.round(r.width * dpr);
  cv.height = Math.round(r.height * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  const ms = quality === 2 ? .75 : .5;
  maskLayer.width = Math.round(cv.width * ms);
  maskLayer.height = Math.round(cv.height * ms);
  maskCtx.setTransform(maskLayer.width / W, 0, 0, maskLayer.height / H, 0, 0);
}

addEventListener("resize", resize);

let last = performance.now();

let frameAvg = 16.7, slowFor = 0, qualityCool = 0;

function autoQuality(raw) {
  if (raw > 250) {
    return;
  }
  frameAvg += (raw - frameAvg) * .08;
  qualityCool = Math.max(0, qualityCool - raw / 1e3);
  if (qualityMode !== "auto" || state !== "play" || quality === 0 || qualityCool > 0) {
    slowFor = 0;
    return;
  }
  slowFor = frameAvg > 22 ? slowFor + raw / 1e3 : 0;
  if (slowFor > 2) {
    slowFor = 0;
    qualityCool = 3;
    frameAvg = 16.7;
    setQuality(quality - 1, true);
  }
}

function loop(now) {
  const raw = now - last;
  autoQuality(raw);
  if (qualityToast) {
    qualityToast.t -= raw / 1e3;
  }
  const dt = Math.min(.05, raw / 1e3);
  last = now;
  if (state === "play") {
    if (hitStop > 0) {
      hitStop -= dt;
    } else {
      update(dt);
    }
  } else if (state === "menu") {
    elapsed += dt;
  }
  draw();
  requestAnimationFrame(loop);
}

function rand(a, b) {
  return a + Math.random() * (b - a);
}

function clamp(v, a, b) {
  return Math.max(a, Math.min(b, v));
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function onScreen(x, y) {
  return x > -20 && x < W + 20 && y > -20 && y < H + 20;
}

const ECHO_MAX = 18;

function yoruCut(o) {
  const h = makeSlash({
    cx: o.cx,
    cy: o.cy,
    angle: o.angle,
    width: o.width,
    len: o.len,
    warn: o.warn,
    delay: o.delay || 0,
    curve: 0,
    style: "pinky"
  });
  h.sweep = o.sweep ?? .05;
  if (o.dirFwd) {
    h.dir = 1;
  }
  hazards.push(h);
  if (o.record !== false) {
    spider.echoes.push({
      cx: h.cx,
      cy: h.cy,
      angle: h.angle,
      len: h.len,
      width: h.width,
      curve: h.curve,
      dirFwd: o.dirFwd
    });
    if (spider.echoes.length > ECHO_MAX) {
      spider.echoes.shift();
    }
    spider.echoFlash = 1;
  }
  return h;
}

function echoCut(e, warn = .45, jit = 8, delay = 0) {
  const h = makeSlash({
    cx: e.cx + rand(-jit, jit),
    cy: e.cy + rand(-jit, jit),
    angle: e.angle,
    width: e.width * .9,
    len: e.len,
    warn,
    delay,
    curve: 0,
    style: "pinkyE"
  });
  h.sweep = .04;
  if (e.dirFwd) {
    h.dir = 1;
  }
  h.echo = true;
  hazards.push(h);
  spider.ghosts.push({
    x: e.cx,
    y: e.cy,
    t: -delay,
    dur: warn + .5
  });
  return h;
}

function yoruAfter(delay, n) {
  later(delay, () => {
    if (spider.echoes.length < 3 || spider.rend) {
      return;
    }
    const pool = spider.echoes.slice(0, -2);
    for (let i = 0; i < n && pool.length; i++) {
      echoCut(pool.splice(Math.floor(Math.random() * pool.length), 1)[0], .5, 8, i * .2);
    }
  });
}

function startRend() {
  hazards = hazards.filter(h => h.t > h.warn);
  laters = [];
  zones = zones.filter(z => z.t > z.warn);
  spider.precogs = [];
  spider.grabs = [];
  spider.seat = null;
  const list = spider.echoes.slice().sort(() => Math.random() - .5);
  spider.rend = {
    t: 0,
    list,
    next: 1.2,
    clone: [ 2, 3.4, 4.8 ],
    sweep: null,
    done: false
  };
  spider.clones = [];
  fAct("pinky", "공간참-연 [空間斬-緣]");
  FATHERS.pinky.skillT = 9.8;
  spider.banner = {
    text: "공간참",

    big: true,

  };
  const say = "...";
  line = {

  };

  flash = Math.max(flash, .9);
  flashColor = FATHERS.pinky.color;
}

function updateRend(dt) {
  for (const g of spider.ghosts) {
    g.t += dt;
  }
  spider.ghosts = spider.ghosts.filter(g => g.t < g.dur);
  for (const T of spider.tears) {
    T.t += dt;
  }
  spider.tears = spider.tears.filter(T => T.t < .8);
  for (const c of spider.clones) {
    c.t += dt;
  }
  spider.echoFlash = Math.max(0, spider.echoFlash - dt * 2);
  const R = spider.rend;
  if (!R) {
    return;
  }
  R.t += dt;
  FATHERS.pinky.pulse = Math.max(FATHERS.pinky.pulse, .5);
  const sp = clamp(R.t / 6, 0, 1);
  if (R.t < 5.8 && R.t >= R.next) {
    const e = R.list.length ? R.list.shift() : {
      cx: player.x + rand(-80, 80),
      cy: player.y + rand(-80, 80),
      angle: rand(0, Math.PI),
      len: rand(200, 280),
      width: 26,
      curve: rand(-60, 60)
    };
    echoCut(e, .5, 10);
    R.next += .34 - .14 * sp;
  }
  if (R.clone.length && R.t >= R.clone[0]) {
    R.clone.shift();
    const edge = Math.floor(Math.random() * 4), x = edge === 0 ? 30 : edge === 1 ? W - 30 : rand(80, W - 80), y = edge < 2 ? rand(120, H - 40) : edge === 2 ? H - 24 : 110;
    const c = {
      x,
      y,
      t: 0,
      dur: 1.4
    };
    spider.clones.push(c);
    const a = Math.atan2(player.y - y, player.x - x), L = 560;
    const h = makeSlash({
      cx: x + Math.cos(a) * L,
      cy: y + Math.sin(a) * L,
      angle: a,
      width: 24,
      len: L,
      warn: .65,
      curve: 0,
      style: "pinky"
    });
    h.dir = 1;
    h.sweep = .06;
    hazards.push(h);
  }
  spider.clones = spider.clones.filter(c => c.t < c.dur);
  if (!R.sweep && R.t >= 5.9) {
    const dir = Math.random() < .5 ? 1 : -1;
    R.sweep = {
      y: player.y,
      t: 0,
      track: 2,
      lock: .55,
      dir,
      fired: false,
      band: 135
    };
  }
  const SW = R.sweep;
  if (SW) {
    SW.t += dt;
    if (SW.t < SW.track) {
      SW.y += (clamp(player.y, 60, H - 30) - SW.y) * Math.min(1, dt * 3.2);
    } else if (!SW.fired && SW.t >= SW.track + SW.lock) {
      SW.fired = true;
      const y = SW.y, d = SW.dir;
      const h = makeSlash({
        cx: W / 2,
        cy: y,
        angle: 0,
        width: 36,
        len: 1300,
        warn: .01,
        curve: 0,
        style: "pinky"
      });
      h.dir = d;
      h.sweep = .14;
      h.active = .2;
      hazards.push(h);
      shake = Math.max(shake, 18);
      flash = Math.max(flash, .9);
      flashColor = "#ffffff";
      const N = 38;
      for (let i = 0; i < N; i++) {
        const u = (i + rand(0, 1)) / N, x = d === 1 ? u * W : W - u * W, oy = rand(-1, 1) * (SW.band - 60);
        const nh = makeSlash({
          cx: x,
          cy: y + oy,
          angle: rand(-.55, .55) + (Math.random() < .25 ? Math.PI / 2 : 0),
          width: rand(24, 32),
          len: rand(85, 130),
          warn: .3,
          delay: .12 + u * .35 + rand(0, .08),
          curve: 0,
          style: i % 3 ? "pinky" : "pinkyE"
        });
        nh.sweep = .04;
        nh.light = true;
        hazards.push(nh);
      }
      later(.14, () => {
        spider.tears.push({
          x: W / 2,
          y,
          a: 0,
          t: 0
        });
      });
      later(.9, () => {
        spider.tears.push({
          x: W / 2,
          y: y + 6,
          a: 0,
          t: 0
        });
        shake = Math.max(shake, 14);
      });
    }
  }
  if (!R.done && R.t >= 9.3) {
    R.done = true;
    for (const e of spider.echoes) {
      for (let i = 0; i < 3; i++) {
        addSpark(e.cx, e.cy, rand(0, Math.PI * 2), rand(80, 240), pick([ "#3d5cff", "#b9c6ff", "#ffffff" ]));
      }
    }
    spider.echoes = [];
  }
  if (R.t > 9.9) {
    spider.rend = null;
  }
}

function drawYoru() {
  const c0 = FATHERS.pinky.color;
  ctx.save();
  for (const g of spider.ghosts) {
    if (g.t < 0) {
      continue;
    }
    const k = 1 - g.t / g.dur, jx = Math.sin(g.t * 70 + g.x) * 3;
    ctx.globalAlpha = .28 * k;
    ctx.fillStyle = "#b9c6ff";
    ctx.beginPath();
    ctx.ellipse(g.x + jx, g.y - 6, 7, 16, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = c0;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(g.x + jx + 8, g.y + 8);
    ctx.lineTo(g.x + jx + 26, g.y - 18);
    ctx.stroke();
  }
  const o = fpos("pinky");
  for (const c of spider.clones) {
    const k = Math.min(1, c.t * 5) * Math.max(0, 1 - Math.max(0, c.t - c.dur + .4) / .4), flick = Math.floor(c.t * 30) % 3 ? 1 : .55;
    ctx.globalAlpha = .35 * k;
    ctx.strokeStyle = "#b9c6ff";
    ctx.lineWidth = 1;
    ctx.setLineDash([ 3, 5 ]);
    ctx.beginPath();
    ctx.moveTo(o.x, o.y - 16);
    ctx.quadraticCurveTo((o.x + c.x) / 2, (o.y + c.y) / 2 + 40, c.x, c.y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.save();
    ctx.translate(c.x + (flick < 1 ? rand(-4, 4) : 0), c.y);

    ctx.globalAlpha = 1;
    ctx.shadowColor = c0;
    ctx.shadowBlur = 12;
    ctx.lineCap = "round";

    ctx.lineWidth = 5;

  }

}

function drawTears() {
  if (!spider || !spider.tears.length) {
    return;
  }
  const S = cv.width / W, BIG = 3e3;
  for (const T of spider.tears) {
    const k = 1 - T.t / .8;
    if (k <= 0) {
      continue;
    }
    const dx = Math.cos(T.a), dy = Math.sin(T.a), nx = -dy, ny = dx, px = T.x * S, py = T.y * S;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.beginPath();
    ctx.moveTo(px - dx * BIG, py - dy * BIG);
    ctx.lineTo(px + dx * BIG, py + dy * BIG);
    ctx.lineTo(px + dx * BIG + nx * BIG, py + dy * BIG + ny * BIG);
    ctx.lineTo(px - dx * BIG + nx * BIG, py - dy * BIG + ny * BIG);
    ctx.closePath();
    ctx.clip();
    const off = 18 * k * S;
    try {
      ctx.drawImage(cv, dx * off, dy * off);
    } catch (e) {}
    ctx.restore();
    ctx.save();
    ctx.lineCap = "round";
    for (const [col, w, o2] of [ [ "#6a3dff", 3, 3 ], [ "#c4ceff", 3, -3 ], [ "#ffffff", 2 + 3 * k, 0 ] ]) {
      ctx.globalAlpha = (o2 ? .5 : 1) * k;
      ctx.strokeStyle = col;
      ctx.lineWidth = w;
      ctx.shadowColor = FATHERS.pinky.color;
      ctx.shadowBlur = o2 ? 0 : 18;
      ctx.beginPath();
      ctx.moveTo(T.x - dx * 1200 + nx * o2, T.y - dy * 1200 + ny * o2);
      ctx.lineTo(T.x + dx * 1200 + nx * o2, T.y + dy * 1200 + ny * o2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function addZone(z) {
  zones.push(Object.assign({
    t: -(z.delay || 0),
    warn: .5,
    active: .16,
    fade: .35,
    fired: false,
    deco: "",
    ang: 0
  }, z));
}

function zoneHit(z) {
  const pr = player.r * .5, dx = player.x - z.x, dy = player.y - z.y;
  if (z.shape === "ring") {
    const d = Math.hypot(dx, dy);
    return d > z.r0 - pr && d < z.r1 + pr;
  }
  const c = Math.cos(z.ang), s = Math.sin(z.ang), u = dx * c + dy * s, v = -dx * s + dy * c;
  return Math.abs(u) < z.w / 2 + pr && Math.abs(v) < z.h / 2 + pr;
}

function zonePath(z, grow = 0) {
  ctx.beginPath();
  if (z.shape === "ring") {
    ctx.arc(z.x, z.y, z.r1 + grow, 0, Math.PI * 2);
    ctx.arc(z.x, z.y, Math.max(0, z.r0 - grow), 0, Math.PI * 2, true);
  } else {
    ctx.save();
    ctx.translate(z.x, z.y);
    ctx.rotate(z.ang);
    ctx.rect(-z.w / 2 - grow, -z.h / 2 - grow, z.w + grow * 2, z.h + grow * 2);
    ctx.restore();
  }
}

      const u = Math.min(3, Math.floor(spider.rienDone / 3));
      if (u > spider.unlock) {
        spider.unlock = u;
        spider.unlockFlash = 1;
        spider.banner = {
          text: "해금 " + [ "", "I", "II", "III" ][u],
          t: 0,
          color: FATHERS.index.color
        };
      }
    });
    return delay + .5;
  },
  idxReplica() {
    startReplica();
    return 10;
  },
  gangDuo() {
    const ks = arrivedKeys();
    if (ks.length < 2) {
      return SP[pick(FATHER_PATTERNS[ks[0] || "thumb"])]();
    }
    const a = pick(ks);
    let b = pick(ks);
    while (b === a) {
      b = pick(ks);
    }
    spider.banner = {
      text: `${FATHERS[a].finger} · ${FATHERS[b].finger} 합동`,
      t: 0
    };
    const r1 = SP[pick(FATHER_PATTERNS[a])]() || 0;
    later(.35, () => SP[pick(FATHER_PATTERNS[b])]());
    return Math.max(r1, .35 + .6);
  },
  midLaevStab() {
    startLaevStab();
    return 8;
  },
  midLaevExec() {
    startLaevExec();
    return 9;
  },
  allOut() {
    const ks = arrivedKeys();
    const a = pick(ks);
    let b = pick(ks);
    while (ks.length > 1 && b === a) {
      b = pick(ks);
    }
    const pat = k => pick(FATHER_PATTERNS[k].filter(n => n !== "midGrudge"));
    FATHERS[a].pulse = FATHERS[b].pulse = 1;
    const r1 = SP[pat(a)]() || 0;
    if (b !== a) {
      later(.45, () => {
        if (!spiderUltBusy()) {
          SP[pat(b)]();
        }
      });
    }
    return Math.max(r1, .45 + .5);
  },
  support(owner) {
    const ks = arrivedKeys().filter(k => k !== owner);
    if (!ks.length) {
      return 0;
    }
    const k = pick(ks);
    FATHERS[k].pulse = 1;
    return SP[pick(FATHER_PATTERNS[k].filter(n => n !== "midGrudge" && n !== "ringTheater"))]() || 0;
  }
};

function spiderUltBusy() {
  return !!(spider.disposal || spider.closing || spider.laev || spider.rend || spider.replica || spider.lu);
}

const RW_C = {
  body: "#07080c",
  edge: "#8ccfff",
  hi: "#e6f6ff",
  mid: "#2c3a4a",
  silver: "#cfd3da"
};

function rwSwing(kind, x, y, s, reach, warn) {
  const side = Math.random() < .5 ? 1 : -1, a1 = side > 0 ? 0 : Math.PI, R = reach * s;
  spider.rw.push({
    kind,
    mode: "swing",
    s,
    px: x - Math.cos(a1) * R,
    py: y - Math.sin(a1) * R,
    a0: a1 - side * 2.5,
    a1,
    flip: side,
    t: 0,
    warn: warn - .1,
    act: .1,
    fade: .45
  });
}

function rwSlide(kind, s, ang, x0, y0, x1, y1, warn, act, delay = 0) {
  spider.rw.push({
    kind,
    mode: "slide",
    s,
    ang,
    p0: {
      x: x0,
      y: y0
    },
    p1: {
      x: x1,
      y: y1
    },
    t: -delay,
    warn,
    act,
    fade: .4
  });
}

function rwScythe(x, y, a, dir, s, warn) {
  spider.rw.push({
    kind: "scythe",
    mode: "swing",
    s,
    px: x,
    py: y,
    a0: a - dir * 1.7,
    a1: a + dir * 1.3,
    flip: dir,
    t: 0,
    warn,
    act: .16,
    fade: .45,
    fromCenter: true
  });
}

function updateRienWeapons(dt) {
  for (const R of spider.rw) {
    R.t += dt;
    if (R.mode !== "path" && !R.fx && R.t >= R.warn) {
      R.fx = true;
      const P = rwPos(R, R.warn + R.act);
      goldDrip(P.x, P.y, 4);
    }
  }
  spider.rw = spider.rw.filter(R => R.t < R.warn + R.act + R.fade);
}

function rwPos(R, t) {
  if (R.mode === "slide") {
    const u = clamp((t - R.warn) / R.act, 0, 1), e = R.linear ? u : 1 - Math.pow(1 - u, 3);
    return {
      x: R.p0.x + (R.p1.x - R.p0.x) * e,
      y: R.p0.y + (R.p1.y - R.p0.y) * e
    };
  }
  return {
    x: R.px ?? 0,
    y: R.py ?? 0
  };
}

function drawRienWeapons() {
  for (const R of spider.rw) {
    if (R.t < 0) {
      continue;
    }
    const end = R.warn + R.act, a = Math.min(1, R.t / .18) * (R.t > end ? Math.max(0, 1 - (R.t - end) / R.fade) : 1);
    if (a <= 0) {
      continue;
    }
    ctx.save();
    ctx.globalAlpha = a;
    if (R.mode === "path") {
      drawWhip(R);
      ctx.restore();
      continue;
    }
    let ang = R.ang, P = rwPos(R, R.t), back = 0;
    if (R.mode === "swing") {
      if (R.t < R.warn) {
        const e = R.t / R.warn;
        ang = R.a1 + (R.a0 - R.a1) * (1 - Math.pow(1 - e, 2));
      } else {
        const u = Math.min(1, (R.t - R.warn) / R.act);
        ang = R.a0 + (R.a1 - R.a0) * u * u;
      }
      if (R.t >= R.warn && R.t < end) {
        ctx.save();
        ctx.translate(P.x, P.y);
        ctx.globalAlpha = a * .35;
        ctx.strokeStyle = RW_C.edge;
        ctx.lineWidth = 3;
        ctx.shadowColor = RW_C.edge;
        ctx.shadowBlur = 12;
        const rr = (R.kind === "scythe" ? 70 : 60) * R.s;
        ctx.beginPath();
        ctx.arc(0, 0, rr, Math.min(R.a0, ang), Math.max(R.a0, ang));
        ctx.stroke();
        ctx.restore();
      }
    } else if (R.t < R.warn) {
      back = -10 * (R.t / R.warn);
    }
    ctx.translate(P.x, P.y);
    ctx.rotate(ang);
    ctx.translate(back, 0);
    const grow = Math.min(1, R.t / .18);
    ctx.scale(R.s * (.4 + .6 * grow), R.s * (R.flip && R.flip < 0 ? -1 : 1));
    drawRienWeapon(R.kind);
    ctx.restore();
  }
}

function drawRienWeapon(kind) {
  const C = RW_C;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.shadowColor = C.edge;
  ctx.shadowBlur = 9;
  const poly = (pts, fill = C.body, stroke = C.edge, w = 1.1) => {
    ctx.beginPath();
    pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.closePath();
    if (fill) {
      ctx.fillStyle = fill;
      ctx.fill();
    }
    if (stroke) {
      ctx.strokeStyle = stroke;
      ctx.lineWidth = w;
      ctx.stroke();
    }
  };
  const line = (pts, c = C.mid, w = .8) => {
    ctx.beginPath();
    pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.strokeStyle = c;
    ctx.lineWidth = w;
    ctx.stroke();
  };
  const dia = (x, y, r) => poly([ [ x + r, y ], [ x, y - r * .7 ], [ x - r, y ], [ x, y + r * .7 ] ]);
  const shaft = (x0, x1, h = 1.5, step = 11) => {
    poly([ [ x0, -h ], [ x1, -h ], [ x1, h ], [ x0, h ] ]);
    for (let x = x0 + step * .6, k = 0; x < x1 - 3; x += step, k++) {
      const sd = k % 2 ? 1 : -1;
      poly([ [ x - 2, sd * h ], [ x + 1, sd * (h + 3.2) ], [ x + 2.5, sd * h ] ], C.body, C.edge, .8);
    }
  };
  const grip = (len = 14) => {
    poly([ [ -len, -1.4 ], [ 0, -1.4 ], [ 0, 1.4 ], [ -len, 1.4 ] ]);
    ctx.save();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = C.silver;
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(-len + 2, 1.4);
    ctx.quadraticCurveTo(-len + 1, 7.5, -len / 2, 7.5);
    ctx.quadraticCurveTo(1, 7.5, 0, 1.4);
    ctx.stroke();
    ctx.lineWidth = .6;
    ctx.beginPath();
    for (let x = -len + 3; x < -1; x += 2.2) {
      ctx.moveTo(x, 2);
      ctx.lineTo(x + .8, 6.5);
    }
    ctx.stroke();
    ctx.restore();
    dia(-len - 4, 0, 4.5);
  };
  switch (kind) {
   case "hammer":
    grip();
    shaft(0, 56);
    poly([ [ 52, -4 ], [ 57, -4 ], [ 57, 4 ], [ 52, 4 ] ]);
    poly([ [ 57, -17 ], [ 71, -17 ], [ 71, 17 ], [ 57, 17 ] ]);
    line([ [ 57, -6 ], [ 71, -6 ] ], C.edge, .8);
    line([ [ 57, 6 ], [ 71, 6 ] ], C.edge, .8);
    line([ [ 64, -17 ], [ 64, 17 ] ], C.mid, .8);
    poly([ [ 59, -15 ], [ 62, -15 ], [ 62, -8 ], [ 59, -8 ] ], C.mid, null);
    poly([ [ 66, 8 ], [ 69, 8 ], [ 69, 15 ], [ 66, 15 ] ], C.mid, null);
    break;

   case "axe":
    grip(12);
    shaft(0, 44, 1.4, 12);
    poly([ [ 36, -3 ], [ 47, -4 ], [ 49, 3 ], [ 56, 20 ], [ 52, 23 ], [ 38, 21 ], [ 40, 8 ], [ 36, 3 ] ]);
    line([ [ 45, 1 ], [ 51, 19 ] ], C.mid);
    line([ [ 40, 20 ], [ 53, 21 ] ], C.hi, .8);
    poly([ [ 44, -3 ], [ 46, -7 ], [ 48, -3 ] ]);
    break;

   case "stiletto":
    grip(12);
    {
      const top = [], bot = [];
      for (let i = 0; i <= 12; i++) {
        const x = 2 + i * 5, w = 3.2 * (1 - i / 13) + .3, yy = Math.sin(i * .9) * 3.5;
        top.push([ x, yy - w ]);
        bot.push([ x, yy + w ]);
      }
      poly(top.concat([ [ 66, Math.sin(12 * .9) * 3.5 ] ]).concat(bot.reverse()));
    }
    poly([ [ 0, -5 ], [ 3, -5 ], [ 3, 5 ], [ 0, 5 ] ]);
    break;

   case "rapier":
    grip(13);
    poly([ [ 4, -1.3 ], [ 80, -.6 ], [ 88, 0 ], [ 80, .6 ], [ 4, 1.3 ] ]);
    line([ [ 6, 0 ], [ 78, 0 ] ], C.mid, .6);
    poly([ [ 0, -3 ], [ 5, -3 ], [ 5, 3 ], [ 0, 3 ] ]);
    ctx.save();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = C.silver;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.ellipse(3, 0, 3, 6.5, 0, -Math.PI / 2, Math.PI / 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(2, -4);
    ctx.lineTo(10, -6);
    ctx.stroke();
    ctx.restore();
    break;

   case "sword":
    grip(13);
    poly([ [ 0, -6 ], [ 4, -6 ], [ 4, 6 ], [ 0, 6 ] ]);
    dia(2, -8, 2.5);
    dia(2, 8, 2.5);
    poly([ [ 4, -4.5 ], [ 56, -4.5 ], [ 64, .5 ], [ 56, 4.5 ], [ 4, 4.5 ] ]);
    line([ [ 7, 0 ], [ 54, 0 ] ], C.mid, 1);
    break;

   case "bastard":
    grip(15);
    poly([ [ 0, -9 ], [ 4, -9 ], [ 4, 9 ], [ 0, 9 ] ]);
    dia(2, -11, 2.5);
    dia(2, 11, 2.5);
    poly([ [ 4, -2.6 ], [ 80, -1.4 ], [ 92, 0 ], [ 80, 1.4 ], [ 4, 2.6 ] ]);
    for (let x = 14, k = 0; x < 78; x += 11, k++) {
      const sd = k % 2 ? 1 : -1;
      poly([ [ x - 2.5, sd * 2.2 ], [ x + 1, sd * 5.2 ], [ x + 2.5, sd * 2 ] ], C.body, C.edge, .8);
    }
    line([ [ 6, 0 ], [ 78, 0 ] ], C.mid, .7);
    break;

   case "lance":
    grip(14);
    poly([ [ 0, -4 ], [ 6, -4 ], [ 6, 4 ], [ 0, 4 ] ]);
    poly([ [ 6, -10 ], [ 12, -6 ], [ 12, 6 ], [ 6, 10 ], [ 9, 0 ] ]);
    poly([ [ 12, -9.5 ], [ 98, 0 ], [ 12, 9.5 ] ]);
    line([ [ 14, -3 ], [ 92, 0 ] ], C.mid, 1);
    line([ [ 14, 4 ], [ 90, .6 ] ], "#14202c", 1);
    break;

   case "scythe":
    grip(14);
    shaft(0, 62, 1.5, 12);
    poly([ [ 60, -4 ], [ 66, -4 ], [ 66, 4 ], [ 60, 4 ] ]);
    dia(70, 0, 4);
    ctx.beginPath();
    ctx.moveTo(64, -3);
    ctx.quadraticCurveTo(80, 30, 34, 60);
    ctx.quadraticCurveTo(64, 30, 60, 3);
    ctx.closePath();
    ctx.fillStyle = C.body;
    ctx.fill();
    ctx.strokeStyle = C.edge;
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(66, 6);
    ctx.quadraticCurveTo(72, 30, 42, 54);
    ctx.strokeStyle = C.mid;
    ctx.lineWidth = .8;
    ctx.stroke();

  }
}

function drawWhip(R) {
  const h = R.h, P = h.pts, C = RW_C;
  let n = P.length - 1;
  if (R.t < R.warn) {
    n = Math.max(2, Math.round(n * .25 * (R.t / R.warn)));
  } else {
    n = Math.round(n * Math.min(1, (R.t - R.warn) / .08));
  }
  ctx.lineJoin = "round";
  ctx.shadowColor = C.edge;
  ctx.shadowBlur = 8;
  ctx.strokeStyle = C.edge;
  ctx.lineWidth = 3.2;
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    i ? ctx.lineTo(P[i].x, P[i].y) : ctx.moveTo(P[i].x, P[i].y);
  }
  ctx.stroke();
  ctx.strokeStyle = C.body;
  ctx.lineWidth = 1.8;
  ctx.stroke();
  for (let i = 3; i <= n; i += 4) {
    const q = P[i], a = Math.atan2(q.ny, q.nx) + Math.PI / 2;
    ctx.save();
    ctx.translate(q.x, q.y);
    ctx.rotate(a);
    ctx.beginPath();
    ctx.moveTo(6, 0);
    ctx.lineTo(0, -4);
    ctx.lineTo(-6, 0);
    ctx.lineTo(0, 4);
    ctx.closePath();
    ctx.fillStyle = C.body;
    ctx.fill();
    ctx.strokeStyle = C.edge;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(2.5, 0);
    ctx.lineTo(0, -1.6);
    ctx.lineTo(-2.5, 0);
    ctx.lineTo(0, 1.6);
    ctx.closePath();
    ctx.strokeStyle = C.silver;
    ctx.lineWidth = .7;
    ctx.stroke();
    ctx.restore();
  }
  if (n >= P.length - 1) {
    const q = P[n], q0 = P[n - 1];
    ctx.save();
    ctx.translate(q.x, q.y);
    ctx.rotate(Math.atan2(q.y - q0.y, q.x - q0.x));
    ctx.beginPath();
    ctx.moveTo(14, 0);
    ctx.lineTo(0, -5);
    ctx.lineTo(-4, 0);
    ctx.lineTo(0, 5);
    ctx.closePath();
    ctx.fillStyle = C.body;
    ctx.fill();
    ctx.strokeStyle = C.edge;
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.restore();
  }
}

function useEye(n) {

function updatePrecogs(dt) {
  for (const f of spider.precogs) {
    f.t += dt;
    const T = f.t, end = f.track + f.lock + f.dur;
    if (T < f.track) {
      const tx = clamp(player.x + spider.pv.x * .5, 20, W - 20), ty = clamp(player.y + spider.pv.y * .5, 20, H - 20), k = Math.min(1, dt * 4);
      f.x += (tx - f.x) * k;
      f.y += (ty - f.y) * k;
    } else if (T < f.track + f.lock) {
      if (!f.locked) {
        f.locked = true;
        precogFlash(f.x, f.y, .6);
      }
    } else if (T < end) {
      if (!f.fired) {
        f.fired = true;
        shake = Math.max(shake, 12);
        flash = Math.max(flash, .6);
        flashColor = FATHERS.thumb.color;
      }
      shake = Math.max(shake, 4);
      while (T - f.track - f.lock >= f.next) {
        const a = rand(0, Math.PI * 2), r = rand(0, f.R * .4);
        const h = makeSlash({
          cx: f.x + Math.cos(a) * r,
          cy: f.y + Math.sin(a) * r,
          angle: rand(0, Math.PI),
          width: f.k % 2 ? 24 : 34,
          len: f.R * 1.05,
          warn: .001,
          curve: f.k % 2 ? 0 : rand(-50, 50),
          style: f.k % 2 ? "thumbR" : "thumb"
        });
        h.sweep = .05;
        h.active = .08;
        h.fade = .3;
        h.scar = .4;
        hazards.push(h);
        f.k++;
        f.next += .12;
      }
      if (vulnerable() && Math.hypot(player.x - f.x, player.y - f.y) < f.R + player.r * .5) {
        damage({
          angle: rand(0, Math.PI)
        });
      }
    } else if (!f.ended) {
      f.ended = true;
      shake = Math.max(shake, 10);
      const h = makeSlash({
        cx: f.x,
        cy: f.y,
        angle: rand(0, Math.PI),
        width: 48,
        len: f.R * 1.45,
        warn: .001,
        curve: 40,
        style: "thumb"
      });
      h.sweep = .05;
      h.active = .02;
      hazards.push(h);
    }
    if (T > end + f.fade) {
      f.done = true;
    }
  }
  spider.precogs = spider.precogs.filter(f => !f.done);
}

function drawPrecogs() {
  for (const f of spider.precogs) {
    const T = f.t, end = f.track + f.lock + f.dur;
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.shadowColor = PRECOG;
    if (T < f.track) {
      ctx.strokeStyle = PRECOG;
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = .75;
      ctx.setLineDash([ 10, 8 ]);
      ctx.lineDashOffset = -T * 40;
      ctx.beginPath();
      ctx.arc(0, 0, f.R, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.lineWidth = 2;
      ctx.shadowBlur = 8;
      for (let i = 0; i < 4; i++) {
        const a = T * 2.2 + i * Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * (f.R - 10), Math.sin(a) * (f.R - 10));
        ctx.lineTo(Math.cos(a) * (f.R + 6), Math.sin(a) * (f.R + 6));
        ctx.stroke();
      }
      ctx.globalAlpha = .8;
      ctx.beginPath();
      ctx.moveTo(-14, 0);
      ctx.quadraticCurveTo(0, -10, 14, 0);
      ctx.quadraticCurveTo(0, 10, -14, 0);
      ctx.stroke();
      ctx.fillStyle = PRECOG;
      ctx.beginPath();
      ctx.arc(0, 0, 3.2, 0, Math.PI * 2);
      ctx.fill();
    } else if (T < f.track + f.lock) {
      const k = (T - f.track) / f.lock, blink = Math.floor(T * (k > .6 ? 24 : 12)) % 2 ? 1 : .45;
      ctx.fillStyle = FATHERS.thumb.color;
      ctx.globalAlpha = .06 + .16 * k;
      ctx.beginPath();
      ctx.arc(0, 0, f.R, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = FATHERS.thumb.color;
      ctx.shadowColor = FATHERS.thumb.color;
      ctx.lineWidth = 2.5;
      ctx.shadowBlur = 14;
      ctx.globalAlpha = blink;
      ctx.beginPath();
      ctx.arc(0, 0, f.R, 0, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = .6;
      ctx.strokeStyle = STYLE.thumbR.glow;
      ctx.beginPath();
      ctx.arc(0, 0, f.R * (1 - k), 0, Math.PI * 2);
      ctx.stroke();
    } else {
      const k = T < end ? 1 : 1 - (T - end) / f.fade;
      ctx.fillStyle = FATHERS.thumb.color;
      ctx.globalAlpha = Math.max(0, k) * (.1 + Math.random() * .1);
      ctx.beginPath();
      ctx.arc(0, 0, f.R, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = FATHERS.thumb.color;
      ctx.shadowColor = FATHERS.thumb.color;
      ctx.lineWidth = 2;
      ctx.shadowBlur = 16;
      ctx.globalAlpha = Math.max(0, k);
      ctx.beginPath();
      ctx.arc(0, 0, f.R, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

    for (const d of [ 0, Math.PI / 2 ]) {

  for (const h of hazards) {

  if (!MAT_FILL[ph] || !FATHERS.ring.arrived || spider.closing || spider.matDone[ph] || script) {
    return;
  }
  const before = spider.mat;
  spider.mat = Math.min(1, spider.mat + dt / MAT_FILL[ph]);
  if (Math.floor(before * 10) !== Math.floor(spider.mat * 10)) {
    spider.matFlash = 1;
  }
  if (spider.mat >= 1 && !spiderUltBusy()) {
    spider.matDone[ph] = true;
    startClosing();
  }
}

function drawLaevBlade() {
  const C = LAEV_C, poly = pts => {
    ctx.beginPath();
    pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.closePath();
  };
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  const tt = performance.now() / 1e3;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.shadowColor = "#ff5a12";
  ctx.shadowBlur = 10;
  for (let j = 0; j < 3; j++) {
    const amp = 1.1 + j * .7, off = 5 + j * 2.2;
    ctx.beginPath();
    for (let x = 0; x <= 80; x += 3) {
      const f = .35 + x / 80, y = -off * f - Math.max(0, Math.sin(x * .21 - tt * (9 + j * 3) + j * 2)) * amp * f * 1.6;
      x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    for (let x = 80; x >= 0; x -= 3) {
      const f = .35 + x / 80, y = off * f + Math.max(0, Math.sin(x * .19 - tt * (8 + j * 3) + j)) * amp * f * 1.6;
      ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = [ "rgba(255,130,40,0.26)", "rgba(255,90,20,0.16)", "rgba(255,60,10,0.09)" ][j];
    ctx.fill();
  }
  ctx.restore();
  poly([ [ 0, -2.6 ], [ -4, -3.3 ], [ -6, -2.2 ], [ -9, -3.1 ], [ -12, -2.1 ], [ -15, -2.9 ], [ -18, -1.9 ], [ -21, -2.5 ], [ -25.5, 0 ], [ -21, 2.5 ], [ -18, 1.9 ], [ -15, 2.9 ], [ -12, 2.1 ], [ -9, 3.1 ], [ -6, 2.2 ], [ -4, 3.3 ], [ 0, 2.6 ] ]);
  ctx.shadowBlur = 0;
  ctx.fillStyle = C.metal;
  ctx.fill();
  ctx.strokeStyle = "#0a0a0c";
  ctx.lineWidth = .8;
  ctx.stroke();
  ctx.strokeStyle = C.metalHi;
  ctx.lineWidth = .55;
  ctx.beginPath();
  for (const x of [ -4, -9, -15, -21 ]) {
    ctx.moveTo(x, -1.7);
    ctx.lineTo(x - 1.2, 1.7);
  }
  ctx.moveTo(-2, -1.1);
  ctx.lineTo(-23, -.5);
  ctx.stroke();
  poly([ [ 0, -4.6 ], [ 2.2, -4.2 ], [ 2.2, 4.2 ], [ 0, 4.6 ] ]);
  ctx.fillStyle = "#3a3a40";
  ctx.fill();
  ctx.strokeStyle = "#0a0a0c";
  ctx.lineWidth = .8;
  ctx.stroke();
  const blade = [ [ 2.2, -4.2 ], [ 62, -3.4 ], [ 74, -3.7 ], [ 67, 3.4 ], [ 2.2, 4.2 ] ];
  poly(blade);
  ctx.fillStyle = C.blade;
  ctx.shadowColor = "#ff5a12";
  ctx.shadowBlur = 12;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.save();
  poly(blade);
  ctx.clip();
  poly([ [ 2.2, -4.2 ], [ 74, -3.7 ], [ 70, -.5 ], [ 2.2, -.9 ] ]);
  ctx.fillStyle = C.hi;
  ctx.fill();
  ctx.strokeStyle = C.dark;
  ctx.lineWidth = .6;
  ctx.beginPath();
  for (const x of [ 16, 30, 44, 57 ]) {
    ctx.moveTo(x, -4.2);
    ctx.lineTo(x + 3, 4.2);
  }
  ctx.stroke();
  ctx.restore();
  poly([ [ 2.2, -3.1 ], [ 2.2, 3.1 ], [ 32, .2 ] ]);
  ctx.fillStyle = C.core;
  ctx.fill();
  ctx.strokeStyle = "#ff7a1a";
  ctx.lineWidth = .5;
  ctx.stroke();
  poly(blade);
  ctx.strokeStyle = C.edge;
  ctx.lineWidth = .9;
  ctx.stroke();
}

const LAEV_LEN = 74;

function lwSlide(ang, x0, y0, x1, y1, s, warn, act) {
  spider.lw.push({
    mode: "slide",
    ang,
    x0,
    y0,
    x1,
    y1,
    s,
    t: 0,
    warn,
    act,
    fade: .3
  });
}

function lwTrace(h, s) {
  spider.lw.push({
    mode: "trace",
    h,
    s
  });
}

function updateLaevWeapons(dt) {
  for (const R of spider.lw) {
    if (R.mode === "slide") {
      R.t += dt;
    }
  }
  spider.lw = spider.lw.filter(R => R.mode === "trace" ? R.h.t < R.h.warn + R.h.sweep + R.h.active + .45 : R.t < R.warn + R.act + R.fade);
}

function drawLaevWeapons() {
  for (const R of spider.lw) {
    let x, y, ang, a;
    if (R.mode === "slide") {
      const end = R.warn + R.act;
      a = Math.min(1, R.t / .1) * (R.t > end ? Math.max(0, 1 - (R.t - end) / R.fade) : 1);
      const u = clamp((R.t - R.warn) / R.act, 0, 1), e = 1 - Math.pow(1 - u, 3), back = R.t < R.warn ? -14 * (R.t / R.warn) : 0;
      x = R.x0 + (R.x1 - R.x0) * e + Math.cos(R.ang) * back;
      y = R.y0 + (R.y1 - R.y0) * e + Math.sin(R.ang) * back;
      ang = R.ang;
    } else {
      const h = R.h;
      if (h.t < 0) {
        continue;
      }
      const after = h.t - h.warn, u = clamp(after / h.sweep, 0, 1), endT = h.sweep + h.active;
      a = Math.min(1, h.t / .25) * (after > endT ? Math.max(0, 1 - (after - endT) / .45) : 1);
      const N = h.pts.length - 1, f = h.dir === 1 ? u : 1 - u, i = clamp(Math.round(f * N), 1, N - 1);
      const p = h.pts[i], tx = h.pts[i + 1].x - h.pts[i - 1].x, ty = h.pts[i + 1].y - h.pts[i - 1].y, tl = Math.hypot(tx, ty) || 1;
      let nx = -ty / tl, ny = tx / tl;
      const sg = Math.sign(h.curve) || 1;
      if ((nx * p.nx + ny * p.ny) * sg < 0) {
        nx = -nx;
        ny = -ny;
      }
      const lift = after < 0 ? .3 * (1 + after / h.warn) : 0;
      ang = Math.atan2(ny, nx) - (h.dir === 1 ? 1 : -1) * sg * lift;
      const L = LAEV_LEN * R.s * .85;
      x = p.x - Math.cos(ang) * L;
      y = p.y - Math.sin(ang) * L;
    }
    if (a <= 0) {
      continue;
    }
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.scale(R.s, R.s);
    drawLaevBlade();
    ctx.restore();
  }
  drawLaevThrow();
}

function laevBand(h, i0, i1, a, b, sg, k) {
  const P = h.pts;
  ctx.beginPath();
  for (let i = i0; i <= i1; i++) {
    const p = P[i], w = p.hw * k * b * sg;
    i === i0 ? ctx.moveTo(p.x + p.nx * w, p.y + p.ny * w) : ctx.lineTo(p.x + p.nx * w, p.y + p.ny * w);
  }
  for (let i = i1; i >= i0; i--) {
    const p = P[i], w = p.hw * k * a * sg;
    ctx.lineTo(p.x + p.nx * w, p.y + p.ny * w);
  }
  ctx.closePath();
}

function drawLaevGrad(h, i0, i1, k) {
  const sg = Math.sign(h.curve) || 1, kk = .45 + .65 * k;
  for (const [a, b, c, glow, blur] of [ [ -1, 1, "#7a1204", "#ff3a0a", 40 ], [ -.78, 1, "#e8300a", "#ff3a0a", 0 ], [ -.4, 1, "#ff7a1a", "", 0 ], [ .05, 1, "#ffb040", "", 0 ], [ .42, 1, "#ffe2a8", "#fff0d0", 10 ], [ .72, 1, "#ffffff", "#ffffff", 14 ] ]) {
    ctx.fillStyle = c;
    ctx.shadowColor = glow || c;
    ctx.shadowBlur = blur;
    laevBand(h, i0, i1, a, b, sg, kk);
    ctx.fill();
  }
}

function laevStab(dist, width, warn, s, big) {

    y: py + Math.sin(a) * dist
  }, half = (dist + 220) / 2;
  const h = makeSlash({
    cx: o.x + cx * half,
    cy: o.y + cy * half,
    angle: d,

    curve: 0,

    h.active = .22;
